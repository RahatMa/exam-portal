<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MCQ Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="omr-layout.js"></script>
<script defer src="omr-scan.js"></script>

<script>
/* =========================================================
   SETTINGS — the only part you need to edit
   ========================================================= */
const CONFIG = {
  // Paste the Web app URL from Apps Script (Deploy > Manage deployments).
  API_URL: 'https://script.google.com/macros/s/AKfycbwgUvgV8Wh1H0PkRvEATrFAVJn5Fz7TQyJHB-alTYA4WkttWU2Yl96C4mz3z_ftyMdh/exec',
  // Name shown at the top of every page.
  SITE_NAME: 'Marathon MCQ by Rahat Bhai',
  // Shown to students who forget their PIN.
  SUPPORT_CONTACT: 'প্রকাশকের হেল্পলাইন: 01XXXXXXXXX',
  // Folder (on this website) where question images live. A sheet cell can then
  // just say  phy01-q5.png  instead of a full link.
  IMAGE_FOLDER: 'images/',
};
</script>

<style>
:root {
  --desk: #eceef1;
  --paper: #ffffff;
  --text: #1d2026;
  --muted: #5d6470;
  --line: #d9dce2;
  --ink: #cc3d78;          /* OMR "drop-out" ink: printed lines and labels */
  --ink-soft: #f7dbe7;
  --ink-text: #a3285c;     /* darker ink for small text (contrast) */
  --graphite: #2a2d33;     /* a pencil-filled bubble */
  --on-graphite: #ffffff;
  --right: #147a4b;
  --right-soft: #dcf1e6;
  --wrong: #c4321b;
  --wrong-soft: #fbe2dc;
  --focus: #2563eb;
  --flag: #e0a400; --flag-soft: #fff4cc; --flag-text: #7a5600;
  --serif: "Noto Serif Bengali", "Tiro Bangla", "Kohinoor Bangla", serif;
  --sans: "Hind Siliguri", "Noto Sans Bengali", "Kohinoor Bangla", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #131519; --paper: #1d2025; --text: #eceef1; --muted: #a2a8b3; --line: #343841;
    --ink: #f07aa8; --ink-soft: #3a2230; --ink-text: #f59cbf; --graphite: #e9eaed; --on-graphite: #16181c;
    --right: #4cc08a; --right-soft: #17321f; --wrong: #ff7a63; --wrong-soft: #3a1d18; --focus: #7aa7ff;
    --flag: #d9a520; --flag-soft: #3a3010; --flag-text: #f2cf6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #131519; --paper: #1d2025; --text: #eceef1; --muted: #a2a8b3; --line: #343841;
  --ink: #f07aa8; --ink-soft: #3a2230; --ink-text: #f59cbf; --graphite: #e9eaed; --on-graphite: #16181c;
  --right: #4cc08a; --right-soft: #17321f; --wrong: #ff7a63; --wrong-soft: #3a1d18; --focus: #7aa7ff;
    --flag: #d9a520; --flag-soft: #3a3010; --flag-text: #f2cf6b;
  color-scheme: dark;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--desk); color: var(--text);
  font-family: var(--sans); font-size: 1.0625rem; line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
img { max-width: 100%; height: auto; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 46rem; margin: 0 auto; padding: 0 1rem 4rem; }

/* ---------- top bar ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  max-width: 46rem; margin: 0 auto; padding: 1rem 1rem .75rem;
}
.brand { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; text-decoration: none; color: var(--text); }
.book-chip {
  font-size: .8125rem; color: var(--ink-text); border: 1px solid var(--ink); border-radius: 4px;
  padding: .1rem .5rem; letter-spacing: .04em; white-space: nowrap;
}

/* ---------- the paper surface ---------- */
.paper {
  position: relative; background: var(--paper); border-radius: 6px;
  padding: 1.75rem 1.25rem 1.5rem 2.25rem;
  box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line);
}
.paper.has-marks::before {      /* the timing track printed along an OMR sheet's edge */
  content: ""; position: absolute; left: .7rem; top: 2rem; bottom: 2rem; width: .45rem;
  background: repeating-linear-gradient(to bottom, var(--graphite) 0 .5rem, transparent .5rem 1.6rem);
  opacity: .9;
}
.reg { position: absolute; width: .7rem; height: .7rem; background: var(--graphite); }
.reg.tl { top: .55rem; left: .55rem; } .reg.tr { top: .55rem; right: .55rem; }
.reg.bl { bottom: .55rem; left: .55rem; } .reg.br { bottom: .55rem; right: .55rem; }

h1, h2 { font-family: var(--serif); font-weight: 700; line-height: 1.3; margin: 0; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.2rem; }
.lede { color: var(--muted); margin: .4rem 0 0; }
.stack > * + * { margin-top: 1rem; }

/* ---------- forms ---------- */
label.field { display: block; }
label.field span { display: block; font-weight: 600; font-size: .95rem; margin-bottom: .3rem; }
label.field small { display: block; color: var(--muted); font-size: .85rem; margin-top: .25rem; }
input.text {
  width: 100%; padding: .7rem .8rem; border: 1.5px solid var(--line); border-radius: 6px;
  background: var(--paper); font-size: 1.05rem;
}
input.text:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--ink-soft); }
input.code { letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 2.75rem; padding: .55rem 1.1rem; border-radius: 6px; cursor: pointer;
  border: 1.5px solid var(--graphite); background: var(--graphite); color: var(--on-graphite);
  font-weight: 600; text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--graphite); }
.btn.link { border: 0; background: none; color: var(--ink-text); padding: .3rem 0; min-height: 0; text-decoration: underline; text-underline-offset: 3px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; }

.alert { border-left: 4px solid var(--wrong); background: var(--wrong-soft); padding: .6rem .8rem; border-radius: 0 6px 6px 0; }
.note { border-left: 4px solid var(--ink); background: var(--ink-soft); padding: .6rem .8rem; border-radius: 0 6px 6px 0; font-size: .95rem; }

/* ---------- dashboard ---------- */
.hello { padding: 1.25rem 0 1rem; }
.hello h1 { font-size: 1.75rem; }
.progress { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .6rem; margin-top: .75rem; color: var(--muted); }
.dots { display: inline-flex; flex-wrap: wrap; gap: .3rem; }
.dot { width: 1rem; height: 1rem; border-radius: 50%; border: 1.5px solid var(--ink); }
.dot.on { background: var(--graphite); border-color: var(--graphite); }

.exams { list-style: none; margin: 0; padding: 0; }
.exam { padding: 1.1rem 0; border-top: 1px dashed var(--line); }
.exam:first-child { border-top: 0; padding-top: 0; }
.exam:last-child { padding-bottom: 0; }
.exam h2 { font-size: 1.15rem; }
.exam .meta { color: var(--muted); font-size: .92rem; margin: .15rem 0 .5rem; }
.status { font-size: .95rem; margin: 0 0 .7rem; }
.status b { font-weight: 600; }
.status.done b { color: var(--right); }
.status.todo b { color: var(--ink-text); }

.sideline { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 1.25rem; }

/* ---------- OMR answer sheet ---------- */
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 1rem; align-items: baseline; padding-bottom: .9rem; border-bottom: 1.5px solid var(--ink); }
.sheet-head h1 { font-size: 1.25rem; }
.mode { font-size: .85rem; font-weight: 600; padding: .1rem .55rem; border-radius: 4px; border: 1.5px solid currentColor; white-space: nowrap; }
.mode.main { color: var(--ink-text); }
.mode.practice { color: var(--muted); }
.howto { color: var(--muted); font-size: .92rem; margin: .8rem 0 1rem; }
.scanbox { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; margin: 1rem 0 .4rem; }
.scanbox .btn svg { width: 1.25rem; height: 1.25rem; }
.scanbox span { color: var(--muted); font-size: .92rem; }
.scanresult { margin: .8rem 0 1rem; }
.scanresult p { margin: 0; }
.scanpv { display: block; width: 100%; height: auto; margin-top: .5rem; border: 1px solid var(--line); border-radius: 4px; }
.omr-row { flex-wrap: wrap; border-radius: 6px; }
.omr-row.flag { background: var(--flag-soft); box-shadow: 0 0 0 2px var(--flag); }
.flagtext { flex-basis: 100%; padding-left: 2.55rem; font-size: .8rem; font-weight: 600; color: var(--flag-text); line-height: 1.3; padding-bottom: .15rem; }

.omr { columns: 2 15rem; column-gap: 2.5rem; }
.omr-block { break-inside: avoid; padding: .35rem 0 .9rem; }
.omr-row { display: flex; align-items: center; gap: .55rem; padding: .22rem 0; }
.qn {
  width: 2rem; text-align: right; font-weight: 600; color: var(--ink-text); font-size: .95rem;
  font-variant-numeric: tabular-nums;
}
.bubble {
  width: 2.35rem; height: 2.35rem; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1.6px solid var(--ink); background: transparent; color: var(--ink-text);
  font-weight: 600; font-size: .95rem; line-height: 1; display: grid; place-items: center;
  transition: background-color .12s, border-color .12s, transform .12s;
}
.bubble:hover { background: var(--ink-soft); }
.bubble[aria-pressed="true"] { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); transform: scale(1.04); }
@media (prefers-reduced-motion: reduce) { .bubble { transition: none; } .bubble[aria-pressed="true"] { transform: none; } }

.submitbar {
  position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5; margin-top: 1rem;
  background: var(--paper); border-top: 1.5px solid var(--ink);
  display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .75rem 0 .25rem;
}
.count { font-size: .92rem; color: var(--muted); line-height: 1.35; }
.submitbar .btn { white-space: nowrap; flex: none; }
.count b { color: var(--text); font-size: 1.1rem; }

/* ---------- result ---------- */
.slip { display: grid; grid-template-columns: auto 1fr; gap: .5rem 1.5rem; align-items: center; }
.score { font-family: var(--serif); font-weight: 700; line-height: 1; font-size: 3.4rem; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.4rem; color: var(--muted); font-weight: 500; }
.tally { list-style: none; margin: 0; padding: 0; display: grid; gap: .15rem; font-size: .98rem; }
.tally li { display: flex; align-items: center; gap: .5rem; }
.tally i { width: .8rem; height: .8rem; border-radius: 50%; display: inline-block; }
.tally .r i { background: var(--right); } .tally .w i { background: var(--wrong); } .tally .b i { border: 1.5px dashed var(--muted); }
@media (max-width: 420px) { .slip { grid-template-columns: 1fr; } }

.filters { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1.25rem 0 .75rem; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: .3rem .85rem; cursor: pointer; font-size: .92rem; }
.chip[aria-pressed="true"] { border-color: var(--graphite); background: var(--graphite); color: var(--on-graphite); }

.qcard { padding: 1.1rem 0 1.2rem; border-top: 1px dashed var(--line); }
.qcard:first-of-type { border-top: 0; }
.qhead { display: flex; align-items: center; gap: .6rem; margin-bottom: .4rem; }
.qno { font-weight: 700; color: var(--ink-text); }
.verdict { font-size: .82rem; font-weight: 600; padding: .05rem .5rem; border-radius: 4px; }
.verdict.correct { background: var(--right-soft); color: var(--right); }
.verdict.wrong { background: var(--wrong-soft); color: var(--wrong); }
.verdict.blank { border: 1px dashed var(--muted); color: var(--muted); }
.qtext { overflow-wrap: anywhere; }
.qimg {
  display: block; max-width: 100%; margin: .6rem 0; padding: .3rem; cursor: zoom-in;
  background: #fff; border: 1px solid var(--line); border-radius: 4px;  /* white so diagrams stay readable in dark mode */
}
.opt .qimg { max-height: 11rem; margin: .3rem 0; }
.imgmiss { display: block; margin: .5rem 0; padding: .4rem .6rem; font-size: .85rem; color: var(--wrong); border: 1px dashed var(--wrong); border-radius: 4px; }
dialog.zoom { padding: 0; width: calc(100vw - 1rem); max-width: 64rem; max-height: calc(100vh - 2rem); overflow: hidden; }
.zoom .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .5rem .8rem; border-bottom: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
.zoom .pane { overflow: auto; max-height: calc(100vh - 6rem); background: #fff; }
.zoom .pane img { display: block; width: 100%; height: auto; cursor: zoom-in; }
.zoom .pane img.big { width: 220%; max-width: none; cursor: zoom-out; }
.adminnote { margin-bottom: 1rem; }
.hiddenlabel { font-size: .8rem; font-weight: 600; color: var(--muted); border: 1px dashed var(--muted); border-radius: 4px; padding: 0 .4rem; margin-left: .4rem; vertical-align: middle; }
.opts { list-style: none; margin: .7rem 0 0; padding: 0; display: grid; gap: .35rem; }
.opt { display: flex; align-items: flex-start; gap: .6rem; padding: .35rem .5rem; border-radius: 6px; }
.opt .b {
  flex: none; width: 1.9rem; height: 1.9rem; border-radius: 50%; border: 1.5px solid var(--ink);
  display: grid; place-items: center; font-size: .85rem; font-weight: 600; color: var(--ink-text); margin-top: .05rem;
}
.opt .t { flex: 1; overflow-x: auto; }
.opt .tag { display: block; font-size: .8rem; font-weight: 600; }
.opt.is-right { background: var(--right-soft); }
.opt.is-right .b { background: var(--right); border-color: var(--right); color: #fff; }
.opt.is-right .tag { color: var(--right); }
.opt.is-wrong { background: var(--wrong-soft); }
.opt.is-wrong .b { background: var(--wrong); border-color: var(--wrong); color: #fff; }
.opt.is-wrong .tag { color: var(--wrong); }
.soltoggle { margin-top: .6rem; }
.solution { margin-top: .5rem; padding: .8rem 1rem; border-left: 3px solid var(--ink); background: var(--ink-soft); border-radius: 0 6px 6px 0; overflow-x: auto; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: .15rem 0; margin: .4rem 0; }

/* ---------- leaderboard ---------- */
.tablewrap { overflow-x: auto; }
table.board { width: 100%; border-collapse: collapse; font-size: .97rem; }
.board th { text-align: left; font-weight: 600; color: var(--ink-text); border-bottom: 1.5px solid var(--ink); padding: .4rem .5rem; white-space: nowrap; }
.board td { padding: .55rem .5rem; border-bottom: 1px dashed var(--line); vertical-align: top; }
.board td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.board tr.me td { background: var(--ink-soft); font-weight: 600; }
.myrank { font-family: var(--serif); font-size: 1.15rem; }

/* ---------- busy / dialog ---------- */
.busy { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--desk) 70%, transparent); z-index: 50; }
.busy div { display: flex; align-items: center; gap: .7rem; background: var(--paper); padding: .9rem 1.2rem; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
.spin { width: 1.4rem; height: 1.4rem; border-radius: 50%; border: 2.5px solid var(--ink-soft); border-top-color: var(--ink); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }

dialog { border: 0; border-radius: 8px; padding: 1.4rem; max-width: min(28rem, calc(100vw - 2rem)); background: var(--paper); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(20, 22, 26, .45); }
dialog h2 { margin-bottom: .5rem; }
dialog .actions { margin-top: 1.2rem; justify-content: flex-end; }

.foot { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 2rem; }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#/" id="brand"></a>
  <span class="book-chip" id="bookChip" hidden></span>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<div class="busy" id="busy" hidden><div><span class="spin" aria-hidden="true"></span><span>লোড হচ্ছে…</span></div></div>

<dialog id="zoom" class="zoom" aria-label="ছবি বড় করে দেখুন">
  <div class="bar"><span>ছবিতে চাপ দিলে আরও বড় হবে</span><button class="btn ghost" id="zClose">বন্ধ করুন</button></div>
  <div class="pane"><img id="zImg" alt=""></div>
</dialog>

<dialog id="confirm">
  <h2 id="cTitle"></h2>
  <div id="cBody"></div>
  <div class="actions">
    <button class="btn ghost" value="no" id="cNo">ফিরে যান</button>
    <button class="btn" value="yes" id="cYes"></button>
  </div>
</dialog>

<script>
(function () {
'use strict';

/* ---------- tiny helpers ---------- */
const LABELS = ['ক', 'খ', 'গ', 'ঘ'];
const KEYS = ['A', 'B', 'C', 'D'];
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const bn = v => String(v).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const enDigits = v => String(v ?? '').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
const labelOf = k => LABELS[KEYS.indexOf(k)] || '';

// Text from the sheet: keep line breaks, keep \[ … \] on one line, then typeset math.
function rich(s) {
  let t = String(s ?? '').replace(/\r/g, '');
  t = t.replace(/\\\[([\s\S]*?)\\\]/g, m => m.replace(/\n/g, ' '));
  t = t.replace(/\n?(\\\[[\s\S]*?\\\])\n?/g, '$1');
  t = t.replace(/\n?(\[img:[^\]]*\])\n?/gi, '$1');
  return esc(t)
    .replace(/\[img:\s*([^\]\s]+)\s*\]/gi, (m, ref) => imgTag(ref.replace(/&amp;/g, '&'), 'চিত্র'))
    .replace(/\n/g, '<br>');
}

/* ---------- images ----------
   A sheet cell can hold: a file name in the images folder (phy01-q5.png),
   a full https:// link, or a Google Drive share link. */
function imgSrc(ref) {
  ref = String(ref ?? '').trim();
  if (!ref) return '';
  const drive = ref.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if (drive) return 'https://drive.google.com/thumbnail?id=' + drive[1] + '&sz=w2000';
  if (/^https:\/\//i.test(ref)) return ref;
  if (/^[\w-][\w\-./]*\.(png|jpe?g|gif|webp|svg)$/i.test(ref) && !ref.includes('..')) return CONFIG.IMAGE_FOLDER + ref;
  return '';
}
function imgTag(ref, alt) {
  if (!String(ref ?? '').trim()) return '';
  const src = imgSrc(ref);
  if (!src) return `<span class="imgmiss">ছবির নাম বা লিংক বোঝা যায়নি: ${esc(ref)}</span>`;
  return `<img class="qimg" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" data-ref="${esc(ref)}">`;
}
function typeset(el) {
  if (window.renderMathInElement) {
    window.renderMathInElement(el, {
      delimiters: [
        { left: '\\[', right: '\\]', display: true },
        { left: '$$', right: '$$', display: true },
        { left: '\\(', right: '\\)', display: false },
      ],
      throwOnError: false,
    });
  } else {
    window.addEventListener('load', () => typeset(el), { once: true });
  }
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* ---------- state ---------- */
let session = store.get('omr_session') || {};
let dash = null;        // dashboard data from the server
let lastResult = null;  // result shown on #/result

function msg(err) {
  let m = MESSAGES[err.code] || 'কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।';
  if (err.code === 'PIN_WRONG' && err.data && err.data.attemptsLeft !== undefined) m += ' আর ' + bn(err.data.attemptsLeft) + ' বার চেষ্টা করা যাবে।';
  return m;
}

let busyTimer;
function busy(on) {
  clearTimeout(busyTimer);
  if (on) busyTimer = setTimeout(() => { $('#busy').hidden = false; }, 250);
  else $('#busy').hidden = true;
}

async function api(action, data = {}) {
  if (!/^https:\/\//.test(CONFIG.API_URL) && !/^http:\/\/localhost/.test(CONFIG.API_URL)) throw Object.assign(new Error('CONFIG'), { code: 'CONFIG' });
  busy(true);
  try {
    let res;
    try {
      res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data)) });
    } catch (e) { throw Object.assign(new Error('NETWORK'), { code: 'NETWORK' }); }
    let json;
    try { json = await res.json(); } catch (e) { throw Object.assign(new Error('NETWORK'), { code: 'NETWORK' }); }
    if (!json.ok) throw Object.assign(new Error(json.error), { code: json.error, data: json });
    return json;
  } finally { busy(false); }
}
const authed = (action, data = {}) => api(action, Object.assign({ bookId: session.bookId, pin: session.pin }, data));

// If an authenticated call fails because of the PIN or registration, go back to sign-in.
function handleAuthError(err) {
  if (['PIN_WRONG', 'PIN_NOT_SET', 'NOT_REGISTERED', 'PIN_LOCKED'].includes(err.code)) {
    delete session.pin; saveSession(); dash = null;
    signIn(msg(err));
    return true;
  }
  if (['BOOK_NOT_FOUND', 'BOOK_BLOCKED'].includes(err.code)) {
    session = {}; saveSession(); dash = null;
    viewEntry(msg(err));
    return true;
  }
  return false;
}

async function signIn(error) {
  if (!session.bookId) return viewEntry(error);
  try {
    const r = await api('login', { bookId: session.bookId, pin: session.pin });
    session.bookId = r.bookId; saveSession();
    if (r.state === 'register') return viewRegister();
    if (r.state === 'set_pin') return viewSetPin();
    if (r.state === 'pin') return viewPin(error);
    dash = r; route();
  } catch (err) {
    if (err.code === 'PIN_WRONG' || err.code === 'PIN_LOCKED') { delete session.pin; saveSession(); return viewPin(msg(err)); }
    if (err.code === 'BOOK_NOT_FOUND' || err.code === 'BOOK_BLOCKED') { session = {}; saveSession(); return viewEntry(msg(err)); }
    viewProblem(msg(err), () => signIn(error));
  }
}

/* ---------- OMR answer sheet ---------- */
function viewSheet(examId) {
  const exam = dash.exams.find(e => e.id === examId);
  if (!exam) { location.hash = '#/'; return; }
  const n = exam.numQuestions;
  const isMain = !exam.main && !dash.admin;
  const draftKey = `omr_draft_${session.bookId}_${exam.id}`;
  let answers = store.get(draftKey);
  if (!Array.isArray(answers) || answers.length !== n) answers = Array(n).fill('');

  let rows = '';
  for (let b = 0; b < n; b += 5) {
    rows += '<div class="omr-block">';
    for (let i = b; i < Math.min(b + 5, n); i++) {
      rows += `<div class="omr-row" role="group" aria-label="প্রশ্ন ${bn(i + 1)}"><span class="qn">${bn(i + 1)}</span>` +
        KEYS.map((k, j) => `<button type="button" class="bubble" data-q="${i}" data-k="${k}" aria-pressed="${answers[i] === k}" aria-label="প্রশ্ন ${bn(i + 1)}, উত্তর ${LABELS[j]}">${LABELS[j]}</button>`).join('') +
        `</div>`;
    }
    rows += '</div>';
  }

  paint(`
  <section class="paper has-marks">${marks}
    <div class="sheet-head">
      <h1>${esc(exam.name)}</h1>
      <span class="mode ${isMain ? 'main' : 'practice'}">${isMain ? 'মূল পরীক্ষা' : dash.admin ? 'প্রিভিউ: নম্বর সংরক্ষিত হবে না' : 'অনুশীলন: নম্বর সংরক্ষিত হবে না'}</span>
    </div>
    <div class="scanbox">
      <button class="btn" id="scan" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>ক্যামেরা দিয়ে OMR স্ক্যান করুন</button>
      <span>অথবা নিচের বৃত্তগুলোতে নিজে চাপুন</span>
    </div>
    <div class="scanresult note" id="scanResult" hidden></div>
    <p class="howto">বইয়ের OMR শিটে যে বৃত্তগুলো ভরাট করেছেন, এখানে ঠিক সেগুলোই থাকতে হবে। ভুল চাপলে আবার চাপলে মুছে যাবে।</p>
    <div class="omr" id="omr">${rows}</div>
    <div class="submitbar">
      <span class="count" id="count"></span>
      <button class="btn" id="send">${isMain ? 'মূল উত্তর জমা দিন' : 'উত্তর মিলিয়ে দেখুন'}</button>
    </div>
  </section>
  <div class="sideline"><a class="btn link" href="#/">পরীক্ষার তালিকায় ফিরে যান</a></div>`, { noFocus: true });

  let flags = Array(n).fill('');
  const setFlag = (row, f) => {
    row.classList.toggle('flag', !!f);
    let t = row.querySelector('.flagtext');
    if (f) {
      if (!t) { t = document.createElement('span'); t.className = 'flagtext'; row.appendChild(t); }
      t.textContent = ((window.OMRScanner && OMRScanner.FLAG_TEXT[f]) || 'যাচাই করুন') + '। বইয়ের সাথে মিলিয়ে ঠিক বৃত্তে চাপুন।';
    } else if (t) t.remove();
  };

  $('#scan').onclick = () => {
    if (!window.OMRScanner) { alert('স্ক্যানার লোড হয়নি। পাতাটি রিফ্রেশ করে আবার চেষ্টা করুন।'); return; }
    OMRScanner.open({ n, examId: exam.id, onResult: applyScan });
  };
  function applyScan(res) {
    answers = res.answers.slice();
    flags = res.flags.slice();
    store.set(draftKey, answers);
    document.querySelectorAll('#omr .omr-row').forEach((row, i) => {
      row.querySelectorAll('.bubble').forEach(b => b.setAttribute('aria-pressed', String(answers[i] === b.dataset.k)));
      setFlag(row, flags[i]);
    });
    updateCount();
    const flagged = flags.filter(Boolean).length, read = answers.filter(Boolean).length;
    const box = $('#scanResult');
    box.hidden = false;
    box.innerHTML = `<p><b>স্ক্যান সম্পন্ন।</b> ${bn(n)}টির মধ্যে ${bn(read)}টি প্রশ্নের উত্তর পড়া গেছে। ` +
      (flagged ? `হলুদ চিহ্নিত ${bn(flagged)}টি প্রশ্ন বইয়ের OMR-এর সাথে মিলিয়ে ঠিক করুন, তারপর জমা দিন।` : 'বইয়ের OMR-এর সাথে একবার মিলিয়ে নিয়ে জমা দিন।') +
      `</p><button class="btn link" type="button" id="pvToggle" aria-expanded="false">স্ক্যান করা পাতা দেখুন</button><div id="pv" hidden></div>`;
    if (res.preview) { res.preview.className = 'scanpv'; res.preview.setAttribute('role', 'img'); res.preview.setAttribute('aria-label', 'স্ক্যান করা OMR পাতা'); $('#pv').appendChild(res.preview); }
    else $('#pvToggle').hidden = true;
    $('#pvToggle').onclick = e => {
      const open = e.target.getAttribute('aria-expanded') !== 'true';
      e.target.setAttribute('aria-expanded', String(open));
      e.target.textContent = open ? 'স্ক্যান করা পাতা লুকান' : 'স্ক্যান করা পাতা দেখুন';
      $('#pv').hidden = !open;
    };
    const firstFlag = document.querySelector('#omr .omr-row.flag');
    (firstFlag || box).scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  const updateCount = () => {
    const done = answers.filter(Boolean).length;
    $('#count').innerHTML = `উত্তর দেওয়া হয়েছে <b>${bn(done)}</b> / ${bn(n)}`;
  };
  updateCount();

  $('#omr').addEventListener('click', e => {
    const btn = e.target.closest('.bubble');
    if (!btn) return;
    const q = +btn.dataset.q, k = btn.dataset.k;
    answers[q] = answers[q] === k ? '' : k;
    flags[q] = ''; setFlag(btn.parentElement, '');
    btn.parentElement.querySelectorAll('.bubble').forEach(b => b.setAttribute('aria-pressed', String(answers[q] === b.dataset.k)));
    store.set(draftKey, answers);
    updateCount();
  });

  $('#send').onclick = async () => {
    const blanks = answers.filter(a => !a).length;
    const flagged = flags.filter(Boolean).length;
    const ok = await ask(
      isMain ? 'মূল উত্তর জমা দেবেন?' : 'উত্তর মিলিয়ে দেখবেন?',
      (isMain
        ? '<p>এটি এই পরীক্ষার আপনার একমাত্র মূল জমা। জমা দেওয়ার পর নম্বর সংরক্ষিত হবে এবং আর বদলানো যাবে না।</p>'
        : '<p>এটি অনুশীলন। ফলাফল দেখাবে, কিন্তু নম্বর সংরক্ষিত হবে না।</p>') +
      (blanks ? `<p><b>${bn(blanks)}টি প্রশ্নের উত্তর ফাঁকা আছে।</b></p>` : '') +
      (flagged ? `<p><b>${bn(flagged)}টি প্রশ্ন এখনো হলুদ চিহ্নিত।</b> স্ক্যানে সেগুলো নিশ্চিতভাবে পড়া যায়নি।</p>` : ''),
      isMain ? 'জমা দিন' : 'মিলিয়ে দেখুন');
    if (!ok) return;
    try {
      const r = await authed('submit', { examId: exam.id, answers });
      store.del(draftKey);
      if (r.mode === 'main') {
        exam.main = { score: r.result.score, total: r.result.total };
        dash.completed = dash.exams.filter(e => e.main).length;
      }
      lastResult = r;
      if (location.hash === '#/result') viewResult(); else location.hash = '#/result';
    } catch (err) {
      if (handleAuthError(err)) return;
      alert(msg(err));
    }
  };
}

/* ---------- result ---------- */
async function loadReview(examId) {
  try {
    lastResult = await authed('review', { examId });
    viewResult();
  } catch (err) {
    if (handleAuthError(err)) return;
    viewProblem(msg(err), () => loadReview(examId));
  }
}

function viewResult() {
  const r = lastResult;
  if (!r) { location.hash = '#/'; return; }
  const g = r.result;
  const modeText = {
    main: 'মূল পরীক্ষার ফলাফল। নম্বর সংরক্ষিত হয়েছে।',
    practice: 'অনুশীলনের ফলাফল। এই নম্বর সংরক্ষিত হয়নি।',
    review: 'আপনার সংরক্ষিত মূল পরীক্ষার ফলাফল।',
  }[r.mode];

  const items = g.items.map(it => {
    const opts = it.options.map((o, j) => {
      const k = KEYS[j];
      const right = k === it.correct, mine = k === it.given;
      const cls = right ? 'is-right' : (mine ? 'is-wrong' : '');
      const tag = right && mine ? 'আপনার উত্তর, সঠিক' : right ? 'সঠিক উত্তর' : mine ? 'আপনার উত্তর' : '';
      return `<li class="opt ${cls}"><span class="b">${LABELS[j]}</span><span class="t">${rich(o)}${tag ? `<span class="tag">${tag}</span>` : ''}</span></li>`;
    }).join('');
    const verdict = { correct: 'সঠিক', wrong: 'ভুল', blank: 'উত্তর দেননি' }[it.status];
    const img = imgTag(it.image, `প্রশ্ন ${bn(it.no)}-এর চিত্র`);
    return `<article class="qcard" data-status="${it.status}">
      <div class="qhead"><span class="qno">প্রশ্ন ${bn(it.no)}</span><span class="verdict ${it.status}">${verdict}</span></div>
      <div class="qtext">${rich(it.question)}</div>${img}
      <ol class="opts">${opts}</ol>
      ${it.solution || it.solutionImage ? `<button class="btn link soltoggle" aria-expanded="false">সমাধান দেখুন</button>
      <div class="solution" hidden>${rich(it.solution)}${imgTag(it.solutionImage, `প্রশ্ন ${bn(it.no)}-এর সমাধানের চিত্র`)}</div>` : ''}
    </article>`;
  }).join('');

  paint(`
  <section class="paper">${marks}
    <h1 style="font-size:1.25rem">${esc(r.exam.name)}</h1>
    <p class="lede" style="margin-bottom:1rem">${modeText}</p>
    <div class="slip">
      <div class="score">${bn(g.score)}<small> / ${bn(g.total)}</small></div>
      <ul class="tally">
        <li class="r"><i></i>সঠিক ${bn(g.correct)}টি</li>
        <li class="w"><i></i>ভুল ${bn(g.wrong)}টি</li>
        <li class="b"><i></i>উত্তর দেননি ${bn(g.blank)}টি</li>
      </ul>
    </div>
  </section>
  <div class="filters" role="group" aria-label="প্রশ্ন বাছাই">
    <button class="chip" data-f="all" aria-pressed="true">সব ${bn(g.items.length)}</button>
    <button class="chip" data-f="wrong" aria-pressed="false">ভুল ${bn(g.wrong)}</button>
    <button class="chip" data-f="blank" aria-pressed="false">ফাঁকা ${bn(g.blank)}</button>
    <button class="chip" data-f="correct" aria-pressed="false">সঠিক ${bn(g.correct)}</button>
  </div>
  <section class="paper" id="qs">${items}</section>
  <div class="sideline"><a class="btn" href="#/">পরীক্ষার তালিকায় ফিরে যান</a></div>`, { noFocus: true });

  typeset($('#qs'));

  $('.filters').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
    document.querySelectorAll('.qcard').forEach(q => { q.hidden = c.dataset.f !== 'all' && q.dataset.status !== c.dataset.f; });
  });
  $('#qs').addEventListener('click', e => {
    const b = e.target.closest('.soltoggle'); if (!b) return;
    const open = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', String(open));
    b.textContent = open ? 'সমাধান লুকান' : 'সমাধান দেখুন';
    b.nextElementSibling.hidden = !open;
  });
}

/* ---------- leaderboard ---------- */
async function viewLeaderboard() {
  let r;
  try { r = await authed('leaderboard'); }
  catch (err) { if (handleAuthError(err)) return; return viewProblem(msg(err), viewLeaderboard); }

  if (!r.published) {
    paint(`<section class="paper stack">${marks}
      <h1>শীর্ষ তালিকা</h1>
      <p>শীর্ষ শিক্ষার্থীদের তালিকা এখনো প্রকাশিত হয়নি। বইয়ের সবগুলো মূল পরীক্ষা শেষ করলে আপনি তালিকায় আসার যোগ্য হবেন। শীর্ষ শিক্ষার্থীদের নিয়ে পরে প্রতিযোগিতার আয়োজন করা হবে।</p>
      <p class="note">আপনার অগ্রগতি: ${bn(r.totalExams)}টির মধ্যে ${bn(r.completed)}টি মূল পরীক্ষা সম্পন্ন।</p>
    </section>
    <div class="sideline"><a class="btn ghost" href="#/">পরীক্ষার তালিকায় ফিরে যান</a></div>`, { noFocus: true });
    return;
  }
  const rows = r.top.map(x => `<tr class="${x.me ? 'me' : ''}"><td class="n">${bn(x.rank)}</td><td>${esc(x.name)}</td><td>${esc(x.institution)}</td><td class="n">${bn(x.score)} / ${bn(x.total)}</td></tr>`).join('');
  const mine = r.me
    ? `<p class="myrank">আপনার অবস্থান ${bn(r.participants)} জনের মধ্যে ${bn(r.me.rank)}, মোট ${bn(r.me.score)} / ${bn(r.me.total)} নম্বর।</p>`
    : `<p class="note">তালিকায় আসতে বইয়ের সবগুলো মূল পরীক্ষা শেষ করুন। আপনার অগ্রগতি: ${bn(r.totalExams)}টির মধ্যে ${bn(r.completed)}টি।</p>`;
  paint(`<section class="paper stack">${marks}
    <h1>শীর্ষ ${bn(r.top.length)} শিক্ষার্থী</h1>
    ${mine}
    <div class="tablewrap"><table class="board">
      <thead><tr><th>অবস্থান</th><th>নাম</th><th>প্রতিষ্ঠান</th><th>নম্বর</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4">এখনো কেউ পুরো বই শেষ করেনি।</td></tr>'}</tbody>
    </table></div>
    <p class="lede" style="font-size:.9rem">নম্বর সমান হলে যিনি আগে সবগুলো পরীক্ষা শেষ করেছেন তিনি এগিয়ে থাকবেন।</p>
  </section>
  <div class="sideline"><a class="btn ghost" href="#/">পরীক্ষার তালিকায় ফিরে যান</a></div>`, { noFocus: true });
}

/* ---------- confirm dialog ---------- */
function ask(title, bodyHtml, yesText) {
  const d = $('#confirm');
  $('#cTitle').textContent = title;
  $('#cBody').innerHTML = bodyHtml;
  $('#cYes').textContent = yesText;
  return new Promise(resolve => {
    const done = v => { d.close(); $('#cYes').onclick = $('#cNo').onclick = null; resolve(v); };
    $('#cYes').onclick = () => done(true);
    $('#cNo').onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal();
    $('#cNo').focus();
  });
}

/* ---------- image zoom & broken images ---------- */
app.addEventListener('click', e => {
  const img = e.target.closest('img.qimg');
  if (!img) return;
  const z = $('#zImg');
  z.src = img.currentSrc || img.src; z.alt = img.alt; z.classList.remove('big');
  $('#zoom').showModal();
});
$('#zImg').addEventListener('click', e => e.target.classList.toggle('big'));
$('#zClose').addEventListener('click', () => $('#zoom').close());
$('#zoom').addEventListener('click', e => { if (e.target.id === 'zoom') $('#zoom').close(); });
app.addEventListener('error', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains('qimg')) return;
  const note = document.createElement('span');
  note.className = 'imgmiss';
  note.textContent = 'ছবিটি লোড হয়নি: ' + (img.dataset.ref || img.src);
  img.replaceWith(note);
}, true);

/* ---------- routing ---------- */
function route() {
  if (!session.bookId) return viewEntry();
  if (!dash) return signIn();
  const h = location.hash.replace(/^#\/?/, '');
  const [page, arg] = h.split('/');
  const id = arg ? decodeURIComponent(arg) : '';
  if (page === 'exam') return viewSheet(id);
  if (page === 'review') return loadReview(id);
  if (page === 'result') return viewResult();
  if (page === 'leaderboard') return viewLeaderboard();
  viewDashboard();
}
window.addEventListener('hashchange', route);

/* ---------- start ---------- */
(function boot() {
  const p = new URLSearchParams(location.search);
  const fromQr = (p.get('book') || '').trim().toUpperCase().replace(/\s+/g, '');
  if (fromQr) {
    if (fromQr !== session.bookId) session = { bookId: fromQr };
    saveSession();
    history.replaceState(null, '', location.pathname + location.hash); // hide the ID from the address bar
  }
  setChrome();
  route();
})();
})();
</script>
