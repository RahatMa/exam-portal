<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>OMR sheet maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="omr-layout.js?v=a5-3"></script>
<script src="omr-draw.js?v=1"></script>
<style>
:root { --text: #1d2026; --muted: #5d6470; --line: #d9dce2; --desk: #eceef1; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--desk); color: var(--text); font: 16px/1.55 system-ui, sans-serif; }
.wrap { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
p { margin: .25rem 0 1rem; color: var(--muted); }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1rem; display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
label span { display: block; font-weight: 600; margin-bottom: .25rem; font-size: .92rem; }
input, select { width: 100%; font: inherit; padding: .5rem .65rem; border: 1.5px solid var(--line); border-radius: 6px; background: #fff; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin: 1rem 0; }
button { font: inherit; font-weight: 600; padding: .55rem 1rem; border-radius: 6px; border: 1.5px solid #2a2d33; background: #2a2d33; color: #fff; cursor: pointer; }
button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.preview { background: #fff; box-shadow: 0 0 0 1px var(--line); max-width: 34rem; margin: 0 auto; }
.preview svg { display: block; width: 100%; height: auto; }
#msg { color: #b3261e; font-weight: 600; }
@media print {
  @page { size: A5; margin: 0; }
  body { background: #fff; }
  .no-print { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .preview { box-shadow: none; max-width: none; }
  .preview svg { width: 148mm; height: 210mm; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print">
    <p style="margin:0 0 .5rem"><a href="admin.html">← Admin portal</a></p>
    <h1>OMR sheet maker</h1>
    <p>Makes an A5 answer sheet (148 × 210 mm, up to 60 questions). Make one sheet per exam. The camera scanner reads exactly this layout, so always print from here. Make sure the number of questions matches the exam in the Google Sheet.</p>
    <div class="panel">
      <label style="grid-column: 1 / -1"><span>Website address (scanning the sheet's QR opens this exam here)</span><input id="site" placeholder="https://exam.yourdomain.com/"></label>
      <label><span>Exam ID (same as the Exams tab)</span><input id="examId" value="PHY-01"></label>
      <label><span>Exam name</span><input id="examName" value="নিউটনিয়ান বলবিদ্যা: মডেল টেস্ট ১"></label>
      <label><span>Number of questions (1–60)</span><input id="n" type="number" min="1" max="60" value="20"></label>
      <label><span>Book name</span><input id="book" value="পদার্থবিজ্ঞান অনুশীলন বই"></label>
      <label><span>Bubble ink</span>
        <select id="ink">
          <option value="pink">Pink (recommended, colour printing)</option>
          <option value="grey">Light grey (black-and-white printing)</option>
        </select></label>
    </div>
    <div class="actions">
      <button id="print">Print or save as PDF</button>
      <button class="ghost" id="svg">Download SVG (for your book designer)</button>
      <span id="msg"></span>
    </div>
  </div>
  <div class="preview" id="preview"></div>
</div>

<script>
const L = window.OMR_LAYOUT;
const $ = s => document.querySelector(s);
const bn = v => String(v).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LABELS = ['ক', 'খ', 'গ', 'ঘ'];
const SANS = "'Hind Siliguri','Noto Sans Bengali',sans-serif";
const SERIF = "'Noto Serif Bengali','Hind Siliguri',serif";

function build() {
  $('#msg').textContent = '';
  try {
    return OMR_DRAW.svg({
      examId: $('#examId').value, examName: $('#examName').value, n: $('#n').value,
      book: $('#book').value, site: $('#site').value, ink: $('#ink').value,
    });
  } catch (e) { $('#msg').textContent = e.message; return ''; }
}

// When this page is opened from your own website, fill in its address automatically.
if (/^https:/.test(location.protocol)) $('#site').value = location.href.replace(/[?#].*$/, '').replace(/omr-sheet\.html$/, '');

function render() { const s = build(); if (s) $('#preview').innerHTML = s; }
document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', render));
$('#print').onclick = () => { render(); window.print(); };
$('#svg').onclick = () => {
  const s = build(); if (!s) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml' }));
  a.download = 'omr-' + $('#examId').value.trim().toUpperCase() + '.svg';
  a.click(); URL.revokeObjectURL(a.href);
};
render();
</script>
</body>
</html>
