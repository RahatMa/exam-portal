<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="docx-import.js?v=1"></script>
<script src="config.js?v=1"></script>
<style>
:root {
  --desk: #eceef1; --paper: #fff; --text: #1d2026; --muted: #5d6470; --line: #d9dce2;
  --ink: #cc3d78; --ink-soft: #f7dbe7; --ink-text: #a3285c; --graphite: #2a2d33; --on-graphite: #fff;
  --ok: #147a4b; --ok-soft: #dcf1e6; --bad: #c4321b; --bad-soft: #fbe2dc; --focus: #2563eb;
  --sans: "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #131519; --paper: #1d2025; --text: #eceef1; --muted: #a2a8b3; --line: #343841;
    --ink: #f07aa8; --ink-soft: #3a2230; --ink-text: #f59cbf; --graphite: #e9eaed; --on-graphite: #16181c;
    --ok: #4cc08a; --ok-soft: #17321f; --bad: #ff7a63; --bad-soft: #3a1d18; --focus: #7aa7ff; color-scheme: dark;
  }
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--text); font: 15px/1.55 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* layout */
.shell { display: grid; grid-template-columns: 14rem 1fr; min-height: 100vh; }
.side { background: var(--paper); border-right: 1px solid var(--line); padding: 1rem .75rem; display: flex; flex-direction: column; gap: .2rem; }
.side .brand { font-family: "Noto Serif Bengali", var(--sans); font-weight: 700; padding: .2rem .6rem .9rem; line-height: 1.3; }
.side .brand small { display: block; font-family: var(--sans); font-weight: 600; color: var(--ink-text); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
.side a { display: block; padding: .45rem .6rem; border-radius: 6px; color: var(--text); text-decoration: none; font-weight: 500; }
.side a:hover { background: var(--desk); }
.side a[aria-current="page"] { background: var(--ink-soft); color: var(--ink-text); font-weight: 600; }
.side .me { margin-top: auto; padding: .8rem .6rem 0; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
.side .me b { display: block; color: var(--text); }
main { padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 4rem; max-width: 70rem; width: 100%; }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding: .6rem; position: sticky; top: 0; z-index: 5; }
  .side .brand { padding: 0 .6rem 0 .2rem; flex-basis: 100%; }
  .side .me { margin: 0 0 0 auto; padding: 0; border: 0; }
  .side .me b { display: none; }
}

h1 { font-size: 1.45rem; margin: 0 0 .2rem; line-height: 1.3; }
h2 { font-size: 1.1rem; margin: 0; }
.lede { color: var(--muted); margin: 0 0 1.2rem; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; }
.stack > * + * { margin-top: 1rem; }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; gap: .35rem; min-height: 2.4rem; padding: .4rem .9rem; border-radius: 6px; cursor: pointer;
  border: 1.5px solid var(--graphite); background: var(--graphite); color: var(--on-graphite); font-weight: 600; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--graphite); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { min-height: 2rem; padding: .2rem .65rem; font-size: .88rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--ink-text); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 600; }

label.f { display: block; }
label.f > span { display: block; font-weight: 600; font-size: .88rem; margin-bottom: .25rem; }
label.f small { display: block; color: var(--muted); font-size: .8rem; margin-top: .2rem; }
input.t, select.t { width: 100%; padding: .5rem .65rem; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); }
input.t:focus, select.t:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--ink-soft); }
.check { display: flex; gap: .5rem; align-items: center; font-weight: 500; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

.alert { border-left: 4px solid var(--bad); background: var(--bad-soft); padding: .55rem .8rem; border-radius: 0 6px 6px 0; }
.note { border-left: 4px solid var(--ink); background: var(--ink-soft); padding: .55rem .8rem; border-radius: 0 6px 6px 0; }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; padding: 0 .5rem; border-radius: 999px; border: 1px solid currentColor; line-height: 1.6; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.off { color: var(--muted); } .pill.super { color: var(--ink-text); }
.muted { color: var(--muted); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: .45rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n { font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
code { font-size: .88em; background: var(--desk); padding: .05rem .35rem; border-radius: 4px; }

/* catalog */
.titles { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.titles button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: .3rem .9rem; cursor: pointer; font-weight: 600; }
.titles button[aria-pressed="true"] { border-color: var(--graphite); background: var(--graphite); color: var(--on-graphite); }
.subj + .subj { margin-top: 1rem; }
.subj header { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .4rem; }

/* sign-in */
.center { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.center .card { width: min(26rem, 100%); padding: 1.6rem; }

dialog { border: 0; border-radius: 10px; padding: 1.3rem; width: min(32rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); background: var(--paper); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(20,22,26,.45); }
dialog h2 { margin-bottom: .9rem; }
dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 1.2rem; }
dialog .actions .left { margin-right: auto; }

.toast { position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--graphite); color: var(--on-graphite);
  padding: .55rem 1rem; border-radius: 8px; font-weight: 600; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--ink), transparent); background-size: 50% 100%; animation: slide 1s linear infinite; z-index: 70; }
@keyframes slide { from { background-position: -50% 0; } to { background-position: 150% 0; } }
@media (prefers-reduced-motion: reduce) { .busy { animation: none; background: var(--ink); } }

/* questions */
.qcard { border-top: 1px solid var(--line); padding: .9rem 0; display: grid; grid-template-columns: 2.2rem 1fr auto; gap: .3rem .8rem; }
.qcard:first-child { border-top: 0; }
.qnum { font-weight: 700; color: var(--ink-text); }
.qbody .qt { overflow-wrap: anywhere; }
.qopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .15rem 1rem; margin-top: .35rem; font-size: .93rem; }
.qopts .right { color: var(--ok); font-weight: 600; }
.qtools { display: flex; gap: .3rem; align-items: start; flex-wrap: wrap; justify-content: flex-end; }
.qimg { display: block; max-width: 100%; max-height: 14rem; margin: .4rem 0; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: .2rem; }
.imgmiss { color: var(--bad); font-size: .85rem; }
dialog.wide { width: min(68rem, calc(100vw - 2rem)); }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.2rem; }
@media (max-width: 860px) { .editor { grid-template-columns: 1fr; } }
textarea.t { width: 100%; padding: .5rem .65rem; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); font: inherit; resize: vertical; min-height: 4.5rem; }
textarea.t:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--ink-soft); }
.mathbar { display: flex; gap: .25rem; flex-wrap: wrap; margin: .2rem 0 .5rem; }
.mathbar button { border: 1px solid var(--line); background: var(--desk); border-radius: 5px; padding: .1rem .5rem; cursor: pointer; font-size: .85rem; }
.ansrow { display: flex; gap: .4rem; }
.ansrow label { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1.6px solid var(--ink); color: var(--ink-text); font-weight: 700; cursor: pointer; }
.ansrow input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ansrow input:checked + span { color: var(--on-graphite); }
.ansrow label:has(input:checked) { background: var(--graphite); border-color: var(--graphite); }
.ansrow label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.editor > div:last-child .preview { position: sticky; top: 0; }
.preview { border: 1px dashed var(--line); border-radius: 8px; padding: .9rem 1rem; background: var(--desk); }
.preview .lbl { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: .4rem; }
.preview .po { display: flex; gap: .5rem; padding: .2rem .4rem; border-radius: 5px; }
.preview .po.right { background: var(--ok-soft); }
.preview .sol { margin-top: .6rem; padding-top: .6rem; border-top: 1px dashed var(--line); }
.katex-display { overflow-x: auto; overflow-y: hidden; }

/* results */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .7rem; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: .7rem .9rem; }
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .82rem; }
.bars { display: grid; grid-template-columns: repeat(10, 1fr); gap: .3rem; align-items: end; height: 7rem; }
.bars div { background: var(--ink); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.bars div span { position: absolute; top: -1.2rem; left: 0; right: 0; text-align: center; font-size: .72rem; color: var(--muted); }
.barlbl { display: grid; grid-template-columns: repeat(10, 1fr); gap: .3rem; font-size: .7rem; color: var(--muted); text-align: center; margin-top: .25rem; }
.pct { display: flex; align-items: center; gap: .5rem; min-width: 8rem; }
.pct i { display: block; height: .5rem; border-radius: 3px; background: var(--ok); }
.pct.low i { background: var(--bad); }
.tabs { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tabs a { padding: .35rem .9rem; border-radius: 999px; border: 1.5px solid var(--line); text-decoration: none; color: var(--text); font-weight: 600; background: var(--paper); }
.tabs a[aria-current="page"] { background: var(--graphite); color: var(--on-graphite); border-color: var(--graphite); }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: .3rem; }
.ans-grid span { border-radius: 5px; padding: .2rem .4rem; font-size: .85rem; text-align: center; }
.ans-grid .correct { background: var(--ok-soft); color: var(--ok); }
.ans-grid .wrong { background: var(--bad-soft); color: var(--bad); }
.ans-grid .blank { border: 1px dashed var(--line); color: var(--muted); }
td a { color: var(--ink-text); font-weight: 600; }
.ids { font-family: ui-monospace, monospace; font-size: .85rem; max-height: 10rem; overflow: auto; background: var(--desk); padding: .5rem .7rem; border-radius: 6px; columns: 4 8rem; }
</style>
</head>
<body>
<div id="root"></div>
<div class="busy" id="busy" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
(function () {
'use strict';
const CFG = Object.assign({ API_URL: '', SITE_NAME: 'Portal' }, window.PORTAL_CONFIG || {});
const API_URL = String(CFG.API_URL || '').trim();
const ADMIN_VERSION = '2.5';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let token = store.get('omr_admin_token') || '';
let me = null, cat = null, selTitle = null;

const ERR = {
  NETWORK: 'Could not reach the server. Check the internet connection.',
  CONFIG: 'API_URL in config.js is not set.',
  UNKNOWN_ACTION: 'Your Apps Script is an old version. Paste the new Code.gs and deploy a New version.',
  NOT_SET_UP: 'Run OMR Portal > "1. Set up / upgrade sheets" in the Google Sheet first.',
  BAD_SETUP_CODE: 'That setup code is not right. Find it in the Settings tab (ADMIN_SETUP_CODE).',
  ALREADY_SET_UP: 'A super admin already exists. Sign in instead.',
  LOGIN_FAILED: 'Wrong email or password.',
  LOGIN_LOCKED: 'Too many wrong tries. Try again in an hour.',
  NOT_SIGNED_IN: 'Please sign in again.',
  SUPER_ONLY: 'Only a super admin can do this.',
  INVALID_EMAIL: 'Enter a valid email address.',
  INVALID_NAME: 'Enter a name (2 or more characters).',
  WEAK_PASSWORD: 'Password must be at least 8 characters.',
  CANNOT_DEMOTE_SELF: "You can't remove your own super admin role or disable yourself.",
  INVALID_EXAM_ID: 'Exam ID: 2–20 characters, only letters, numbers and - _ . (for example PHY-02).',
  EXAM_ID_TAKEN: 'That exam ID is already used.',
  INVALID_MARKING: 'Marks for correct must be above 0; marks for wrong must be 0 or negative (e.g. -0.25).',
  SUBJECT_HAS_EXAMS: 'Move or delete this subject’s exams first.',
  TITLE_HAS_SUBJECTS: 'Delete this book’s subjects first.',
  TITLE_HAS_BOOKS: 'Book IDs (printed copies) belong to this book, so it can’t be deleted. Mark it inactive instead.',
  TITLE_NOT_FOUND: 'That book no longer exists. Reload the page.',
  SUBJECT_NOT_FOUND: 'Choose a subject.',
  BUSY: 'The server is busy. Try again in a few seconds.',
};
const errText = e => ERR[e.code] || ('Something went wrong (' + (e.code || e.message || e) + ').');

let busyN = 0;
function busy(d) { busyN += d; $('#busy').hidden = busyN <= 0; }
async function api(action, data = {}) {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL) && !/^http:\/\/localhost/.test(API_URL)) throw { code: 'CONFIG' };
  busy(1);
  try {
    let res;
    try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token }, data)) }); }
    catch (e) { throw { code: 'NETWORK' }; }
    const j = await res.json().catch(() => ({ ok: false, error: 'NETWORK' }));
    if (!j.ok) {
      if (j.error === 'NOT_SIGNED_IN') { token = ''; store.del('omr_admin_token'); me = null; setTimeout(() => showSignIn(ERR.NOT_SIGNED_IN), 0); }
      throw { code: j.error, data: j };
    }
    return j;
  } finally { busy(-1); }
}
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

/* ---------- dialog helper ---------- */
function dialog(html, onSubmit, init) {
  const d = $('#dlg'), f = $('#dlgForm');
  f.innerHTML = html;
  f.onsubmit = async e => {
    const btn = e.submitter;
    if (!btn || btn.value === 'cancel') return;
    e.preventDefault();
    const box = f.querySelector('.err');
    try {
      btn.disabled = true;
      const r = await onSubmit(btn.value, f);
      if (r !== false) d.close();
    } catch (err) {
      if (err && err.code === 'NOT_SIGNED_IN') { d.close(); return; }
      if (box) { box.hidden = false; box.textContent = errText(err); }
    } finally { btn.disabled = false; }
  };
  if (init) init(f);
  d.showModal();
  const first = f.querySelector('input:not([readonly]):not([type=checkbox]), select');
  if (first) first.focus();
}

/* ---------- sign-in & first setup ---------- */
async function boot() {
  if (token) {
    try { me = (await api('adminMe')).admin; return route(); } catch (e) { if (e.code !== 'NOT_SIGNED_IN') return showSignIn(errText(e)); }
  }
  try {
    const s = await api('adminStatus');
    if (s.needsSetup) return showSetup();
  } catch (e) { return showSignIn(errText(e)); }
  showSignIn();
}

function centerCard(html) { $('#root').innerHTML = `<div class="center"><div class="card stack">${html}</div></div>`; }

function showSignIn(error) {
  centerCard(`
    <div><h1>${esc(CFG.SITE_NAME)}</h1><p class="lede" style="margin:0">Admin sign-in · version ${ADMIN_VERSION}</p></div>
    ${error ? `<p class="alert" role="alert">${esc(error)}</p>` : ''}
    <form id="f" class="stack">
      <label class="f"><span>Email</span><input class="t" name="email" type="email" autocomplete="username" required autofocus></label>
      <label class="f"><span>Password</span><input class="t" name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" style="width:100%;justify-content:center">Sign in</button>
    </form>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await api('adminLogin', { email: e.target.email.value, password: e.target.password.value });
      token = r.token; store.set('omr_admin_token', token); me = r.admin;
      location.hash = '#/'; route();
    } catch (err) { showSignIn(errText(err)); }
  };
}

function showSetup(error) {
  centerCard(`
    <div><h1>Create the super admin</h1><p class="lede" style="margin:0">One-time setup. The setup code is in the Google Sheet's Settings tab (<code>ADMIN_SETUP_CODE</code>), or use OMR Portal &gt; Show admin setup code.</p></div>
    ${error ? `<p class="alert" role="alert">${esc(error)}</p>` : ''}
    <form id="f" class="stack">
      <label class="f"><span>Setup code</span><input class="t" name="code" autocomplete="off" required autofocus></label>
      <label class="f"><span>Your name</span><input class="t" name="name" autocomplete="name" required></label>
      <label class="f"><span>Email</span><input class="t" name="email" type="email" autocomplete="username" required></label>
      <label class="f"><span>Password</span><input class="t" name="password" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
      <button class="btn" style="width:100%;justify-content:center">Create super admin</button>
    </form>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    try {
      const r = await api('adminSetup', { setupCode: f.code.value.trim(), name: f.name.value, email: f.email.value, password: f.password.value });
      token = r.token; store.set('omr_admin_token', token); me = r.admin;
      location.hash = '#/'; route();
    } catch (err) { showSetup(errText(err)); }
  };
}

async function signOut() {
  try { await api('adminLogout'); } catch (e) {}
  token = ''; store.del('omr_admin_token'); me = null; showSignIn();
}

/* ---------- shell ---------- */
const NAV = [
  { id: '', label: 'Books & exams' },
  { id: 'questions', label: 'Questions' },
  { id: 'results', label: 'Results' },
  { id: 'print', label: 'Print papers', href: 'print.html' },
  { id: 'omr', label: 'OMR sheet maker', href: 'omr-sheet.html' },
  { id: 'bookids', label: 'Book IDs & QR', super: true },
  { id: 'students', label: 'Students', super: true },
  { id: 'settings', label: 'Settings', super: true },
  { id: 'admins', label: 'Admins', super: true },
  { id: 'log', label: 'Activity log', super: true },
  { id: 'account', label: 'My account' },
];
function shell(page, html) {
  $('#root').innerHTML = `<div class="shell">
    <nav class="side" aria-label="Admin">
      <div class="brand"><small>Admin</small>${esc(CFG.SITE_NAME)}</div>
      ${NAV.filter(n => !n.super || me.role === 'super').map(n => `<a href="${n.href || '#/' + n.id}" ${n.id === page ? 'aria-current="page"' : ''}>${n.label}</a>`).join('')}
      <div class="me"><b>${esc(me.name)}</b>${me.role === 'super' ? 'Super admin' : 'Editor'} · <button class="link" id="out">Sign out</button><br><small>Admin version ${ADMIN_VERSION}</small></div>
    </nav>
    <main id="main">${html}</main></div>`;
  $('#out').onclick = signOut;
}

function route() {
  if (!me) return boot();
  const [page, arg] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  if (page === 'questions') return viewQuestions(arg);
  if (page === 'import') return viewImport(arg);
  if (page === 'results') return viewResults(arg);
  if (page === 'bookids' && me.role === 'super') return viewBookIds();
  if (page === 'students' && me.role === 'super') return viewStudents();
  if (page === 'settings' && me.role === 'super') return viewSettings();
  if (page === 'admins' && me.role === 'super') return viewAdmins();
  if (page === 'log' && me.role === 'super') return viewLog();
  if (page === 'account') return viewAccount();
  return viewCatalog();
}
window.addEventListener('hashchange', () => { if (me) route(); });

/* ---------- books, subjects, exams ---------- */
async function viewCatalog() {
  shell('', '<p class="muted">Loading…</p>');
  try { cat = await api('catalog'); } catch (e) { if (e.code !== 'NOT_SIGNED_IN') $('#main').innerHTML = `<p class="alert">${esc(errText(e))}</p>`; return; }
  renderCatalog();
}

function renderCatalog() {
  if (!cat.titles.some(t => t.id === selTitle)) selTitle = cat.titles.length ? cat.titles[0].id : null;
  const t = cat.titles.find(x => x.id === selTitle);
  const subs = t ? cat.subjects.filter(s => s.titleId === t.id) : [];
  const examRows = s => {
    const ex = cat.exams.filter(e => e.subjectId === s.id);
    if (!ex.length) return '<p class="muted" style="margin:.2rem 0 0">No exams yet.</p>';
    return `<div class="tw"><table><thead><tr><th>Exam ID</th><th>Name</th><th>Questions</th><th>Results</th><th>Marking</th><th>Students see it</th><th></th></tr></thead><tbody>
      ${ex.map(e => `<tr>
        <td><code>${esc(e.id)}</code></td><td>${esc(e.name)}</td>
        <td class="n">${e.questions}</td><td class="n">${e.attempts}</td>
        <td class="n">${e.markCorrect === null && e.markWrong === null ? `<span class="muted">default</span>` : `+${e.markCorrect === null ? cat.defaults.markCorrect : e.markCorrect} / ${e.markWrong === null ? cat.defaults.markWrong : e.markWrong}`}</td>
        <td>${e.open ? '<span class="pill ok">Open</span>' : '<span class="pill off">Hidden</span>'}</td>
        <td style="text-align:right"><button class="btn ghost sm" data-exam="${esc(e.id)}">Edit</button></td></tr>`).join('')}
      </tbody></table></div>`;
  };
  $('#main').innerHTML = `
    <div class="row" style="margin-bottom:.2rem"><h1>Books & exams</h1><span class="spacer"></span><button class="btn" id="addTitle">+ Add book</button></div>
    <p class="lede">A <b>book</b> is what you publish. It holds <b>subjects</b>, and each subject holds <b>exams</b>. One book ID (printed copy) unlocks every subject and exam in its book.</p>
    ${cat.titles.length ? `<div class="titles" role="group" aria-label="Books">${cat.titles.map(x => `<button data-title="${esc(x.id)}" aria-pressed="${x.id === selTitle}">${esc(x.name)}${x.active ? '' : ' (inactive)'}</button>`).join('')}</div>` : '<p class="note">No books yet. Add your first book.</p>'}
    ${t ? `<div class="card stack">
      <div class="row"><div><h2>${esc(t.name)}</h2><span class="muted">ID <code>${esc(t.id)}</code> · ${t.books} printed cop${t.books === 1 ? 'y' : 'ies'} · ${subs.length} subject${subs.length === 1 ? '' : 's'}</span></div>
        <span class="spacer"></span><button class="btn ghost sm" id="editTitle">Edit book</button><button class="btn sm" id="addSubject">+ Add subject</button></div>
      ${subs.length ? subs.map(s => `<section class="subj">
        <header><h2>${esc(s.name)}</h2><span class="spacer"></span>
          <button class="btn ghost sm" data-subject="${esc(s.id)}">Edit subject</button>
          <button class="btn sm" data-addexam="${esc(s.id)}">+ Add exam</button></header>
        ${examRows(s)}</section>`).join('') : '<p class="muted">No subjects yet. Add one, for example "পদার্থবিজ্ঞান".</p>'}
    </div>` : ''}`;

  $('#addTitle').onclick = () => titleDialog(null);
  document.querySelectorAll('[data-title]').forEach(b => { b.onclick = () => { selTitle = b.dataset.title; renderCatalog(); }; });
  if (t) {
    $('#editTitle').onclick = () => titleDialog(t);
    $('#addSubject').onclick = () => subjectDialog(null);
  }
  document.querySelectorAll('[data-subject]').forEach(b => { b.onclick = () => subjectDialog(cat.subjects.find(s => s.id === b.dataset.subject)); });
  document.querySelectorAll('[data-addexam]').forEach(b => { b.onclick = () => examDialog(null, b.dataset.addexam); });
  document.querySelectorAll('[data-exam]').forEach(b => { b.onclick = () => examDialog(cat.exams.find(e => e.id === b.dataset.exam)); });
}

const dlgButtons = (saveText, del) => `<p class="alert err" role="alert" hidden></p>
  <div class="actions">${del ? `<button class="btn danger left" value="delete" formnovalidate>${del}</button>` : ''}
  <button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="save">${saveText}</button></div>`;

function titleDialog(t) {
  dialog(`<h2>${t ? 'Edit book' : 'Add a book'}</h2><div class="stack">
    <label class="f"><span>Book name</span><input class="t" name="name" value="${esc(t ? t.name : '')}" required maxlength="100"><small>Shown to students at the top of their page, e.g. "এইচএসসি বিজ্ঞান অনুশীলন বই ২০২৬".</small></label>
    <div class="grid2"><label class="f"><span>Order</span><input class="t" name="order" type="number" value="${t ? t.order : cat.titles.length + 1}"></label>
    <label class="f"><span>&nbsp;</span><span class="check"><input type="checkbox" name="active" ${!t || t.active ? 'checked' : ''}> Active</span></label></div>
    </div>${dlgButtons(t ? 'Save' : 'Add book', t && me.role === 'super' ? 'Delete book' : '')}`,
  async (v, f) => {
    if (v === 'delete') {
      if (!confirm(`Delete the book "${t.name}"?`)) return false;
      cat = await api('titleDelete', { id: t.id }); toast('Book deleted');
    } else {
      cat = await api('titleSave', { id: t ? t.id : '', name: f.name.value, order: f.order.value, active: f.active.checked });
      if (!t) selTitle = cat.titles[cat.titles.length - 1].id;
      toast(t ? 'Book saved' : 'Book added');
    }
    renderCatalog();
  });
}

function subjectDialog(s) {
  dialog(`<h2>${s ? 'Edit subject' : 'Add a subject'}</h2><div class="stack">
    <label class="f"><span>Subject name</span><input class="t" name="name" value="${esc(s ? s.name : '')}" required maxlength="80"></label>
    <div class="grid2"><label class="f"><span>Book</span><select class="t" name="title">${cat.titles.map(x => `<option value="${esc(x.id)}" ${(s ? s.titleId : selTitle) === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
    <label class="f"><span>Order</span><input class="t" name="order" type="number" value="${s ? s.order : cat.subjects.filter(x => x.titleId === selTitle).length + 1}"></label></div>
    </div>${dlgButtons(s ? 'Save' : 'Add subject', s ? 'Delete subject' : '')}`,
  async (v, f) => {
    if (v === 'delete') {
      if (!confirm(`Delete the subject "${s.name}"?`)) return false;
      cat = await api('subjectDelete', { id: s.id }); toast('Subject deleted');
    } else {
      cat = await api('subjectSave', { id: s ? s.id : '', name: f.name.value, titleId: f.title.value, order: f.order.value });
      selTitle = f.title.value; toast(s ? 'Subject saved' : 'Subject added');
    }
    renderCatalog();
  });
}

function examDialog(e, subjectId) {
  const subs = cat.subjects.map(s => {
    const t = cat.titles.find(x => x.id === s.titleId);
    return `<option value="${esc(s.id)}" ${(e ? e.subjectId : subjectId) === s.id ? 'selected' : ''}>${esc((t ? t.name + ' › ' : '') + s.name)}</option>`;
  }).join('');
  const canDelete = e && (e.attempts === 0 || me.role === 'super');
  dialog(`<h2>${e ? 'Edit exam' : 'Add an exam'}</h2><div class="stack">
    <div class="grid2">
      <label class="f"><span>Exam ID</span><input class="t" name="id" value="${esc(e ? e.id : '')}" ${e ? 'readonly' : 'required'} maxlength="20" pattern="[A-Za-z0-9_.\\-]{2,20}" style="text-transform:uppercase">
        <small>${e ? 'Can’t be changed: it is printed in the OMR sheet’s QR code.' : 'Short code, e.g. PHY-02. Printed on the OMR sheet.'}</small></label>
      <label class="f"><span>Order</span><input class="t" name="order" type="number" value="${e ? e.order : cat.exams.filter(x => x.subjectId === subjectId).length + 1}"></label>
    </div>
    <label class="f"><span>Exam name</span><input class="t" name="name" value="${esc(e ? e.name : '')}" required maxlength="120"></label>
    <label class="f"><span>Subject</span><select class="t" name="subject" required>${subs}</select></label>
    <div class="grid2">
      <label class="f"><span>Marks per correct answer</span><input class="t" name="mc" type="number" step="0.01" min="0.01" value="${e && e.markCorrect !== null ? e.markCorrect : ''}" placeholder="Default: ${cat.defaults.markCorrect}"></label>
      <label class="f"><span>Marks per wrong answer</span><input class="t" name="mw" type="number" step="0.01" max="0" value="${e && e.markWrong !== null ? e.markWrong : ''}" placeholder="Default: ${cat.defaults.markWrong}"><small>Use a negative number such as -0.25 for negative marking.</small></label>
    </div>
    <label class="check"><input type="checkbox" name="open" ${e && e.open ? 'checked' : ''}> Students can see and take this exam</label>
    ${e && e.attempts ? `<p class="note">${e.attempts} student result(s) exist. After changing marking, scores are recalculated with "Recalculate all scores" in the Sheet menu.</p>` : ''}
    </div>${dlgButtons(e ? 'Save' : 'Add exam', canDelete ? 'Delete exam' : '')}`,
  async (v, f) => {
    if (v === 'delete') {
      let confirmId = '';
      if (e.attempts) {
        confirmId = prompt(`"${e.id}" has ${e.attempts} student result(s). Deleting removes the exam and its ${e.questions} question(s); results stay in the Attempts tab.\n\nType the exam ID to confirm:`);
        if (confirmId === null) return false;
        confirmId = confirmId.trim().toUpperCase();
      } else if (!confirm(`Delete "${e.id}" and its ${e.questions} question(s)?`)) return false;
      cat = await api('examDelete', { id: e.id, confirm: confirmId }); toast('Exam deleted');
    } else {
      cat = await api('examSave', {
        isNew: !e, id: f.id.value.trim().toUpperCase(), name: f.name.value, subjectId: f.subject.value, order: f.order.value,
        open: f.open.checked, markCorrect: f.mc.value, markWrong: f.mw.value,
      });
      const s = cat.subjects.find(x => x.id === f.subject.value); if (s) selTitle = s.titleId;
      toast(e ? 'Exam saved' : 'Exam added');
    }
    renderCatalog();
  });
}

      <label class="f"><span>&nbsp;</span><span class="check"><input type="checkbox" name="active" ${!a || a.active ? 'checked' : ''}> Can sign in</span></label></div>

    </div>${dlgButtons(a ? 'Save' : 'Add admin')}`,
  async (v, f) => {
    list = (await api('adminSave', { email: f.email.value, name: f.name.value, role: f.role.value, active: f.active.checked, password: f.password.value })).admins;
    toast(a ? 'Admin saved' : 'Admin added'); draw();
  });
  draw();
}

function viewAccount() {
  shell('account', `<h1>My account</h1><p class="lede">${esc(me.name)} · ${esc(me.email)} · ${me.role === 'super' ? 'Super admin' : 'Editor'}</p>
    <form class="card stack" id="pw" style="max-width:28rem">

      <div><button class="btn">Change password</button></div>

    catch (err) { box.hidden = false; box.textContent = err.code === 'LOGIN_FAILED' ? 'Current password is wrong.' : errText(err); }
  };
}

function downloadWordTemplate() {
  const bin = Uint8Array.from(atob(WORD_TEMPLATE_B64), c => c.charCodeAt(0));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bin], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
  a.download = 'question-template.docx'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
document.addEventListener('click', e => { if (e.target.closest('[data-template]')) { e.preventDefault(); downloadWordTemplate(); } });
const localImgs = {};   // picture name → preview address, for pictures not yet live on the site
function imgSrc(ref) {
  ref = String(ref ?? '').trim();
  if (!ref) return '';
  if (localImgs[ref]) return localImgs[ref];
  const drive = ref.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if (drive) return 'https://drive.google.com/thumbnail?id=' + drive[1] + '&sz=w2000';
  if (/^https:\/\//i.test(ref)) return ref;
  if (/^[\w-][\w\-./]*\.(png|jpe?g|gif|webp|svg)$/i.test(ref) && !ref.includes('..')) return (CFG.IMAGE_FOLDER || 'images/') + ref;
  return '';
}
function imgTag(ref) {
  if (!String(ref ?? '').trim()) return '';
  const s = imgSrc(ref);
  return s ? `<img class="qimg" src="${esc(s)}" alt="" onerror="this.outerHTML='<span class=imgmiss>Picture not found: ${esc(ref).replace(/'/g, '')}</span>'">`
    : `<span class="imgmiss">Picture name not understood: ${esc(ref)}</span>`;
}
function rich(s) {
  let t = String(s ?? '').replace(/\r/g, '');
  t = t.replace(/\\\[([\s\S]*?)\\\]/g, m => m.replace(/\n/g, ' '));
  t = t.replace(/\n?(\\\[[\s\S]*?\\\])\n?/g, '$1');
  t = t.replace(/\n?(\[img:[^\]]*\])\n?/gi, '$1');
  return esc(t).replace(/\[img:\s*([^\]\s]+)\s*\]/gi, (m, r) => imgTag(r.replace(/&amp;/g, '&'))).replace(/\n/g, '<br>');
}
function typeset(el) {
  if (window.renderMathInElement) {
    window.renderMathInElement(el, { delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '$$', right: '$$', display: true }, { left: '\\(', right: '\\)', display: false }], throwOnError: false });
  } else window.addEventListener('load', () => typeset(el), { once: true });
}
// Short one-line version of a question for tables: no pictures, no cut-off formulas.
function shortQ(t, max = 140) {
  t = String(t || '').replace(/\[img:[^\]]*\]/gi, '').replace(/\\\[[\s\S]*?\\\]/g, ' … ').replace(/\s+/g, ' ').trim();
  if (t.length <= max) return t;
  t = t.slice(0, max);
  const open = t.lastIndexOf('\\('), close = t.lastIndexOf('\\)');
  if (open > close) t = t.slice(0, open);
  return t.trim() + '…';
}
const when = iso => iso ? new Date(iso).toLocaleString() : '';
async function ensureCatalog() { if (!cat) cat = await api('catalog'); return cat; }
function examOptions(selected, withBlank = true) {
  const groups = {};
  cat.exams.forEach(e => { const k = (e.titleName || '—') + ' › ' + (e.subjectName || '—'); (groups[k] = groups[k] || []).push(e); });
  return (withBlank ? '<option value="">Choose an exam…</option>' : '') + Object.keys(groups).map(k =>
    `<optgroup label="${esc(k)}">${groups[k].map(e => `<option value="${esc(e.id)}" ${e.id === selected ? 'selected' : ''}>${esc(e.id)} · ${esc(e.name)}${e.open ? '' : ' (hidden)'}</option>`).join('')}</optgroup>`).join('');
}

// Excel download (loads the spreadsheet library only when needed)
let xlsxP = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxP) xlsxP = new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
  return xlsxP;
}
async function downloadXlsx(name, sheets) {
  try { await loadXlsx(); } catch (e) { toast('Could not load the Excel library. Check the internet connection.'); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(([title, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), title.slice(0, 31)));
  XLSX.writeFile(wb, name.replace(/[^\w.-]+/g, '_') + '.xlsx');
}
function downloadCsv(name, rows) {
  const csv = '\ufeff' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name.replace(/[^\w.-]+/g, '_') + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);

function renderQuestions() {
  const d = qData, locked = d.attempts > 0;
  $('#qarea').innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:.4rem">
        <div><h2>${esc(d.exam.name)}</h2><span class="muted"><code>${esc(d.exam.id)}</code> · ${esc(d.exam.titleName)} › ${esc(d.exam.subjectName)} · ${d.questions.length} question${d.questions.length === 1 ? '' : 's'} · ${d.exam.open ? 'open to students' : 'hidden from students'}</span></div>
        <span class="spacer"></span>
        <a class="btn ghost sm" href="index.html?e=${encodeURIComponent(d.exam.id)}" target="_blank" rel="noopener" title="Opens the portal; use an admin preview book">Preview in portal</a>
        <a class="btn ghost sm" href="#/import/${encodeURIComponent(d.exam.id)}" ${locked ? 'aria-disabled="true" style="pointer-events:none;opacity:.45"' : ''}>Upload Word file</a>
        <button class="btn sm" id="addQ" ${locked ? 'disabled' : ''}>+ Add question</button>
      </div>
      ${locked ? `<p class="note">${d.attempts} student result(s) exist for this exam. You can edit questions and answers (scores are recalculated automatically when an answer changes), but you can't add, remove or reorder questions.</p>` : ''}
      <div id="qlist">${d.questions.length ? d.questions.map((q, i) => `
        <div class="qcard">
          <span class="qnum">${bn(i + 1)}.</span>
          <div class="qbody"><div class="qt">${rich(q.question)}</div>${imgTag(q.image)}
            <div class="qopts">${q.options.map((o, j) => `<div class="${KEYS[j] === q.answer ? 'right' : ''}">(${LABELS[j]}) ${rich(o)}${KEYS[j] === q.answer ? ' ✓' : ''}</div>`).join('')}</div></div>
          <div class="qtools">
            <button class="btn ghost sm" data-edit="${i}">Edit</button>
            ${locked ? '' : `<button class="btn ghost sm" data-up="${i}" ${i ? '' : 'disabled'} aria-label="Move up">↑</button>
            <button class="btn ghost sm" data-down="${i}" ${i < d.questions.length - 1 ? '' : 'disabled'} aria-label="Move down">↓</button>
            <button class="btn danger sm" data-del="${i}">Delete</button>`}
          </div>
        </div>`).join('') : '<p class="muted">No questions yet.</p>'}</div>
    </div>`;
  typeset($('#qlist'));
  const ex = d.exam.id;
  if ($('#addQ')) $('#addQ').onclick = () => questionDialog(null);
  document.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => questionDialog(+b.dataset.edit); });
  document.querySelectorAll('[data-up],[data-down]').forEach(b => {
    b.onclick = async () => {
      const i = +(b.dataset.up ?? b.dataset.down);
      try { qData = await api('qMove', { examId: ex, no: i + 1, dir: b.dataset.up !== undefined ? -1 : 1 }); renderQuestions(); } catch (e) { toast(errText(e)); }
    };
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      const i = +b.dataset.del;
      if (!confirm(`Delete question ${i + 1}? The questions after it move up one number.`)) return;
      try { qData = await api('qDelete', { examId: ex, no: i + 1 }); renderQuestions(); toast('Question deleted'); cat = null; } catch (e) { toast(errText(e)); }
    };
  });
}

const MATH_SNIPPETS = [
  ['Inline math', '\\(', '\\)'], ['Own line', '\\[', '\\]'], ['a/b', '\\frac{', '}{}'], ['x²', '^{', '}'], ['x₁', '_{', '}'],
  ['√', '\\sqrt{', '}'], ['×', '\\times ', ''], ['θ', '\\theta ', ''], ['Δ', '\\Delta ', ''], ['π', '\\pi ', ''], ['unit', '\\mathrm{', '}'],
];
// local = { q, title, examId, onSave(data) } edits a question that isn't saved yet (Word import).
function questionDialog(index, local) {
  const q = local ? local.q : index === null ? { question: '', image: '', options: ['', '', '', ''], answer: '', solution: '', solutionImage: '' } : qData.questions[index];
  const no = index === null ? '' : index + 1;
  const examForPics = local ? local.examId : qData.exam.id;
  const picBtn = (field, label) => `<button type="button" class="btn ghost sm" data-pic="${field}" ${cat && cat.uploads ? '' : 'disabled title="Set up picture upload in Settings first"'}>${label}</button>`;
  dialog(`<h2>${local ? local.title : index === null ? 'Add a question' : 'Edit question ' + (index + 1)}</h2>
    <div class="editor">
      <div class="stack">
        <div><span class="muted" style="font-size:.85rem">Math: put it between <code>\\(</code> and <code>\\)</code>. Buttons insert at the cursor.</span>
          <div class="mathbar">${MATH_SNIPPETS.map((m, i) => `<button type="button" data-snip="${i}">${esc(m[0])}</button>`).join('')}<button type="button" data-pic="@inline" ${cat && cat.uploads ? '' : 'disabled title="Set up picture upload in Settings first"'}>Picture in text…</button></div></div>
        <label class="f"><span>Question</span><textarea class="t" name="question" rows="3">${esc(q.question)}</textarea></label>
        <div><label class="f"><span>Picture under the question (optional)</span><input class="t" name="image" value="${esc(q.image)}" placeholder="phy02-q5.png"></label>
          <div class="row" style="margin-top:.35rem">${picBtn('image', 'Upload picture…')}<small class="muted">${cat && cat.uploads ? 'Or type a file name from your images folder.' : 'Picture upload isn’t set up yet (Settings). You can type a file name from your images folder.'}</small></div></div>
        ${LABELS.map((l, j) => `<label class="f"><span>Option (${l})</span><input class="t" name="o${j}" value="${esc(q.options[j])}"></label>`).join('')}
        <div><span style="font-weight:600;font-size:.88rem;display:block;margin-bottom:.3rem">Correct answer</span>
          <div class="ansrow" role="radiogroup" aria-label="Correct answer">${LABELS.map((l, j) => `<label><input type="radio" name="answer" value="${KEYS[j]}" ${q.answer === KEYS[j] ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
        <label class="f"><span>Solution / explanation</span><textarea class="t" name="solution" rows="5">${esc(q.solution)}</textarea></label>
        <div><label class="f"><span>Picture at the end of the solution (optional)</span><input class="t" name="solutionImage" value="${esc(q.solutionImage)}"></label>
          <div class="row" style="margin-top:.35rem">${picBtn('solutionImage', 'Upload picture…')}</div></div>
        <input type="file" accept="image/*" id="picfile" hidden>
      </div>
      <div><div class="preview" id="pv" aria-live="polite"></div></div>
    </div>${dlgButtons(local ? 'Done' : index === null ? 'Add question' : 'Save')}`,
  async (v, f) => {
    const data = { question: f.question.value, image: f.image.value, options: [0, 1, 2, 3].map(j => f['o' + j].value), answer: (f.querySelector('[name=answer]:checked') || {}).value || '', solution: f.solution.value, solutionImage: f.solutionImage.value };
    if (local) {
      if (!data.question.trim() && !data.image.trim()) throw { code: 'Q_EMPTY' };
      if (data.options.some(o => !o.trim())) throw { code: 'Q_OPTIONS' };
      if (!data.answer) throw { code: 'Q_ANSWER' };
      local.onSave(data); return;
    }
    qData = await api('qSave', { examId: qData.exam.id, no, q: data });
    renderQuestions(); cat = null;
    toast(index === null ? 'Question added' : 'Question saved');
  },
  f => {
    $('#dlg').classList.add('wide');
    $('#dlg').addEventListener('close', () => $('#dlg').classList.remove('wide'), { once: true });
    let lastField = f.question;
    f.addEventListener('focusin', e => { if (e.target.matches('textarea, input.t')) lastField = e.target; });
    f.querySelectorAll('[data-snip]').forEach(b => b.onclick = () => {
      const [, a, z] = MATH_SNIPPETS[+b.dataset.snip], el = lastField;
      const s0 = el.selectionStart ?? el.value.length, s1 = el.selectionEnd ?? s0;
      el.value = el.value.slice(0, s0) + a + el.value.slice(s0, s1) + z + el.value.slice(s1);
      el.focus(); el.selectionStart = el.selectionEnd = s0 + a.length + (s1 - s0);
      update();
    });
    let t;
    const update = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const ans = (f.querySelector('[name=answer]:checked') || {}).value;
        $('#pv').innerHTML = `<div class="lbl">Preview: what students see</div>
          <div>${rich(f.question.value) || '<span class="muted">Question…</span>'}</div>${imgTag(f.image.value)}
          <div style="margin-top:.5rem">${[0, 1, 2, 3].map(j => `<div class="po ${ans === KEYS[j] ? 'right' : ''}"><b>(${LABELS[j]})</b><span>${rich(f['o' + j].value)}</span></div>`).join('')}</div>
          ${f.solution.value || f.solutionImage.value ? `<div class="sol"><b>সমাধান</b><div>${rich(f.solution.value)}</div>${imgTag(f.solutionImage.value)}</div>` : ''}`;
        typeset($('#pv'));
      }, 150);
    };
    f.addEventListener('input', update); f.addEventListener('change', update);
    // picture upload buttons
    let picTarget = null;
    f.querySelectorAll('[data-pic]').forEach(b => b.onclick = () => { picTarget = b.dataset.pic === '@inline' ? { inline: lastField } : { field: b.dataset.pic }; $('#picfile').click(); });
    $('#picfile').onchange = async e => {
      const file = e.target.files[0]; e.target.value = '';
      if (!file || !picTarget) return;
      const box = f.querySelector('.err'); box.hidden = true;
      try {
        toast('Uploading picture…');
        const name = await uploadPicture(file, examForPics);
        if (picTarget.inline) {
          const el = picTarget.inline, at = el.selectionStart ?? el.value.length;
          el.value = el.value.slice(0, at) + '\n[img:' + name + ']\n' + el.value.slice(at);
        } else f[picTarget.field].value = name;
        update(); toast('Picture uploaded');
      } catch (err) { box.hidden = false; box.textContent = errText(err); }
    };
    update();
  });
}

// Opens a printable sheet of QR labels in a new tab.
function qrLabels(ids, siteUrl, bookName) {
  if (typeof qrcode !== 'function') { toast('QR library not loaded yet. Try again in a moment.'); return; }
  const svg = text => { const q = qrcode(0, 'M'); q.addData(text); q.make(); const m = q.getModuleCount(); let d = '';
    for (let r = 0; r < m; r++) for (let c = 0; c < m; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${m + 4} ${m + 4}" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="${m + 4}" height="${m + 4}" fill="#fff"/><path d="${d}"/></svg>`; };
  const w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups for this site to print labels.'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>QR labels</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
    <style>body{margin:0;font-family:'Hind Siliguri',sans-serif}.bar{padding:12px;font:14px system-ui}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;padding:8mm}
    .l{border:1px dashed #bbb;border-radius:3mm;padding:3mm;text-align:center;break-inside:avoid}.l svg{width:28mm;height:28mm}.id{font:700 13px ui-monospace,monospace;letter-spacing:.06em}
    .b{font-size:10px;color:#444}@media print{.bar{display:none}.g{padding:0}@page{margin:8mm}}</style></head><body>
    <div class="bar">${ids.length} label(s). <button onclick="print()">Print or save as PDF</button></div>
    <div class="g">${ids.map(id => `<div class="l">${svg(siteUrl + '?book=' + id)}<div class="id">${id}</div><div class="b">${esc(bookName || '')}</div></div>`).join('')}</div></body></html>`);
  w.document.close();
}

// Talks to GitHub directly from the browser (no Google permission needed).
let ghCache = null;
async function ghAccess(fresh) {
  if (!ghCache || fresh) ghCache = await api('ghAccess');
  return ghCache;
}
async function ghRequest(g, path, method, body) {
  let res;
  try {
    res = await fetch('https://api.github.com/repos/' + g.repo + path, {
      method: method || 'GET',
      headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw { code: 'NETWORK' }; }
  const data = await res.json().catch(() => ({}));
  return { code: res.status, data };
}
function ghFail(code) {
  if (code === 401) throw { code: 'GH_AUTH' };
  if (code === 403) throw { code: 'GH_READONLY' };
  if (code === 404) throw { code: 'GH_REPO' };
  throw { code: 'GH_ERROR' };
}
async function githubTest() {
  const g = await ghAccess(true);
  const r = await ghRequest(g, '');
  if (r.code !== 200) ghFail(r.code);
  if (r.data.permissions && !r.data.permissions.push) throw { code: 'GH_READONLY' };
  return { repo: r.data.full_name, branch: g.branch };
}

// Shrinks a picture if needed, uploads it, returns its file name.
async function uploadPicture(fileOrBlob, examId, hint) {
  const bmp = await createImageBitmap(fileOrBlob).catch(() => { throw { code: 'BAD_PICTURE' }; });
  const k = Math.min(1, 1400 / bmp.width);
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext('2d');
  const isPhoto = /jpe?g/i.test(fileOrBlob.type || '');
  if (isPhoto) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  let url = c.toDataURL(isPhoto ? 'image/jpeg' : 'image/png', 0.86), ext = isPhoto ? 'jpg' : 'png';
  if (url.length > 2.2e6) {
    const c2 = document.createElement('canvas'); c2.width = c.width; c2.height = c.height;
    const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(c, 0, 0);
    url = c2.toDataURL('image/jpeg', 0.85); ext = 'jpg';
  }
  const g = await ghAccess();
  const base = (String(examId || 'pic').toLowerCase().replace(/[^a-z0-9-]+/g, '-') + '-' + (hint || Date.now().toString(36))).slice(0, 50);
  let name = base + '.' + ext;
  busy(1);
  try {
    for (let i = 0; i < 6; i++) {
      const r = await ghRequest(g, '/contents/' + g.dir + '/' + name, 'PUT', { message: 'Picture uploaded by ' + me.email, content: url.split(',')[1], branch: g.branch });
      if (r.code === 201 || r.code === 200) {
        localImgs[name] = url;
        api('imgUploaded', { name }).catch(() => {});
        return name;
      }
      if (r.code === 422) { name = base + '-' + Math.random().toString(36).slice(2, 6) + '.' + ext; continue; } // name taken
      if (r.code === 401) ghCache = null;
      ghFail(r.code);
    }
    throw { code: 'GH_ERROR' };
  } finally { busy(-1); }
}

function picRefs(q) {
  const refs = new Set();
  [q.question, q.solution, ...q.options].forEach(t => String(t || '').replace(/\[img:\s*(@\d+)\s*\]/g, (m, r) => refs.add(r)));
  return [...refs];
}

function checkQ(q) {
  const p = [];
  if (!q.question.trim()) p.push('No question text');
  const miss = q.options.map((o, j) => o.trim() ? '' : LABELS[j]).filter(Boolean);
  if (miss.length) p.push('Missing option ' + miss.join(', '));
  if (!q.answer) p.push('No correct answer');
  picRefs(q).forEach(r => { const im = imp.images[+r.slice(1)]; if (!im || !im.supported) p.push('Picture in a format browsers can’t show (' + (im ? im.ext.toUpperCase() : '?') + '). Replace it with PNG/JPG in Word, or remove it.'); });
  return p;
}

          ${q.problems.length ? `<p class="alert" style="margin:0 0 .4rem;font-size:.88rem">${q.problems.map(esc).join(' · ')}</p>` : ''}
          <div class="qt">${rich(q.question)}</div>
          <div class="qopts">${q.options.map((o, j) => `<div class="${KEYS[j] === q.answer ? 'right' : ''}">(${LABELS[j]}) ${rich(o) || '<span class="imgmiss">missing</span>'}${KEYS[j] === q.answer ? ' ✓' : ''}</div>`).join('')}</div>
          ${q.solution ? `<details style="margin-top:.4rem"><summary class="muted" style="cursor:pointer">Solution</summary><div style="margin-top:.3rem">${rich(q.solution)}</div></details>` : '<p class="muted" style="margin:.3rem 0 0;font-size:.85rem">No solution</p>'}
        </div>
        <div class="qtools"><button class="btn ghost sm" data-fix="${i}">Edit</button><button class="btn danger sm" data-rm="${i}">Remove</button></div>
      </div>`).join('')}</div>`;
  typeset($('#ilist'));
  document.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => {
    const i = +b.dataset.fix, q = qs[i];
    questionDialog(null, { q: Object.assign({ image: '', solutionImage: '' }, q), title: 'Fix question ' + (i + 1), examId: ex.id,
      onSave: data => { Object.assign(q, data); renderImport(ex); toast('Updated. Remember to save at the top.'); } });
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { qs.splice(+b.dataset.rm, 1); renderImport(ex); });
  if ($('#save')) $('#save').onclick = () => saveImport(ex);
}

async function saveImport(ex) {
  const qs = imp.questions;
  const mode = (document.querySelector('[name=mode]:checked') || {}).value || 'append';
  if (mode === 'replace' && !confirm(`Replace the ${ex.questions} existing question(s) of ${ex.id} with these ${qs.length}?`)) return;
  if ((mode === 'replace' ? 0 : ex.questions) + qs.length > 60) { toast(ERR.Q_TOO_MANY); return; }
  const btn = $('#save'), prog = $('#prog');
  btn.disabled = true;
  try {
    // 1. upload pictures used by the questions
    const used = new Set(); qs.forEach(q => picRefs(q).forEach(r => used.add(r)));
    const names = {};
    let n = 0;
    for (const r of used) {
      n++;
      if (!cat.uploads) break;
      prog.textContent = `Uploading picture ${n} of ${used.size}…`;
      const im = imp.images[+r.slice(1)];
      names[r] = await uploadPicture(im.blob, ex.id, 'w' + Date.now().toString(36) + n);
    }
    const fix = t => String(t || '').replace(/\n?\[img:\s*(@\d+)\s*\]\n?/g, (m, r) => names[r] ? '\n[img:' + names[r] + ']\n' : '').replace(/^\n+|\n+$/g, '');
    const out = qs.map(q => ({ question: fix(q.question), image: q.image || '', options: q.options.map(fix), answer: q.answer, solution: fix(q.solution), solutionImage: q.solutionImage || '' }));
    // 2. save the questions
    prog.textContent = 'Saving questions…';
    qData = await api('qImport', { examId: ex.id, mode, questions: out });
    imp = null; cat = null;
    toast(`${out.length} question(s) saved`);
    location.hash = '#/questions/' + encodeURIComponent(ex.id);
  } catch (err) {
    btn.disabled = false;
    prog.innerHTML = `<span style="color:var(--bad)">${esc(errText(err))}</span>`;
  }
}

/* =========================================================
   SETTINGS: picture upload (GitHub)
   ========================================================= */
function githubSettings(g) {
  const box = document.createElement('div');
  box.className = 'card stack'; box.style.cssText = 'max-width:40rem;margin-top:1rem';
  box.innerHTML = `<h2>Picture upload</h2>
    <p class="muted" style="margin:0">Pictures uploaded in the question editor and from Word files are saved into the <code>images</code> folder of your GitHub website. This needs a GitHub access key (see README, "Setting up picture upload"). The key is kept in the Google Sheet's Settings tab (keep the Sheet private) and is only handed to signed-in admins when they upload a picture.</p>
    <form class="stack" id="gh">
      <label class="f"><span>GitHub repository</span><input class="t" name="repo" value="${esc(g.repo)}" placeholder="yourname/exam-portal"></label>
      <div class="grid2"><label class="f"><span>Branch</span><input class="t" name="branch" value="${esc(g.branch)}"></label>
        <label class="f"><span>Folder</span><input class="t" name="dir" value="${esc(g.dir)}"><small>Must match IMAGE_FOLDER in config.js (normally <code>images</code>).</small></label></div>
      <label class="f"><span>Access key</span><input class="t" name="ghkey" type="password" autocomplete="off" placeholder="${g.hasToken ? 'Saved. Leave empty to keep it.' : 'github_pat_…'}"></label>
      ${g.hasToken ? '<label class="check"><input type="checkbox" name="clear"> Remove the saved key</label>' : ''}
      <p class="alert err" hidden></p>
      <div class="row"><button class="btn">Save</button><button type="button" class="btn ghost" id="ghtest">Test connection</button><span id="ghres" class="muted"></span></div>
    </form>`;
  box.querySelector('#gh').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, err = f.querySelector('.err'); err.hidden = true;
    try {
      const r = await api('githubSave', { repo: f.repo.value.trim(), branch: f.branch.value.trim(), dir: f.dir.value.trim(), ghToken: f.ghkey.value.trim(), clearToken: f.clear && f.clear.checked });
      toast('Saved'); cat = null; ghCache = null; box.replaceWith(githubSettings(r.github));
    } catch (x) { err.hidden = false; err.textContent = errText(x); }
  };
  box.querySelector('#ghtest').onclick = async () => {
    const out = box.querySelector('#ghres'); out.textContent = 'Testing…';
    try { const r = await githubTest(); out.innerHTML = `<span style="color:var(--ok);font-weight:600">✓ Connected to ${esc(r.repo)} (${esc(r.branch)})</span>`; }
    catch (x) { out.innerHTML = `<span style="color:var(--bad)">${esc(errText(x))}</span>`; }
  };
  return box;
}

boot();
})();
</script>
