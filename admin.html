<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="docx-import.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="receipt.js?v=1"></script>
<style>
:root {
  --desk: #f3f6fb; --paper: #fff; --text: #0B1F4B; --muted: #5a6888; --line: #d9e1ee;
  --ink: #1F6FEB; --ink-soft: #e6effd; --ink-text: #1554c0; --graphite: #0B1F4B; --on-graphite: #fff;
  --ok: #147a4b; --ok-soft: #dcf1e6; --bad: #c4321b; --bad-soft: #fbe2dc; --focus: #1F6FEB;
  --sans: "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--text); font: 15px/1.55 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* layout: top bar, section tabs, page tabs */
.topbar { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.topbar .in { max-width: 78rem; margin: 0 auto; padding: .55rem clamp(1rem, 3vw, 2rem) 0; display: flex; flex-wrap: wrap; align-items: center; gap: .3rem 1.2rem; }
.topbar .logo { display: flex; align-items: center; gap: .55rem; text-decoration: none; padding-bottom: .5rem; }
.topbar .logo img { height: 2.1rem; display: block; }
.topbar .logo small { font-size: .7rem; font-weight: 700; letter-spacing: .12em; color: var(--ink); border-left: 1px solid var(--line); padding-left: .55rem; }
.topbar .user { margin-left: auto; font-size: .88rem; color: var(--muted); padding-bottom: .5rem; text-align: right; line-height: 1.3; }
.topbar .user b { color: var(--text); }
.maintabs { display: flex; gap: .2rem; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; }
.maintabs a { padding: .55rem .9rem .6rem; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.maintabs a:hover { color: var(--text); }
.maintabs a[aria-current="page"] { color: var(--ink-text); border-bottom-color: var(--ink); }
.subtabs { max-width: 78rem; margin: 0 auto; padding: .9rem clamp(1rem, 3vw, 2rem) 0; display: flex; gap: .4rem; flex-wrap: wrap; }
.subtabs a { padding: .3rem .85rem; border-radius: 999px; text-decoration: none; color: var(--text); font-weight: 600; font-size: .92rem; border: 1px solid var(--line); background: var(--paper); }
.subtabs a:hover { border-color: var(--ink); }
.subtabs a[aria-current="page"] { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
main { padding: 1.2rem clamp(1rem, 3vw, 2rem) 4rem; max-width: 78rem; margin: 0 auto; width: 100%; }
@media (max-width: 640px) { .topbar .user .nm { display: none; } }

/* admin home */
.hello-admin { margin: .4rem 0 1.2rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .8rem; }
.tile { display: block; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; text-decoration: none; color: var(--text); transition: border-color .12s, box-shadow .12s; }
.tile:hover { border-color: var(--ink); box-shadow: 0 4px 14px rgba(31,111,235,.12); }
.tile b { display: block; font-size: 1.02rem; }
.tile span { display: block; color: var(--muted); font-size: .88rem; margin-top: .15rem; line-height: 1.4; }
.tile .num { display: inline-block; margin-top: .5rem; font-weight: 700; color: var(--ink-text); font-size: .9rem; }
.tile .num.alert { color: var(--bad); }
.section-title { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 1.6rem 0 .6rem; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .8rem; }

h1 { font-size: 1.45rem; margin: 0 0 .2rem; line-height: 1.3; }
h2 { font-size: 1.1rem; margin: 0; }
.lede { color: var(--muted); margin: 0 0 1.2rem; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; }
.stack > * + * { margin-top: 1rem; }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; gap: .35rem; min-height: 2.4rem; padding: .4rem .9rem; border-radius: 6px; cursor: pointer;
  border: 1.5px solid var(--graphite); background: var(--graphite); color: var(--on-graphite); font-weight: 600; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--graphite); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { min-height: 2rem; padding: .2rem .65rem; font-size: .88rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--ink-text); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 600; }

label.f { display: block; }
label.f > span { display: block; font-weight: 600; font-size: .88rem; margin-bottom: .25rem; }
label.f small { display: block; color: var(--muted); font-size: .8rem; margin-top: .2rem; }
input.t, select.t { width: 100%; padding: .5rem .65rem; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); }
input.t:focus, select.t:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--ink-soft); }
.check { display: flex; gap: .5rem; align-items: center; font-weight: 500; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

.alert { border-left: 4px solid var(--bad); background: var(--bad-soft); padding: .55rem .8rem; border-radius: 0 6px 6px 0; }
.note { border-left: 4px solid var(--ink); background: var(--ink-soft); padding: .55rem .8rem; border-radius: 0 6px 6px 0; }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; padding: 0 .5rem; border-radius: 999px; border: 1px solid currentColor; line-height: 1.6; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.off { color: var(--muted); } .pill.super { color: var(--ink-text); }
.muted { color: var(--muted); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: .45rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n { font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
code { font-size: .88em; background: var(--desk); padding: .05rem .35rem; border-radius: 4px; }

/* catalog */
.titles { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.titles button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: .3rem .9rem; cursor: pointer; font-weight: 600; }
.titles button[aria-pressed="true"] { border-color: var(--graphite); background: var(--graphite); color: var(--on-graphite); }
.subj + .subj { margin-top: 1rem; }
.subj header { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .4rem; }

/* sign-in */
.center { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.center .card { width: min(26rem, 100%); padding: 1.6rem; }

dialog { border: 0; border-radius: 10px; padding: 1.3rem; width: min(32rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); background: var(--paper); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(20,22,26,.45); }
dialog h2 { margin-bottom: .9rem; }
dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 1.2rem; }
dialog .actions .left { margin-right: auto; }

.toast { position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--graphite); color: var(--on-graphite);
  padding: .55rem 1rem; border-radius: 8px; font-weight: 600; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--ink), transparent); background-size: 50% 100%; animation: slide 1s linear infinite; z-index: 70; }
@keyframes slide { from { background-position: -50% 0; } to { background-position: 150% 0; } }
@media (prefers-reduced-motion: reduce) { .busy { animation: none; background: var(--ink); } }

/* questions */
.qcard { border-top: 1px solid var(--line); padding: .9rem 0; display: grid; grid-template-columns: 2.2rem 1fr auto; gap: .3rem .8rem; }
.qcard:first-child { border-top: 0; }
.qnum { font-weight: 700; color: var(--ink-text); }
.qbody .qt { overflow-wrap: anywhere; }
.qopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .15rem 1rem; margin-top: .35rem; font-size: .93rem; }
.qopts .right { color: var(--ok); font-weight: 600; }
.qtools { display: flex; gap: .3rem; align-items: start; flex-wrap: wrap; justify-content: flex-end; }
.qimg { display: block; max-width: 100%; max-height: 14rem; margin: .4rem 0; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: .2rem; }
.imgmiss { color: var(--bad); font-size: .85rem; }
dialog.wide { width: min(68rem, calc(100vw - 2rem)); }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.2rem; }
@media (max-width: 860px) { .editor { grid-template-columns: 1fr; } }
textarea.t { width: 100%; padding: .5rem .65rem; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); font: inherit; resize: vertical; min-height: 4.5rem; }
textarea.t:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--ink-soft); }
.mathbar { display: flex; gap: .25rem; flex-wrap: wrap; margin: .2rem 0 .5rem; }
.mathbar button { border: 1px solid var(--line); background: var(--desk); border-radius: 5px; padding: .1rem .5rem; cursor: pointer; font-size: .85rem; }
.ansrow { display: flex; gap: .4rem; }
.ansrow label { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1.6px solid var(--ink); color: var(--ink-text); font-weight: 700; cursor: pointer; }
.ansrow input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ansrow input:checked + span { color: var(--on-graphite); }
.ansrow label:has(input:checked) { background: var(--graphite); border-color: var(--graphite); }
.ansrow label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.editor > div:last-child .preview { position: sticky; top: 0; }
.preview { border: 1px dashed var(--line); border-radius: 8px; padding: .9rem 1rem; background: var(--desk); }
.preview .lbl { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: .4rem; }
.preview .po { display: flex; gap: .5rem; padding: .2rem .4rem; border-radius: 5px; }
.preview .po.right { background: var(--ok-soft); }
.preview .sol { margin-top: .6rem; padding-top: .6rem; border-top: 1px dashed var(--line); }
.katex-display { overflow-x: auto; overflow-y: hidden; }

.typepick { display: flex; flex-wrap: wrap; gap: .35rem; }
.typepick label { position: relative; }
.typepick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.typepick span { display: inline-block; padding: .3rem .8rem; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 600; font-size: .9rem; cursor: pointer; }
.typepick input:checked + span { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.typepick input:disabled + span { opacity: .4; cursor: not-allowed; }
.typepick input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.cqpart { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem .7rem; margin: 0; }
.cqpart legend { font-weight: 700; padding: 0 .3rem; }
.cqparts { list-style: none; margin: .45rem 0 0; padding: 0; display: grid; gap: .25rem; }
.cqparts li { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: .4rem; }
.cqparts em, .mk { font-style: normal; color: var(--muted); font-size: .88rem; }
.qtype { display: block; font-size: .68rem; font-weight: 700; letter-spacing: .04em; margin-top: .2rem; padding: .05rem .35rem; border-radius: 4px; text-align: center; background: var(--ink-soft); color: var(--ink-text); }
.qtype.t-CQ { background: #fff1d0; color: #8a5a00; } .qtype.t-SQ { background: var(--ok-soft); color: var(--ok); } .qtype.t-MATH { background: #f1e6fd; color: #6b2bb5; }
.bankgrid { display: grid; grid-template-columns: 17rem 1fr; gap: 1rem; align-items: start; }
@media (max-width: 860px) { .bankgrid { grid-template-columns: 1fr; } }
.banktree { padding: .6rem .7rem; position: sticky; top: 7rem; max-height: calc(100vh - 8rem); overflow: auto; }
.banktree details { margin: .15rem 0; } .banktree details.sub { margin-left: .8rem; }
.banktree summary { cursor: pointer; padding: .2rem .2rem; border-radius: 5px; display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
.banktree summary:hover { background: var(--desk); }
.banktree a { display: flex; justify-content: space-between; gap: .4rem; margin-left: 1.6rem; padding: .2rem .45rem; border-radius: 5px; text-decoration: none; color: var(--text); font-size: .93rem; }
.banktree a:hover { background: var(--desk); } .banktree a.on { background: var(--ink-soft); color: var(--ink-text); font-weight: 600; }
.banktree .cnt { font-size: .75rem; color: var(--muted); margin-left: auto; }
.tiny { font-size: .75rem; }
.qsel { width: 1rem; height: 1rem; vertical-align: -2px; margin-right: .15rem; }
.qmeta { margin-top: .4rem; font-size: .8rem; color: var(--muted); }
/* results */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .7rem; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: .7rem .9rem; }
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .82rem; }
.bars { display: grid; grid-template-columns: repeat(10, 1fr); gap: .3rem; align-items: end; height: 7rem; }
.bars div { background: var(--ink); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.bars div span { position: absolute; top: -1.2rem; left: 0; right: 0; text-align: center; font-size: .72rem; color: var(--muted); }
.barlbl { display: grid; grid-template-columns: repeat(10, 1fr); gap: .3rem; font-size: .7rem; color: var(--muted); text-align: center; margin-top: .25rem; }
.pct { display: flex; align-items: center; gap: .5rem; min-width: 8rem; }
.pct i { display: block; height: .5rem; border-radius: 3px; background: var(--ok); }
.pct.low i { background: var(--bad); }
.tabs { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tabs a { padding: .35rem .9rem; border-radius: 999px; border: 1.5px solid var(--line); text-decoration: none; color: var(--text); font-weight: 600; background: var(--paper); }
.tabs a[aria-current="page"] { background: var(--graphite); color: var(--on-graphite); border-color: var(--graphite); }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: .3rem; }
.ans-grid span { border-radius: 5px; padding: .2rem .4rem; font-size: .85rem; text-align: center; }
.ans-grid .correct { background: var(--ok-soft); color: var(--ok); }
.ans-grid .wrong { background: var(--bad-soft); color: var(--bad); }
.ans-grid .blank { border: 1px dashed var(--line); color: var(--muted); }
td a { color: var(--ink-text); font-weight: 600; }
.mchips { display: flex; flex-wrap: wrap; gap: .4rem; }
.mchip { position: relative; display: block; cursor: pointer; }
.mchip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.mchip span { display: grid; min-width: 6.4rem; padding: .35rem .6rem; border-radius: 6px; border: 1.5px solid var(--line); background: var(--paper); line-height: 1.25; }
.mchip span b { font-size: .9rem; } .mchip span small { font-size: .75rem; color: var(--muted); }
.mchip.paid span { background: var(--ok-soft); border-color: transparent; cursor: default; } .mchip.paid small { color: var(--ok); }
.mchip.owe span { border-color: var(--bad); } .mchip.owe small, .mchip.part small { color: var(--bad); font-weight: 600; }
.mchip.part span { border-color: #e0a400; border-style: dashed; }
.mchip.future span { border-style: dashed; }
.mchip.skip span { background: var(--desk); border-style: dotted; cursor: default; opacity: .75; } .mchip.skip small { font-style: italic; }
.mchip input:checked + span { background: var(--graphite); color: var(--on-graphite); border-color: var(--graphite); }
.mchip input:checked + span small { color: inherit; }
.mchip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.ids { font-family: ui-monospace, monospace; font-size: .85rem; max-height: 10rem; overflow: auto; background: var(--desk); padding: .5rem .7rem; border-radius: 6px; columns: 4 8rem; }
</style>
</head>
<body>
<div id="root"></div>
<div class="busy" id="busy" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
(function () {
'use strict';
const CFG = Object.assign({ API_URL: '', SITE_NAME: 'Portal' }, window.PORTAL_CONFIG || {});
const API_URL = String(CFG.API_URL || '').trim();
const ADMIN_VERSION = '5.0';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let token = store.get('omr_admin_token') || '';
let me = null, cat = null, selTitle = null;

const ERR = {
  NETWORK: 'Could not reach the server. Check the internet connection.',
  CONFIG: 'API_URL in config.js is not set.',
  UNKNOWN_ACTION: 'Your Apps Script is an old version. Paste the new Code.gs and deploy a New version.',
  NOT_SET_UP: 'Run OMR Portal > "1. Set up / upgrade sheets" in the Google Sheet first.',
  BAD_SETUP_CODE: 'That setup code is not right. Find it in the Settings tab (ADMIN_SETUP_CODE).',
  ALREADY_SET_UP: 'A super admin already exists. Sign in instead.',
  LOGIN_FAILED: 'Wrong email or password.',
  LOGIN_LOCKED: 'Too many wrong tries. Try again in an hour.',
  NOT_SIGNED_IN: 'Please sign in again.',
  SUPER_ONLY: 'Only a super admin can do this.',
  INVALID_EMAIL: 'Enter a valid email address.',
  INVALID_NAME: 'Enter a name (2 or more characters).',
  WEAK_PASSWORD: 'Password must be at least 8 characters.',
  CANNOT_DEMOTE_SELF: "You can't remove your own super admin role or disable yourself.",
  INVALID_EXAM_ID: 'Exam ID: 2–20 characters, only letters, numbers and - _ . (for example PHY-02).',
  EXAM_ID_TAKEN: 'That exam ID is already used.',
  INVALID_MARKING: 'Marks for correct must be above 0; marks for wrong must be 0 or negative (e.g. -0.25).',
  SUBJECT_HAS_EXAMS: 'Move or delete this subject’s exams first.',
  TITLE_HAS_SUBJECTS: 'Delete this book’s subjects first.',
  TITLE_HAS_BOOKS: 'Book IDs (printed copies) belong to this book, so it can’t be deleted. Mark it inactive instead.',
  TITLE_NOT_FOUND: 'That book no longer exists. Reload the page.',
  SUBJECT_NOT_FOUND: 'Choose a subject.',
  BUSY: 'The server is busy. Try again in a few seconds.',
};
const errText = e => ERR[e.code] || ('Something went wrong (' + (e.code || e.message || e) + ').');

let busyN = 0;
function busy(d) { busyN += d; $('#busy').hidden = busyN <= 0; }
async function api(action, data = {}) {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL) && !/^http:\/\/localhost/.test(API_URL)) throw { code: 'CONFIG' };
  busy(1);
  try {
    let res;
    try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token }, data)) }); }
    catch (e) { throw { code: 'NETWORK' }; }
    const j = await res.json().catch(() => ({ ok: false, error: 'NETWORK' }));
    if (!j.ok) {
      if (j.error === 'NOT_SIGNED_IN') { token = ''; store.del('omr_admin_token'); me = null; setTimeout(() => showSignIn(ERR.NOT_SIGNED_IN), 0); }
      throw { code: j.error, data: j };
    }
    return j;
  } finally { busy(-1); }
}
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

/* ---------- dialog helper ---------- */
function dialog(html, onSubmit, init) {
  const d = $('#dlg'), f = $('#dlgForm');
  f.innerHTML = html;
  f.onsubmit = async e => {
    const btn = e.submitter;
    if (!btn || btn.value === 'cancel') return;
    e.preventDefault();
    const box = f.querySelector('.err');
    try {
      btn.disabled = true;
      const r = await onSubmit(btn.value, f);
      if (r !== false) d.close();
    } catch (err) {
      if (err && err.code === 'NOT_SIGNED_IN') { d.close(); return; }
      if (box) { box.hidden = false; box.textContent = errText(err); }
    } finally { btn.disabled = false; }
  };
  if (init) init(f);
  d.showModal();
  const first = f.querySelector('input:not([readonly]):not([type=checkbox]), select');
  if (first) first.focus();
}

// Pages without their own tab belong to one: a student's profile sits under Students, etc.
const PAGE_PARENT = { student: 'lstudents', collect: 'fees', import: 'questions', bankimport: 'bank' };
function sectionOf(page) {
  page = PAGE_PARENT[page] || page;
  for (const sec of SECTIONS) if (sec.pages.some(p => p.id === page)) return { sec, page };
  return { sec: null, page };
}
const visiblePages = sec => (sec.portal && !portalIs(sec.portal)) ? [] : sec.pages.filter(p => p.show());
// Page ids that belong to a portal section the current portal doesn't have.
function pageAllowed(page) {
  const at = sectionOf(page);
  return !at.sec || !at.sec.portal || portalIs(at.sec.portal);
}
const pageHref = p => p.href || '#/' + p.id;

function shell(page, html) {
  const at = sectionOf(page);
  const secs = SECTIONS.filter(sec => visiblePages(sec).length);
  const sub = at.sec ? visiblePages(at.sec) : [];
  $('#root').innerHTML = `
    <header class="topbar"><div class="in">
      <a class="logo" href="#/home"><img src="${esc(CFG.LOGO || 'logo.png')}" alt="${esc(CFG.SITE_NAME)}"><small>${portalName === 'coaching' ? 'COACHING' : portalName === 'exam' ? 'EXAM PORTAL' : 'ADMIN'}</small></a>

        <a href="#/home" ${page === 'home' ? 'aria-current="page"' : ''}>Home</a>
        ${secs.map(sec => `<a href="${pageHref(visiblePages(sec)[0])}" ${at.sec === sec ? 'aria-current="page"' : ''}>${sec.label}</a>`).join('')}
      </nav>
    </div></header>
    ${sub.length > 1 ? `<nav class="subtabs" aria-label="${esc(at.sec.label)}">${sub.map(p => `<a href="${pageHref(p)}" ${p.id === at.page ? 'aria-current="page"' : ''}>${p.label}</a>`).join('')}</nav>` : ''}
    <main id="main">${html}</main>`;
  $('#out').onclick = signOut;
}

function route() {
  if (!me) return boot();
  const [page, arg] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  if (page === 'home' || page === '' || !pageAllowed(page)) return viewHome();
  if (page === 'books' && can('books.edit')) return viewCatalog();
  if (page === 'bank' && can('bank.view')) return viewBank(arg);
  if (page === 'bankimport' && can('bank.write')) return viewBankImport(arg);
  if (page === 'courses' && !['writer', 'setter'].includes(me.role)) return viewCourses(arg);
  if (page === 'fees' && can('fees.collect')) return viewFees();
  if (page === 'collect' && can('fees.collect')) return viewCollect(arg);
  if (page === 'dues' && can('fees.report')) return viewDues();
  if (page === 'cash' && can('fees.report')) return viewCashReport();
  if (page === 'coupons' && can('coupons')) return viewCoupons();
  if (page === 'lstudents' && can('students.view')) return viewLStudents(arg);
  if (page === 'student' && can('students.view')) return viewLStudent(arg);
  if (page === 'mybatches' && can('students.view')) return viewMyBatches();
  if (page === 'questions') return viewQuestions(arg);
  if (page === 'import') return viewImport(arg);
  if (page === 'results') return viewResults(arg);
  if (page === 'bookids' && me.role === 'super') return viewBookIds();
  if (page === 'students' && me.role === 'super') return viewStudents();
  if (page === 'settings' && me.role === 'super') return viewSettings();
  if (page === 'admins' && me.role === 'super') return viewAdmins();
  if (page === 'log' && me.role === 'super') return viewLog();
  if (page === 'account') return viewAccount();
  return viewHome();
}

      <div class="row"><div><h2>${esc(t.name)}</h2><span class="muted">ID <code>${esc(t.id)}</code> · ${t.books} printed cop${t.books === 1 ? 'y' : 'ies'} · ${subs.length} subject${subs.length === 1 ? '' : 's'}</span></div>

      ${subs.length ? subs.map(s => `<section class="subj">

      let confirmId = '';
      if (e.attempts) {
        confirmId = prompt(`"${e.id}" has ${e.attempts} student result(s). Deleting removes the exam and its ${e.questions} question(s); results stay in the Attempts tab.\n\nType the exam ID to confirm:`);
        if (confirmId === null) return false;
        confirmId = confirmId.trim().toUpperCase();
      } else if (!confirm(`Delete "${e.id}" and its ${e.questions} question(s)?`)) return false;
      cat = await api('examDelete', { id: e.id, confirm: confirmId }); toast('Exam deleted');
    } else {
      cat = await api('examSave', {
        isNew: !e, id: f.id.value.trim().toUpperCase(), name: f.name.value, subjectId: f.subject.value, order: f.order.value,
        open: f.open.checked, markCorrect: f.mc.value, markWrong: f.mw.value,
      });
      const s = cat.subjects.find(x => x.id === f.subject.value); if (s) selTitle = s.titleId;
      toast(e ? 'Exam saved' : 'Exam added');
    }
    renderCatalog();
  });
}

/* ---------- admins ---------- */
async function viewAdmins() {
  shell('admins', '<p class="muted">Loading…</p>');
  let list;
  try { list = (await api('adminList')).admins; } catch (e) { if (e.code !== 'NOT_SIGNED_IN') $('#main').innerHTML = `<p class="alert">${esc(errText(e))}</p>`; return; }
  const draw = () => {
    $('#main').innerHTML = `
      <div class="row" style="margin-bottom:.2rem"><h1>Staff accounts</h1><span class="spacer"></span><button class="btn" id="add">+ Add staff</button></div>
      <p class="lede">${portalName === 'coaching' ? '<b>Super admin:</b> everything. <b>Manager:</b> courses, batches, students and fees. <b>Coaching teacher:</b> their batches and students. <b>Desk / accountant:</b> registers students, enrolls them, takes fees.' : '<b>Super admin:</b> everything. <b>Manager</b> and <b>Editor:</b> books, exams, questions and the whole bank. <b>Question setter:</b> the whole question bank, exams and sets. <b>Teacher (question writer):</b> adds questions to the bank and edits their own; signs up on the sign-in page.'}</p>
      ${list.some(a => a.pending) ? `<div class="card" style="margin-bottom:1rem;border-color:#e0a400"><h2 style="margin-bottom:.5rem">Waiting for approval</h2>
        <table><tbody>${list.filter(a => a.pending).map(a => `<tr><td><b>${esc(a.name)}</b><br><span class="muted">${esc(a.email)}</span></td><td>${esc(a.phone)}<br><span class="muted">${esc(a.institution)}</span></td>
          <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-approve="${esc(a.email)}">Approve as teacher</button> <button class="btn ghost sm" data-a="${esc(a.email)}">Choose role…</button> <button class="btn danger sm" data-reject="${esc(a.email)}">Reject</button></td></tr>`).join('')}</tbody></table></div>` : ''}
      <div class="card tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead><tbody>
      ${list.filter(a => !a.pending).map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.email)}</td>
        <td>${a.role === 'super' ? '<span class="pill super">Super admin</span>' : `<span class="pill off">${ROLE_NAMES[a.role] || a.role}</span>`}</td>
        <td>${a.active ? '<span class="pill ok">Active</span>' : '<span class="pill off">Disabled</span>'}</td>
        <td class="muted">${a.lastLogin ? esc(new Date(a.lastLogin).toLocaleString()) : 'Never'}</td>
        <td style="text-align:right"><button class="btn ghost sm" data-a="${esc(a.email)}">Edit</button></td></tr>`).join('')}
      </tbody></table></div>`;
    $('#add').onclick = () => adminDialog(null);
    document.querySelectorAll('[data-approve]').forEach(b => b.onclick = async () => { const a = list.find(x => x.email === b.dataset.approve);
      try { list = (await api('adminSave', { email: a.email, name: a.name, role: 'writer', active: true })).admins; toast('Approved'); draw(); } catch (x) { toast(errText(x)); } });
    document.querySelectorAll('[data-reject]').forEach(b => b.onclick = async () => { const a = list.find(x => x.email === b.dataset.reject);
      if (!confirm(`Reject ${a.name}'s request? Their account stays disabled.`)) return;
      try { list = (await api('adminSave', { email: a.email, name: a.name, role: 'writer', active: false })).admins; toast('Rejected'); draw(); } catch (x) { toast(errText(x)); } });
    document.querySelectorAll('[data-a]').forEach(b => { b.onclick = () => adminDialog(list.find(a => a.email === b.dataset.a)); });
  };
  const adminDialog = a => dialog(`<h2>${a ? 'Edit admin' : 'Add an admin'}</h2><div class="stack">
      <label class="f"><span>Name</span><input class="t" name="name" value="${esc(a ? a.name : '')}" required></label>
      <label class="f"><span>Email</span><input class="t" name="email" type="email" value="${esc(a ? a.email : '')}" ${a ? 'readonly' : 'required'}></label>
      <div class="grid2"><label class="f"><span>Role</span><select class="t" name="role">${Object.keys(ROLE_NAMES).filter(r => portalName === 'both' || ({ exam: ['super', 'manager', 'setter', 'writer', 'editor'], coaching: ['super', 'manager', 'teacher', 'desk'] })[portalName].includes(r) || (a && a.role === r)).map(r => `<option value="${r}" ${(a ? a.role : (portalName === 'coaching' ? 'desk' : 'writer')) === r ? 'selected' : ''}>${ROLE_NAMES[r]}</option>`).join('')}</select></label>
      <label class="f"><span>&nbsp;</span><span class="check"><input type="checkbox" name="active" ${!a || a.active ? 'checked' : ''}> Can sign in</span></label></div>
      <label class="f"><span>${a ? 'New password (leave empty to keep)' : 'Password'}</span><input class="t" name="password" type="password" autocomplete="new-password" ${a ? '' : 'required'} minlength="8"><small>At least 8 characters. Share it with them privately; they can change it under My account.</small></label>
    </div>${dlgButtons(a ? 'Save' : 'Add admin')}`,
  async (v, f) => {
    list = (await api('adminSave', { email: f.email.value, name: f.name.value, role: f.role.value, active: f.active.checked, password: f.password.value })).admins;
    toast(a ? 'Admin saved' : 'Admin added'); draw();
  });
  draw();
}

/* ---------- my account ---------- */
function viewAccount() {
  shell('account', `<h1>My account</h1><p class="lede">${esc(me.name)} · ${esc(me.email)} · ${me.role === 'super' ? 'Super admin' : 'Editor'}</p>
    <form class="card stack" id="pw" style="max-width:28rem">
      <h2>Change password</h2>
      <label class="f"><span>Current password</span><input class="t" name="old" type="password" autocomplete="current-password" required></label>
      <label class="f"><span>New password</span><input class="t" name="nw" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
      <p class="alert err" hidden></p>
      <div><button class="btn">Change password</button></div>
    </form>`);
  $('#pw').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, box = f.querySelector('.err');
    try { await api('adminPassword', { oldPassword: f.old.value, newPassword: f.nw.value }); f.reset(); box.hidden = true; toast('Password changed'); }
    catch (err) { box.hidden = false; box.textContent = err.code === 'LOGIN_FAILED' ? 'Current password is wrong.' : errText(err); }
  };
}

function downloadWordTemplate() {
  const bin = Uint8Array.from(atob(WORD_TEMPLATE_B64), c => c.charCodeAt(0));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bin], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
  a.download = 'question-template.docx'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  const drive = ref.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if (drive) return 'https://drive.google.com/thumbnail?id=' + drive[1] + '&sz=w2000';
  if (/^https:\/\//i.test(ref)) return ref;
  if (/^[\w-][\w\-./]*\.(png|jpe?g|gif|webp|svg)$/i.test(ref) && !ref.includes('..')) return (CFG.IMAGE_FOLDER || 'images/') + ref;
  return '';
}
function imgTag(ref) {
  if (!String(ref ?? '').trim()) return '';
  const s = imgSrc(ref);
  return s ? `<img class="qimg" src="${esc(s)}" alt="" onerror="this.outerHTML='<span class=imgmiss>Picture not found: ${esc(ref).replace(/'/g, '')}</span>'">`
    : `<span class="imgmiss">Picture name not understood: ${esc(ref)}</span>`;
}
function rich(s) {
  let t = String(s ?? '').replace(/\r/g, '');
  t = t.replace(/\\\[([\s\S]*?)\\\]/g, m => m.replace(/\n/g, ' '));
  t = t.replace(/\n?(\\\[[\s\S]*?\\\])\n?/g, '$1');
  t = t.replace(/\n?(\[img:[^\]]*\])\n?/gi, '$1');
  return esc(t).replace(/\[img:\s*([^\]\s]+)\s*\]/gi, (m, r) => imgTag(r.replace(/&amp;/g, '&'))).replace(/\n/g, '<br>');
}
function typeset(el) {
  if (window.renderMathInElement) {
    window.renderMathInElement(el, { delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '$$', right: '$$', display: true }, { left: '\\(', right: '\\)', display: false }], throwOnError: false });
  } else window.addEventListener('load', () => typeset(el), { once: true });
}
// Short one-line version of a question for tables: no pictures, no cut-off formulas.
function shortQ(t, max = 140) {
  t = String(t || '').replace(/\[img:[^\]]*\]/gi, '').replace(/\\\[[\s\S]*?\\\]/g, ' … ').replace(/\s+/g, ' ').trim();
  if (t.length <= max) return t;
  t = t.slice(0, max);
  const open = t.lastIndexOf('\\('), close = t.lastIndexOf('\\)');
  if (open > close) t = t.slice(0, open);
  return t.trim() + '…';
}

// Excel download (loads the spreadsheet library only when needed)
let xlsxP = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxP) xlsxP = new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
  return xlsxP;
}
async function downloadXlsx(name, sheets) {
  try { await loadXlsx(); } catch (e) { toast('Could not load the Excel library. Check the internet connection.'); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(([title, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), title.slice(0, 31)));
  XLSX.writeFile(wb, name.replace(/[^\w.-]+/g, '_') + '.xlsx');
}
function downloadCsv(name, rows) {
  const csv = '\ufeff' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name.replace(/[^\w.-]+/g, '_') + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const CQ_LABELS = ['ক', 'খ', 'গ', 'ঘ', 'ঙ', 'চ'];
const qMarks = q => q.type === 'CQ' ? q.parts.reduce((a, p) => a + Number(p.marks || 0), 0) : Number(q.marks || 0);
// Each type is numbered on its own: MCQ 1–20, CQ 1–3 …
function typeNumbers(list) { const n = {}; return list.map(q => (n[q.type || 'MCQ'] = (n[q.type || 'MCQ'] || 0) + 1)); }
function questionBody(q) {
  const t = q.type || 'MCQ';
  if (t === 'MCQ') return `<div class="qt">${rich(q.question)}</div>${imgTag(q.image)}
    <div class="qopts">${q.options.map((o, j) => `<div class="${KEYS[j] === q.answer ? 'right' : ''}">(${LABELS[j]}) ${rich(o)}${KEYS[j] === q.answer ? ' ✓' : ''}</div>`).join('')}</div>`;
  if (t === 'CQ') return `<div class="qt">${rich(q.question)}</div>${imgTag(q.image)}
    <ol class="cqparts">${q.parts.map((p, j) => `<li><b>${CQ_LABELS[j]}.</b><span>${rich(p.text)}</span><em>${bn(p.marks)}</em></li>`).join('')}</ol>`;
  return `<div class="qt">${rich(q.question)} <em class="mk">[${bn(q.marks)}]</em></div>${imgTag(q.image)}`;
}

const MATH_SNIPPETS = [

  ['√', '\\sqrt{', '}'], ['×', '\\times ', ''], ['θ', '\\theta ', ''], ['Δ', '\\Delta ', ''], ['π', '\\pi ', ''], ['unit', '\\mathrm{', '}'],
];
const CQ_DEFAULT_MARKS = [1, 2, 3, 4];
// local = { q, title, examId, onSave(data) } edits a question that isn't saved yet (Word import).

      try {
        toast('Uploading picture…');
        const name = await uploadPicture(file, examForPics);
        if (picTarget.inline) {
          const el = picTarget.inline, at = el.selectionStart ?? el.value.length;
          el.value = el.value.slice(0, at) + '\n[img:' + name + ']\n' + el.value.slice(at);
        } else f[picTarget.field].value = name;
        update(); toast('Picture uploaded');
      } catch (err) { box.hidden = false; box.textContent = errText(err); }
    };
    showType(); update();
  });
}

// Opens a printable sheet of QR labels in a new tab.
function qrLabels(ids, siteUrl, bookName) {
  if (typeof qrcode !== 'function') { toast('QR library not loaded yet. Try again in a moment.'); return; }
  const svg = text => { const q = qrcode(0, 'M'); q.addData(text); q.make(); const m = q.getModuleCount(); let d = '';
    for (let r = 0; r < m; r++) for (let c = 0; c < m; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${m + 4} ${m + 4}" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="${m + 4}" height="${m + 4}" fill="#fff"/><path d="${d}"/></svg>`; };
  const w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups for this site to print labels.'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>QR labels</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
    <style>body{margin:0;font-family:'Hind Siliguri',sans-serif}.bar{padding:12px;font:14px system-ui}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;padding:8mm}
    .l{border:1px dashed #bbb;border-radius:3mm;padding:3mm;text-align:center;break-inside:avoid}.l svg{width:28mm;height:28mm}.id{font:700 13px ui-monospace,monospace;letter-spacing:.06em}
    .b{font-size:10px;color:#444}@media print{.bar{display:none}.g{padding:0}@page{margin:8mm}}</style></head><body>
    <div class="bar">${ids.length} label(s). <button onclick="print()">Print or save as PDF</button></div>
    <div class="g">${ids.map(id => `<div class="l">${svg(siteUrl + '?book=' + id)}<div class="id">${id}</div><div class="b">${esc(bookName || '')}</div></div>`).join('')}</div></body></html>`);
  w.document.close();
}

// Talks to GitHub directly from the browser (no Google permission needed).
let ghCache = null;
async function ghAccess(fresh) {
  if (!ghCache || fresh) ghCache = await api('ghAccess');
  return ghCache;
}
async function ghRequest(g, path, method, body) {
  let res;
  try {
    res = await fetch('https://api.github.com/repos/' + g.repo + path, {
      method: method || 'GET',
      headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw { code: 'NETWORK' }; }
  const data = await res.json().catch(() => ({}));
  return { code: res.status, data };
}
function ghFail(code) {
  if (code === 401) throw { code: 'GH_AUTH' };
  if (code === 403) throw { code: 'GH_READONLY' };
  if (code === 404) throw { code: 'GH_REPO' };
  throw { code: 'GH_ERROR' };
}
async function githubTest() {
  const g = await ghAccess(true);
  const r = await ghRequest(g, '');
  if (r.code !== 200) ghFail(r.code);
  if (r.data.permissions && !r.data.permissions.push) throw { code: 'GH_READONLY' };
  return { repo: r.data.full_name, branch: g.branch };
}

// Shrinks a picture if needed, uploads it, returns its file name.
async function uploadPicture(fileOrBlob, examId, hint) {
  const bmp = await createImageBitmap(fileOrBlob).catch(() => { throw { code: 'BAD_PICTURE' }; });
  const k = Math.min(1, 1400 / bmp.width);
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext('2d');
  const isPhoto = /jpe?g/i.test(fileOrBlob.type || '');
  if (isPhoto) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  let url = c.toDataURL(isPhoto ? 'image/jpeg' : 'image/png', 0.86), ext = isPhoto ? 'jpg' : 'png';
  if (url.length > 2.2e6) {
    const c2 = document.createElement('canvas'); c2.width = c.width; c2.height = c.height;
    const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(c, 0, 0);
    url = c2.toDataURL('image/jpeg', 0.85); ext = 'jpg';
  }
  const g = await ghAccess();
  const base = (String(examId || 'pic').toLowerCase().replace(/[^a-z0-9-]+/g, '-') + '-' + (hint || Date.now().toString(36))).slice(0, 50);
  let name = base + '.' + ext;
  busy(1);
  try {
    for (let i = 0; i < 6; i++) {
      const r = await ghRequest(g, '/contents/' + g.dir + '/' + name, 'PUT', { message: 'Picture uploaded by ' + me.email, content: url.split(',')[1], branch: g.branch });
      if (r.code === 201 || r.code === 200) {
        localImgs[name] = url;
        api('imgUploaded', { name }).catch(() => {});
        return name;
      }
      if (r.code === 422) { name = base + '-' + Math.random().toString(36).slice(2, 6) + '.' + ext; continue; } // name taken
      if (r.code === 401) ghCache = null;
      ghFail(r.code);
    }
    throw { code: 'GH_ERROR' };
  } finally { busy(-1); }
}

function picRefs(q) {
  const refs = new Set();
  [q.question, q.solution, ...(q.options || []), ...(q.parts || []).flatMap(p => [p.text, p.solution])].forEach(t => String(t || '').replace(/\[img:\s*(@\d+)\s*\]/g, (m, r) => refs.add(r)));
  return [...refs];
}

function checkQ(q) {
  const p = [];
  const t = q.type || 'MCQ';
  if (!q.question.trim()) p.push(t === 'CQ' ? 'No stem (উদ্দীপক)' : 'No question text');
  if (t === 'MCQ') {
    const miss = q.options.map((o, j) => o.trim() ? '' : LABELS[j]).filter(Boolean);
    if (miss.length) p.push('Missing option ' + miss.join(', '));
    if (!q.answer) p.push('No correct answer');
  } else if (t === 'CQ') {
    if (!q.parts.length) p.push('No parts (ক, খ …) found');
    if (q.parts.some(x => !(x.marks > 0))) p.push('A part has no marks');
  } else if (!(q.marks > 0)) p.push('No marks: add them like [৫] at the end of the question');
  picRefs(q).forEach(r => { const im = imp.images[+r.slice(1)]; if (!im || !im.supported) p.push('Picture in a format browsers can’t show (' + (im ? im.ext.toUpperCase() : '?') + '). Replace it with PNG/JPG in Word, or remove it.'); });
  return p;
}

async function saveImport(ex) {
  const qs = imp.questions;
  const mode = (document.querySelector('[name=mode]:checked') || {}).value || 'append';
  if (mode === 'replace' && !confirm(`Replace the ${ex.questions} existing question(s) of ${ex.id} with these ${qs.length}?`)) return;
  if (!ex.isChapter && (mode === 'replace' ? 0 : ex.questions) + qs.filter(q => (q.type || 'MCQ') === 'MCQ').length > 60) { toast(ERR.Q_TOO_MANY); return; }
  const btn = $('#save'), prog = $('#prog');
  btn.disabled = true;
  try {
    // 1. upload pictures used by the questions
    const used = new Set(); qs.forEach(q => picRefs(q).forEach(r => used.add(r)));
    const names = {};
    let n = 0;
    for (const r of used) {
      n++;
      if (!((cat && cat.uploads) || bankUploads)) break;
      prog.textContent = `Uploading picture ${n} of ${used.size}…`;
      const im = imp.images[+r.slice(1)];
      names[r] = await uploadPicture(im.blob, ex.id, 'w' + Date.now().toString(36) + n);
    }
    const fix = t => String(t || '').replace(/\n?\[img:\s*(@\d+)\s*\]\n?/g, (m, r) => names[r] ? '\n[img:' + names[r] + ']\n' : '').replace(/^\n+|\n+$/g, '');
    const out = qs.map(q => ({ type: q.type || 'MCQ', question: fix(q.question), image: q.image || '', options: (q.options || ['', '', '', '']).map(fix), answer: q.answer || '',
      marks: q.marks || '', parts: (q.parts || []).map(x => ({ text: fix(x.text), marks: x.marks, solution: fix(x.solution) })), solution: fix(q.solution), solutionImage: q.solutionImage || '' }));
    // 2. save the questions
    prog.textContent = 'Saving questions…';
    if (ex.isChapter) {
      await api('bankImport', { chapterId: ex.id, questions: out });
      imp = null; toast(`${out.length} question(s) added to the bank`);
      location.hash = '#/bank/' + encodeURIComponent(ex.id);
      return;
    }
    qData = await api('qImport', { examId: ex.id, mode, questions: out });
    imp = null; cat = null;
    toast(`${out.length} question(s) saved`);
    location.hash = '#/questions/' + encodeURIComponent(ex.id);
  } catch (err) {
    btn.disabled = false;
    prog.innerHTML = `<span style="color:var(--bad)">${esc(errText(err))}</span>`;
  }
}

let lms = null;

const staffName = email => ((lms && lms.staff.find(s => s.email === email)) || {}).name || email;
const courseName = id => { const c = lms && lms.courses.find(x => x.id === id); return c ? (c.classLevel ? c.classLevel + ' · ' : '') + c.name : id; };
const batchLabel = id => { const b = lms && lms.batches.find(x => x.id === id); return b ? courseName(b.courseId) + ' › ' + b.name : id; };
const money = n => '৳' + Number(n || 0).toLocaleString('en-IN');
const statusPill = st => ({ ACTIVE: '<span class="pill ok">Active</span>', PENDING: '<span class="pill" style="color:#b7791f">Waiting approval</span>', BLOCKED: '<span class="pill" style="color:var(--bad)">Blocked</span>', ENDED: '<span class="pill off">Ended</span>', OPEN: '<span class="pill ok">Open for admission</span>', RUNNING: '<span class="pill super">Running</span>', CLOSED: '<span class="pill off">Closed</span>' }[st] || esc(st));

/* ---------- courses & batches ---------- */

  renderCourses();
}
function renderCourses() {

    ${c ? `<div class="card stack">

      ${batches.length ? `<div class="tw"><table><thead><tr><th>Batch</th><th>Days & time</th><th>Room</th><th>Teachers</th><th>Students</th><th>${c.paymentType === 'ONE_TIME' ? 'Course fee' : 'Monthly fee'}</th><th>Status</th><th></th></tr></thead><tbody>
        ${batches.map(b => `<tr><td><b>${esc(b.name)}</b><br><span class="muted" style="font-size:.82rem">${esc(b.startDate || '')}${b.endDate ? ' → ' + esc(b.endDate) : ''}</span></td>
          <td>${esc(b.days)}<br><span class="muted">${esc(b.time)}</span></td><td>${esc(b.room)}</td><td>${b.teachers.map(t => esc(staffName(t))).join('<br>') || '<span class="muted">—</span>'}</td>

  if ($('#addCourse')) $('#addCourse').onclick = () => courseDialog(null);

  if ($('#addSub')) $('#addSub').onclick = () => csubDialog(null);

}

    <div class="grid2"><label class="f"><span>Class</span><select class="t" name="cls" required><option value="">Choose…</option>${[...new Set([...(lms.classes || []), ...(c && c.classLevel ? [c.classLevel] : [])])].map(x => `<option ${(c ? c.classLevel : selClass) === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>

/* ---------- months a student continues (monthly courses) ---------- */
// Ticked = continuing (fee charged). Untick a month the student won't attend: no fee for it.
// New months are ticked automatically, so students continue unless someone unticks.
function monthsDialog(ac, after) {
  if (!ac) return;
  let changed = false;
  dialog(`<h2>Months: ${esc(ac.courseName)} › ${esc(ac.batchName)}</h2>
    <p class="muted" style="margin-top:0">Ticked months are charged. Untick a month the student won't continue; every new month is ticked automatically. Paid months can't be unticked.</p>
    <div class="tw"><table><thead><tr><th>Continuing</th><th>Month</th><th>Fee</th><th>Paid</th><th>Due</th></tr></thead><tbody>
      ${ac.months.map(m => `<tr><td><label class="check"><input type="checkbox" data-m="${esc(m.month)}" ${m.skipped ? '' : 'checked'} ${m.paid > 0 ? 'disabled title="Already paid"' : ''}> <span class="mlbl ${m.skipped ? 'muted' : ''}">${m.skipped ? 'Not continuing' : 'Yes'}</span></label></td>
        <td><b>${esc(monthName(m.month))}</b>${m.future ? ' <span class="muted" style="font-size:.8rem">(ahead)</span>' : ''}</td><td class="n">${money(m.fee)}</td><td class="n">${money(m.paid)}</td><td class="n">${m.due ? `<b style="color:var(--bad)">${money(m.due)}</b>` : '—'}</td></tr>`).join('')}
    </tbody></table></div><p class="alert err" hidden></p>
    <div class="actions"><button class="btn" value="cancel">Done</button></div>`, async () => {}, f => {
    $('#dlg').addEventListener('close', () => { if (changed && after) after(); }, { once: true });
    f.querySelectorAll('[data-m]').forEach(cb => cb.onchange = async () => {
      const box = f.querySelector('.err'); box.hidden = true; cb.disabled = true;
      try {
        await api('enrollMonth', { enrollmentId: ac.enrollmentId, month: cb.dataset.m, skip: !cb.checked });
        changed = true;
        const lbl = cb.parentElement.querySelector('.mlbl'); lbl.textContent = cb.checked ? 'Yes' : 'Not continuing'; lbl.classList.toggle('muted', !cb.checked);
        toast(cb.checked ? 'Continuing' : 'Marked as not continuing');
      } catch (x) { cb.checked = !cb.checked; box.hidden = false; box.textContent = errText(x); }
      cb.disabled = false;
    });
  });
}

// One month of a batch at once: untick students who won't continue that month.
function monthRegister(b) {
  const course = lms.courses.find(c => c.id === b.courseId) || {};
  const thisMonth = new Date().toISOString().slice(0, 7);
  dialog(`<h2>Month register: ${esc(course.name || '')} › ${esc(b.name)}</h2>
    <div class="row" style="margin-bottom:.6rem"><label class="row" style="gap:.4rem"><span class="muted">Month</span><input class="t" type="month" id="mrM" value="${thisMonth}" style="max-width:11rem"></label>
      <span class="muted" style="font-size:.88rem">Everyone continues unless unticked. Unticked = no fee that month.</span></div>
    <div class="tw" id="mrList" style="max-height:26rem;overflow:auto"><p class="muted">Loading…</p></div><p class="alert err" hidden></p>
    <div class="actions"><button class="btn" value="cancel">Done</button></div>`, async () => {}, f => {
    $('#dlg').classList.add('wide');
    $('#dlg').addEventListener('close', () => $('#dlg').classList.remove('wide'), { once: true });
    const load = async () => {
      let r;
      try { r = await api('batchMonth', { batchId: b.id, month: $('#mrM').value }); } catch (x) { $('#mrList').innerHTML = `<p class="alert">${esc(errText(x))}</p>`; return; }
      const cont = r.rows.filter(x => !x.skipped).length;
      $('#mrList').innerHTML = `<p style="margin:.2rem 0 .5rem"><b>${cont}</b> of ${r.rows.length} continuing in ${esc(monthName(r.month))}.</p>
        <table><thead><tr><th>Continuing</th><th>ID</th><th>Name</th><th>Fee</th><th>Paid</th><th>Due</th><th></th></tr></thead><tbody>
        ${r.rows.map(x => `<tr><td><input type="checkbox" data-e="${esc(x.enrollmentId)}" ${x.skipped ? '' : 'checked'} ${x.paid > 0 ? 'disabled title="Already paid"' : ''} aria-label="${esc(x.name)} continues"></td>
          <td><code>${esc(x.studentId)}</code></td><td>${esc(x.name)}${x.status === 'ENDED' ? ' <span class="pill off">Left</span>' : ''}</td><td class="n">${money(x.fee)}</td><td class="n">${money(x.paid)}</td>
          <td class="n">${x.due ? `<b style="color:var(--bad)">${money(x.due)}</b>` : '—'}</td><td>${can('fees.collect') ? `<a class="link" href="#/collect/${encodeURIComponent(x.studentId)}">Fees</a>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No students in this batch that month.</td></tr>'}</tbody></table>`;
      $('#mrList').querySelectorAll('[data-e]').forEach(cb => cb.onchange = async () => {
        const box = f.querySelector('.err'); box.hidden = true; cb.disabled = true;
        try { await api('enrollMonth', { enrollmentId: cb.dataset.e, month: r.month, skip: !cb.checked }); load(); }
        catch (x) { cb.checked = !cb.checked; cb.disabled = false; box.hidden = false; box.textContent = errText(x); }
      });
    };
    $('#mrM').onchange = load; load();
  });
}

      $('#asList').innerHTML = `<table><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Mobile</th><th>School</th><th></th></tr></thead><tbody>
        ${r.students.map(st => `<tr><td><code>${esc(st.id)}</code></td><td>${esc(st.name)}</td><td>${esc(st.classLevel)}</td><td>${esc(st.phone)}</td><td>${esc(st.institution)}</td>
          <td style="text-align:right">${st.batches.includes(b.id) ? '<span class="pill ok">In this batch</span>' : `<button type="button" class="btn sm" data-add="${esc(st.id)}">Add</button>`}</td></tr>`).join('')
          || `<tr><td colspan="6" class="muted">No active student found${only ? ' in ' + esc(course.classLevel) + '. Untick “Only ' + esc(course.classLevel) + '” to search all classes' : ''}. Students waiting for approval must be approved first.</td></tr>`}</tbody></table>
        ${r.matched > r.students.length ? `<p class="muted">Showing ${r.students.length} of ${r.matched}. Type more to narrow down.</p>` : ''}`;
      $('#asList').querySelectorAll('[data-add]').forEach(btn => btn.onclick = async () => {
        const st = r.students.find(x => x.id === btn.dataset.add);
        let over = false;
        if (b.seats && b.enrolled >= b.seats) { if (!confirm(`${b.name} is full (${b.enrolled}/${b.seats}). Add anyway?`)) return; over = true; }
        if (course.classLevel && st.classLevel !== course.classLevel && !confirm(`${st.name} is in ${st.classLevel || 'no class'}, but this course is for ${course.classLevel}. Add anyway?`)) return;
        btn.disabled = true;
        try {
          await api('enrollSave', { studentId: st.id, batchId: b.id, overSeats: over });
          b.enrolled++; added++; st.batches.push(b.id);
          btn.outerHTML = '<span class="pill ok">Added ✓</span>';
          $('#asInfo').textContent = `${b.enrolled}${b.seats ? ' of ' + b.seats + ' seats' : ''} taken · ${added} added now.`;
        } catch (x) { btn.disabled = false; toast(errText(x)); }
      });
    };
    $('#asq').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 350); });
    if ($('#asOnly')) { $('#asOnly').onchange = search; search(); }
  });
}

/* ---------- students list ---------- */
let stuFilter = { status: '', q: '', batchId: '', classLevel: '' };
async function viewLStudents(arg) {
  shell('lstudents', '<p class="muted">Loading…</p>');
  try { await ensureLms(); } catch (e) { return pageError(e); }
  if (arg && arg.startsWith('batch:')) stuFilter = { status: '', q: '', batchId: arg.slice(6) };
  else if (arg === 'pending') stuFilter = { status: 'PENDING', q: '', batchId: '' };
  $('#main').innerHTML = `
    <div class="row" style="margin-bottom:.2rem"><h1>Students</h1><span class="spacer"></span>${can('students.manage') ? '<button class="btn" id="addStu">+ Register a student</button>' : ''}</div>
    <p class="lede">${me.role === 'teacher' ? 'Students in your batches.' : 'Students who register on the student site wait here until the desk approves them. Students registered at the desk are active straight away.'}</p>
    <nav class="tabs" id="stabs"></nav>
    <form class="row" id="sf" style="margin-bottom:1rem">
      <input class="t" name="q" placeholder="Search name, ID, phone, school" style="max-width:18rem" value="${esc(stuFilter.q)}">
      <select class="t" name="cls" style="max-width:10rem"><option value="">All classes</option>${(lms.classes || []).map(c => `<option ${c === stuFilter.classLevel ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select class="t" name="batch" style="max-width:20rem"><option value="">All batches</option>${lms.batches.map(b => `<option value="${esc(b.id)}" ${b.id === stuFilter.batchId ? 'selected' : ''}>${esc(batchLabel(b.id))}</option>`).join('')}</select>
      <button class="btn ghost">Search</button>
      ${stuFilter.batchId ? '<button type="button" class="btn ghost sm" id="cardsAll">Print ID cards for this batch</button>' : ''}
    </form>
    <div class="card tw" id="slist"><p class="muted">Loading…</p></div>`;
  if ($('#addStu')) $('#addStu').onclick = async () => { await ensureLms(); studentDialog(null); };
  $('#sf').onsubmit = e => { e.preventDefault(); stuFilter.q = e.target.q.value.trim(); stuFilter.batchId = e.target.batch.value; stuFilter.classLevel = e.target.cls.value; viewLStudents(); };
  let r;
  try { r = await api('studentsList', stuFilter); } catch (e) { $('#slist').innerHTML = `<p class="alert">${esc(errText(e))}</p>`; return; }
  if (r.counts) $('#stabs').innerHTML = [['', 'All', r.counts.total], ['PENDING', 'Waiting approval', r.counts.pending], ['ACTIVE', 'Active', r.counts.active], ['BLOCKED', 'Blocked', r.counts.blocked]]
    .map(([k, l, n]) => `<a href="#" data-st="${k}" ${stuFilter.status === k ? 'aria-current="page"' : ''}>${l} ${n}</a>`).join('');
  document.querySelectorAll('[data-st]').forEach(a => a.onclick = e => { e.preventDefault(); stuFilter.status = a.dataset.st; viewLStudents(); });
  $('#slist').innerHTML = `<table><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Guardian</th><th>School / class</th><th>Batches</th><th>Status</th><th></th></tr></thead><tbody>
    ${r.students.map(s => `<tr><td><code>${esc(s.id)}</code></td><td><a href="#/student/${encodeURIComponent(s.id)}">${esc(s.name)}</a></td><td>${esc(s.phone)}</td><td>${esc(s.guardianPhone)}</td>
      <td>${esc(s.institution)}${s.classLevel ? '<br><span class="muted">' + esc(s.classLevel) + '</span>' : ''}</td><td style="font-size:.88rem">${s.batches.map(b => esc(batchLabel(b))).join('<br>') || '<span class="muted">—</span>'}</td>
      <td>${statusPill(s.status)}</td><td style="text-align:right;white-space:nowrap">${s.status === 'PENDING' && can('students.manage') ? `<button class="btn sm" data-approve="${esc(s.id)}">Approve</button> ` : ''}<a class="btn ghost sm" href="#/student/${encodeURIComponent(s.id)}">Open</a></td></tr>`).join('') || '<tr><td colspan="8" class="muted">No students found.</td></tr>'}
    </tbody></table>${r.matched > r.students.length ? `<p class="muted">Showing the newest ${r.students.length} of ${r.matched}. Search to narrow down.</p>` : ''}`;
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = async () => { try { await api('studentStatus', { studentId: b.dataset.approve, status: 'ACTIVE' }); toast('Approved'); viewLStudents(); } catch (e) { toast(errText(e)); } });
  if ($('#cardsAll')) $('#cardsAll').onclick = () => idCards(r.students.filter(s => s.status === 'ACTIVE'));
}

/* ---------- one student ---------- */
async function viewLStudent(id) {
  shell('lstudents', '<p class="muted">Loading…</p>');
  let r;
  try { await ensureLms(); r = await api('studentGet', { studentId: id }); } catch (e) { return pageError(e); }
  const s = r.student, m = can('students.manage');
  const photo = s.photo ? `<img src="${esc(imgSrc(s.photo))}" alt="" style="width:6rem;height:7rem;object-fit:cover;border-radius:6px;border:1px solid var(--line)">` : `<div style="width:6rem;height:7rem;border-radius:6px;background:var(--desk);display:grid;place-items:center;font-size:2rem;color:var(--muted)">${esc((s.name || '?')[0])}</div>`;
  const openBatches = lms.batches.filter(b => b.status !== 'CLOSED' && !r.enrollments.some(e => e.batchId === b.id && e.status === 'ACTIVE'));
  $('#main').innerHTML = `
    <p style="margin:0 0 .3rem"><a class="link" href="#/lstudents">← Students</a></p>
    <div class="card" style="display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:start">
      ${photo}
      <div class="stack" style="margin:0">
        <div class="row"><div><h1 style="margin:0">${esc(s.name)}</h1><span class="muted"><code>${esc(s.id)}</code> · registered ${esc(when(s.createdAt))}${s.createdBy === 'self' ? ' online' : ' at the desk'}</span></div><span class="spacer"></span>${statusPill(s.status)}</div>
        <div class="grid2" style="gap:.3rem 1.5rem;font-size:.95rem">
          <div><span class="muted">Mobile (sign-in):</span> ${esc(s.phone)}</div><div><span class="muted">Guardian:</span> ${esc(s.guardianName)} ${esc(s.guardianPhone)}</div>
          <div><span class="muted">School / college:</span> ${esc(s.institution)}</div><div><span class="muted">Class:</span> ${esc(s.classLevel)}</div>
          <div style="grid-column:1/-1"><span class="muted">Address:</span> ${esc(s.address)}</div>
          ${s.notes ? `<div style="grid-column:1/-1"><span class="muted">Notes:</span> ${esc(s.notes)}</div>` : ''}
        </div>
        ${m ? `<div class="row">
          ${s.status === 'PENDING' ? '<button class="btn" id="approve">Approve</button>' : ''}
          ${can('fees.collect') && s.status === 'ACTIVE' ? `<a class="btn sm" href="#/collect/${encodeURIComponent(s.id)}">Fees & payments</a>` : ''}
          <button class="btn ghost sm" id="edit">Edit</button><button class="btn ghost sm" id="reset">Reset password</button>
          <button class="btn ghost sm" id="card" ${s.status === 'ACTIVE' ? '' : 'disabled'}>Print ID card</button>
          <button class="btn ${s.status === 'BLOCKED' ? 'ghost' : 'danger'} sm" id="block">${s.status === 'BLOCKED' ? 'Unblock' : 'Block'}</button></div>` : ''}
      </div>
    </div>
    <div class="card stack" style="margin-top:1rem">
      <h2>Batches</h2>
      ${r.enrollments.length ? `<div class="tw"><table><thead><tr><th>Batch</th><th>From</th><th>To</th><th>Status</th><th></th></tr></thead><tbody>
        ${r.enrollments.map(e => `<tr><td>${esc(batchLabel(e.batchId))}</td><td>${esc(e.startDate)}</td><td>${esc(e.endDate) || '<span class="muted">ongoing</span>'}</td><td>${statusPill(e.status)}</td>
          <td style="text-align:right;white-space:nowrap">${e.status === 'ACTIVE' && can('enroll') && (lms.courses.find(c => c.id === (lms.batches.find(b => b.id === e.batchId) || {}).courseId) || {}).paymentType !== 'ONE_TIME' ? `<button class="btn ghost sm" data-mon="${esc(e.id)}">Months…</button> ` : ''}${e.status === 'ACTIVE' && can('enroll') ? `<button class="btn ghost sm" data-end="${esc(e.id)}">End</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="margin:0">Not in any batch yet.</p>'}
      ${can('enroll') && s.status === 'ACTIVE' ? `<form class="row" id="enf" style="border-top:1px dashed var(--line);padding-top:.8rem">
        <select class="t" name="batch" required style="max-width:28rem"><option value="">Add to a batch…</option>${(() => {
          const opt = b => `<option value="${esc(b.id)}">${esc(batchLabel(b.id))} · ${esc(b.days)} ${esc(b.time)} · ${b.enrolled}${b.seats ? '/' + b.seats : ''} students</option>`;
          const clsOf = b => ((lms.courses.find(c => c.id === b.courseId) || {}).classLevel || '');
          const mine = openBatches.filter(b => clsOf(b) === s.classLevel), other = openBatches.filter(b => clsOf(b) !== s.classLevel);
          return (mine.length ? `<optgroup label="${esc(s.classLevel || 'Their class')}">${mine.map(opt).join('')}</optgroup>` : '') + (other.length ? `<optgroup label="Other classes">${other.map(opt).join('')}</optgroup>` : '');
        })()}</select>
        <label class="row" style="gap:.4rem"><span class="muted">from</span><input class="t" name="start" type="date" value="${new Date().toISOString().slice(0, 10)}" style="max-width:11rem"></label>
        <button class="btn">Enroll</button><span class="err" style="color:var(--bad)"></span></form>` : ''}
      ${s.status === 'PENDING' ? '<p class="note" style="margin:0">Approve the student before adding them to a batch.</p>' : ''}
    </div>`;
  const reload = () => viewLStudent(s.id);
  if (!m) return;
  if ($('#approve')) $('#approve').onclick = async () => { try { await api('studentStatus', { studentId: s.id, status: 'ACTIVE' }); toast('Approved'); reload(); } catch (e) { toast(errText(e)); } };
  $('#edit').onclick = () => studentDialog(s);
  $('#reset').onclick = async () => {
    if (!confirm(`Make a new password for ${s.name}? Their old password stops working, and they're signed out on every phone.`)) return;
    try { const x = await api('studentResetPassword', { studentId: s.id }); passwordSlip(s, x.tempPassword); } catch (e) { toast(errText(e)); }
  };
  $('#card').onclick = () => idCards([Object.assign({}, s, { batches: r.enrollments.filter(e => e.status === 'ACTIVE').map(e => e.batchId) })]);
  $('#block').onclick = async () => {
    const to = s.status === 'BLOCKED' ? 'ACTIVE' : 'BLOCKED';
    if (to === 'BLOCKED' && !confirm(`Block ${s.name}? They can no longer sign in.`)) return;
    try { await api('studentStatus', { studentId: s.id, status: to }); toast('Saved'); reload(); } catch (e) { toast(errText(e)); }
  };
  document.querySelectorAll('[data-mon]').forEach(b => b.onclick = async () => {
    try { const fa = await api('feeAccount', { studentId: s.id }); monthsDialog(fa.accounts.find(x => x.enrollmentId === b.dataset.mon), reload); }
    catch (x) { toast(errText(x)); }
  });
  document.querySelectorAll('[data-end]').forEach(b => b.onclick = async () => {
    const end = prompt('Last day in this batch (YYYY-MM-DD):', new Date().toISOString().slice(0, 10));
    if (!end) return;
    try { await api('enrollEnd', { enrollmentId: b.dataset.end, endDate: end.trim() }); toast('Ended'); lms = null; reload(); } catch (e) { toast(errText(e)); }
  });
  if ($('#enf')) $('#enf').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, bt = lms.batches.find(b => b.id === f.batch.value);
    let over = false;
    if (bt && bt.seats && bt.enrolled >= bt.seats) { if (!confirm(`${bt.name} is full (${bt.enrolled}/${bt.seats}). Enroll anyway?`)) return; over = true; }
    try { await api('enrollSave', { studentId: s.id, batchId: f.batch.value, startDate: f.start.value, overSeats: over }); toast('Enrolled'); lms = null; reload(); }
    catch (x) { f.querySelector('.err').textContent = errText(x); }
  };
}

function studentDialog(s) {
  dialog(`<h2>${s ? 'Edit student' : 'Register a student'}</h2><div class="stack">
    <div class="grid2"><label class="f"><span>Name</span><input class="t" name="name" value="${esc(s ? s.name : '')}" required></label>
      <label class="f"><span>Mobile (used to sign in)</span><input class="t" name="phone" type="tel" value="${esc(s ? s.phone : '')}" required placeholder="017XXXXXXXX"></label></div>
    <div class="grid2"><label class="f"><span>Guardian's name</span><input class="t" name="gname" value="${esc(s ? s.guardianName : '')}"></label>
      <label class="f"><span>Guardian's mobile</span><input class="t" name="gphone" type="tel" value="${esc(s ? s.guardianPhone : '')}"></label></div>
    <div class="grid2"><label class="f"><span>School / college</span><input class="t" name="inst" value="${esc(s ? s.institution : '')}"></label>
      <label class="f"><span>Class</span><select class="t" name="cls" required><option value="">Choose…</option>${[...new Set([...(lms.classes || []), ...(s && s.classLevel ? [s.classLevel] : [])])].map(c => `<option ${s && s.classLevel === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        <small>${s ? 'The student ID stays the same if the class changes.' : 'The student ID comes from the class: SSC 27 → S27001.'}</small></label></div>
    <label class="f"><span>Address</span><input class="t" name="addr" value="${esc(s ? s.address : '')}"></label>
    <div><label class="f"><span>Photo (optional)</span><input class="t" name="photo" value="${esc(s ? s.photo : '')}" placeholder="file name"></label>
      <div class="row" style="margin-top:.35rem"><button type="button" class="btn ghost sm" id="upPhoto">Upload photo…</button><input type="file" accept="image/*" id="photoFile" hidden><small class="muted">Uses picture upload (Settings).</small></div></div>
    <label class="f"><span>Staff notes (students don't see these)</span><input class="t" name="notes" value="${esc(s ? s.notes : '')}"></label>
    ${s ? '' : '<p class="note" style="margin:0">The student is active at once and gets a 6-digit password to print for them.</p>'}
  </div>${dlgButtons(s ? 'Save' : 'Register')}`, async (v, f) => {
    const r = await api('studentSave', { id: s ? s.id : '', name: f.name.value, phone: f.phone.value, guardianName: f.gname.value, guardianPhone: f.gphone.value,
      institution: f.inst.value, classLevel: f.cls.value, address: f.addr.value, photo: f.photo.value, notes: f.notes.value });
    if (s) { toast('Saved'); viewLStudent(s.id); }
    else { location.hash = '#/student/' + encodeURIComponent(r.student.id); setTimeout(() => passwordSlip(r.student, r.tempPassword), 400); }
  }, f => {
    $('#upPhoto').onclick = () => $('#photoFile').click();
    $('#photoFile').onchange = async e => {
      const file = e.target.files[0]; e.target.value = ''; if (!file) return;
      const box = f.querySelector('.err'); box.hidden = true;
      try { toast('Uploading photo…'); f.photo.value = await uploadPicture(file, 'student', Date.now().toString(36)); toast('Photo uploaded'); }
      catch (x) { box.hidden = false; box.textContent = errText(x); }
    };
  });
}

// Printable slip with the sign-in details (new student or new password).

// ID cards (credit-card size 85.6 × 54 mm), front and back side by side.

  if (!list.length) { toast('No active students to print.'); return; }

  const centre = (lms && lms.centre) || { address: '', phone: '' };
  const w = window.open('', '_blank'); if (!w) { toast('Allow pop-ups to print.'); return; }
  const year = new Date().getFullYear();
  const card = s => `
    <div class="card front">
      <div class="top"><img src="${esc(LOGO_URL)}" alt="${esc(CFG.SITE_NAME)}"><span>STUDENT ID</span></div>
      <div class="mid">
        ${s.photo ? `<img class="ph" src="${esc(new URL(imgSrc(s.photo), SITE_BASE).href)}" alt="">` : `<div class="ph">${esc((s.name || '?')[0])}</div>`}
        <div class="who"><div class="nm">${esc(s.name)}</div><div class="lb">ID No.</div><div class="id">${esc(s.id)}</div>
          <div class="bt">${(s.batches || []).map(b => esc(batchLabel(b))).join('<br>')}</div></div>
        <div class="qr">${qrSvgText(studentQrUrl(s.id), 1)}</div>

    </div>

      <div class="bk">
        <p><b>This card belongs to ${esc(CFG.SITE_NAME)}.</b> Please bring it to every class and show it when paying fees.</p>

        <div class="sg"><div class="ln"></div>Authorised signature</div>
      </div>
      <div class="bq">${qrSvgText(studentQrUrl(s.id), 1)}<div class="id2">${esc(s.id)}</div></div>
    </div>`;
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>ID cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
    @page { size: A4; margin: 10mm; }
    * { box-sizing: border-box; }

    .ph { width: 19mm; height: 23mm; border-radius: 1.5mm; object-fit: cover; background: #e3edfd; display: grid; place-items: center; font-size: 16pt; font-weight: 700; color: #1F6FEB; border: .3mm solid #c9d3e6; }

/* ---------- find a student (type an ID, or scan their card with a USB/phone scanner) ---------- */
