/* ---------- one student's fee page ---------- */
async function viewCollect(id) {
  shell('fees', '<p class="muted">Loading…</p>');
  let a;
  try { a = await api('feeAccount', { studentId: id }); } catch (e) { return pageError(e); }
  const s = a.student, tk = n => money(n);
  const chip = m => {
    if (m.skipped && !m.paid) return `<label class="mchip skip" title="Not continuing this month: no fee"><input type="checkbox" disabled><span><b>${esc(monthName(m.month))}</b><small>Not continuing</small></span></label>`;
    const cls = m.due === 0 ? 'paid' : m.paid > 0 ? 'part' : m.owing ? 'owe' : 'future';
    const label = m.due === 0 ? 'Paid' : m.paid > 0 ? 'Due ' + tk(m.due) : m.owing ? 'Due' : 'Advance';
    return `<label class="mchip ${cls}" title="${esc(monthName(m.month))}: fee ${tk(m.fee)}, paid ${tk(m.paid)}">
      <input type="checkbox" data-key="${esc(m.key)}" data-due="${m.due}" ${m.due === 0 ? 'disabled' : ''}><span><b>${esc(monthName(m.month))}</b><small>${label}</small></span></label>`;
  };
  $('#main').innerHTML = `
    <p style="margin:0 0 .3rem"><a class="link" href="#/fees">← Collect fees</a> · <a class="link" href="#/student/${encodeURIComponent(s.id)}">Student profile</a></p>
    <div class="card row" style="align-items:center">
      ${s.photo ? `<img src="${esc(imgSrc(s.photo))}" alt="" style="width:3.6rem;height:3.6rem;border-radius:50%;object-fit:cover">` : `<div style="width:3.6rem;height:3.6rem;border-radius:50%;background:var(--ink-soft);color:var(--ink-text);display:grid;place-items:center;font-weight:700;font-size:1.4rem">${esc(s.name[0] || '?')}</div>`}
      <div><h1 style="margin:0">${esc(s.name)}</h1><span class="muted"><code>${esc(s.id)}</code> · ${esc(s.phone)}${s.guardianPhone ? ' · Guardian ' + esc(s.guardianPhone) : ''}</span></div>
      <span class="spacer"></span>
      <div style="text-align:right"><span class="muted" style="font-size:.85rem">Due now</span><br><b style="font-size:1.6rem;color:${a.totalDue ? 'var(--bad)' : 'var(--ok)'}">${tk(a.totalDue)}</b></div>
    </div>
    ${s.status !== 'ACTIVE' ? `<p class="alert" style="margin-top:1rem">This student is ${s.status === 'PENDING' ? 'waiting for approval' : 'blocked'}; fees can't be collected.</p>` : ''}
    <form id="cf" class="stack" style="margin-top:1rem">
      ${a.accounts.length ? a.accounts.map(ac => `<div class="card">
        <div class="row" style="margin-bottom:.6rem"><div><h2>${esc(ac.courseName)} › ${esc(ac.batchName)}</h2>
          <span class="muted">${ac.paymentType === 'ONE_TIME' ? 'Course fee (one time)' : 'Monthly'} ${tk(ac.monthlyFee)}${ac.monthlyDiscount ? ` − ${tk(ac.monthlyDiscount)} discount${ac.discountNote ? ' (' + esc(ac.discountNote) + ')' : ''} = <b>${tk(Math.max(0, ac.monthlyFee - ac.monthlyDiscount))}</b>` : ''} · since ${esc(ac.startDate)}${ac.status === 'ENDED' ? ' · left ' + esc(ac.endDate) : ''}</span></div>
          <span class="spacer"></span>${can('enroll') && ac.paymentType !== 'ONE_TIME' ? `<button type="button" class="btn ghost sm" data-months="${esc(ac.enrollmentId)}">Months…</button> ` : ''}${can('fees.discount') ? `<button type="button" class="btn ghost sm" data-disc=""${esc(ac.enrollmentId)}" data-cur="${ac.monthlyDiscount}" data-note="${esc(ac.discountNote)}" data-once="${ac.paymentType === 'ONE_TIME' ? 1 : ''}">${ac.paymentType === 'ONE_TIME' ? 'Discount' : 'Monthly discount'}</button>` : ''}</div>
        ${ac.courseFee ? `<div class="mchips" style="margin-bottom:.5rem"><label class="mchip ${ac.courseFee.due ? (ac.courseFee.paid ? 'part' : 'owe') : 'paid'}"><input type="checkbox" data-key="${esc(ac.courseFee.key)}" data-due="${ac.courseFee.due}" ${ac.courseFee.due ? '' : 'disabled'}><span><b>Course fee</b><small>${ac.courseFee.due ? 'Due ' + tk(ac.courseFee.due) : 'Paid'}</small></span></label></div>` : ''}
        ${ac.admission ? `<div class="mchips" style="margin-bottom:.5rem"><label class="mchip ${ac.admission.due ? (ac.admission.paid ? 'part' : 'owe') : 'paid'}"><input type="checkbox" data-key="${esc(ac.admission.key)}" data-due="${ac.admission.due}" ${ac.admission.due ? '' : 'disabled'}><span><b>Admission</b><small>${ac.admission.due ? 'Due ' + tk(ac.admission.due) : 'Paid'}</small></span></label></div>` : ''}
        <div class="mchips">${ac.months.map(chip).join('')}</div>
      </div>`).join('') : '<p class="note">Not enrolled in any batch, so there are no monthly fees. You can still collect other fees below.</p>'}
      <div class="card stack">
        <h2>This payment</h2>
        <div id="lines"></div>
        <div class="row"><button type="button" class="btn ghost sm" id="addOther">+ Other fee (exam, book…)</button><span class="spacer"></span>
          <input class="t" name="coupon" placeholder="Coupon code" style="max-width:10rem;text-transform:uppercase"><button type="button" class="btn ghost sm" id="applyC">Apply</button></div>
        <label class="f"><span>Note on the receipt (optional)</span><input class="t" name="note" maxlength="200"></label>
        <div id="sum" class="row" style="justify-content:flex-end;font-size:1.1rem"></div>
        <p class="alert err" hidden></p>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="collect" ${s.status === 'ACTIVE' ? '' : 'disabled'}>Collect cash & print receipt</button></div>
      </div>
    </form>
    <div class="card" style="margin-top:1rem">
      <h2 style="margin-bottom:.5rem">Payment history</h2>
      <div class="tw"><table><thead><tr><th>Receipt</th><th>Date</th><th>Items</th><th>Amount</th><th>Received by</th><th></th></tr></thead><tbody>
        ${a.receipts.map(r => `<tr${r.status === 'CANCELLED' ? ' style="opacity:.6"' : ''}><td><code>${esc(r.no)}</code>${r.status === 'CANCELLED' ? '<br><span class="pill" style="color:var(--bad)">Cancelled</span>' : ''}</td><td>${esc(when(r.at))}</td>
          <td style="font-size:.88rem">${r.lines.map(l => esc(l.label.replace(/Monthly fee (\d{4}-\d{2}).*/, (m, ym) => monthName(ym) + (l.label.includes('(part)') ? ' (part)' : '')).replace(/^Admission fee.*/, 'Admission'))).join(', ')}</td>
          <td class="n"><b>${tk(r.total)}</b>${r.discount ? `<br><span class="muted" style="font-size:.8rem">−${tk(r.discount)} ${esc(r.coupon)}</span>` : ''}</td><td>${esc(r.receivedByName || r.receivedBy)}</td>
          <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-rc="${esc(r.no)}">Receipt</button>${me.role === 'super' && r.status === 'PAID' ? ` <button class="btn danger sm" data-cancel="${esc(r.no)}">Cancel</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No payments yet.</td></tr>'}
      </tbody></table></div>
    </div>`;
  const f = $('#cf');
  let others = [], preview = null;
  const selected = () => [...f.querySelectorAll('[data-key]:checked')].map(c => ({ key: c.dataset.key, due: +c.dataset.due, label: c.closest('.mchip').querySelector('b').textContent }));
  const draw = () => {
    const sel = selected();
    $('#lines').innerHTML = (sel.length || others.length) ? `<div class="tw"><table><tbody>
      ${sel.map(x => `<tr><td>${esc(x.label)}</td><td style="width:9rem"><input class="t" type="number" min="1" step="1" max="${x.due}" value="${esc(String(amounts[x.key] ?? x.due))}" data-amt="${esc(x.key)}" style="text-align:right"></td></tr>`).join('')}
      ${others.map((o, i) => `<tr><td><input class="t" placeholder="e.g. Exam fee" value="${esc(o.label)}" data-ol="${i}"></td><td style="width:9rem"><input class="t" type="number" min="1" value="${esc(String(o.amount || ''))}" data-oa="${i}" style="text-align:right"></td><td><button type="button" class="link" data-orm="${i}">remove</button></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted" style="margin:0">Tick the months above (and/or add other fees). You can lower an amount for a part payment.</p>';
    const sub = sel.reduce((t, x) => t + Number(amounts[x.key] ?? x.due), 0) + others.reduce((t, o) => t + (Number(o.amount) || 0), 0);
    const disc = preview && preview.discount ? preview.discount : 0;
    $('#sum').innerHTML = `${disc ? `<span class="muted">Subtotal ${tk(sub)} · Coupon −${tk(disc)} ·</span>` : ''}<b>Total ${tk(sub - disc)}</b>`;
    f.querySelectorAll('[data-amt]').forEach(i => i.oninput = () => { amounts[i.dataset.amt] = i.value; preview = null; drawSum(); });
    f.querySelectorAll('[data-ol]').forEach(i => i.oninput = () => { others[+i.dataset.ol].label = i.value; });
    f.querySelectorAll('[data-oa]').forEach(i => i.oninput = () => { others[+i.dataset.oa].amount = i.value; preview = null; drawSum(); });
    f.querySelectorAll('[data-orm]').forEach(b => b.onclick = () => { others.splice(+b.dataset.orm, 1); preview = null; draw(); });
  };
  const amounts = {};
  const drawSum = () => {
    const sel = selected();
    const sub = sel.reduce((t, x) => t + Number(amounts[x.key] ?? x.due), 0) + others.reduce((t, o) => t + (Number(o.amount) || 0), 0);
    $('#sum').innerHTML = `<b>Total ${tk(sub)}</b>`;
  };
  const payload = () => ({ studentId: s.id, coupon: f.coupon.value.trim(), note: f.note.value.trim(),
    lines: selected().map(x => ({ key: x.key, amount: Number(amounts[x.key] ?? x.due) })).concat(others.map(o => ({ label: o.label, amount: Number(o.amount) }))) });
  f.querySelectorAll('[data-key]').forEach(c => c.onchange = () => { preview = null; draw(); });
  $('#addOther').onclick = () => { others.push({ label: '', amount: '' }); draw(); };
  $('#applyC').onclick = async () => {
    const box = f.querySelector('.err'); box.hidden = true;
    try { preview = await api('feePreview', payload()); draw(); toast(preview.discount ? 'Coupon applied' : 'No discount'); } catch (x) { preview = null; box.hidden = false; box.textContent = errText(x); }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const box = f.querySelector('.err'); box.hidden = true;
    const p = payload();
    if (p.lines.some(l => !(l.amount > 0))) { box.hidden = false; box.textContent = 'Every amount must be more than 0.'; return; }
    try {
      const pv = await api('feePreview', p);
      if (!confirm(`Collect ${tk(pv.total)} in cash from ${s.name}?${pv.discount ? `\n(Coupon ${pv.coupon}: −${tk(pv.discount)})` : ''}`)) return;
      const r = await api('feeCollect', p);
      printReceipt(r.receipt); toast('Receipt ' + r.receipt.no + ' saved'); viewCollect(s.id);
    } catch (x) { box.hidden = false; box.textContent = errText(x); }
  };
  document.querySelectorAll('[data-rc]').forEach(b => b.onclick = async () => { try { printReceipt((await api('receiptGet', { no: b.dataset.rc })).receipt); } catch (x) { toast(errText(x)); } });
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    const reason = prompt(`Cancel receipt ${b.dataset.cancel}? It stays on record, marked cancelled, and its months become due again.\n\nReason:`);
    if (!reason) return;
    try { await api('receiptCancel', { no: b.dataset.cancel, reason }); toast('Receipt cancelled'); viewCollect(s.id); } catch (x) { toast(errText(x)); }
  });
  document.querySelectorAll('[data-months]').forEach(b => b.onclick = () => monthsDialog(a.accounts.find(x => x.enrollmentId === b.dataset.months), () => viewCollect(s.id)));
  document.querySelectorAll('[data-disc]').forEach(b => b.onclick = async () => {
    const v = prompt(b.dataset.once ? 'Discount on the course fee for this student (৳, 0 for none):' : 'Monthly discount for this student in this batch (৳ per month, 0 for none):', b.dataset.cur || '0');
    if (v === null) return;
    const note = prompt('Reason (e.g. sibling, merit):', b.dataset.note || '');
    try { await api('enrollDiscount', { enrollmentId: b.dataset.disc, monthlyDiscount: Number(v), note: note || '' }); toast('Discount saved'); viewCollect(s.id); } catch (x) { toast(errText(x)); }
  });
  draw();
}

});
let bank = null, bankSel = { chapterId: '', type: '', q: '', mine: false }, bankUploads = false;
const DIFF_NAMES = { EASY: 'Easy', MEDIUM: 'Medium', HARD: 'Hard' };
async function loadBankTree() { bank = await api('bankTree'); bankUploads = bank.uploads; return bank; }
const chapterPath = id => {
  const c = bank.chapters.find(x => x.id === id); if (!c) return '';
  const sb = bank.subjects.find(x => x.id === c.subjectId) || {}, sg = bank.segments.find(x => x.id === sb.segmentId) || {};

const chTotal = c => c.counts.MCQ + c.counts.CQ + c.counts.SQ + c.counts.MATH;

async function viewBank(chapterId) {
  shell('bank', '<p class="muted">Loading…</p>');
  try { await loadBankTree(); } catch (e) { return pageError(e); }
  if (chapterId) bankSel.chapterId = chapterId;
  if (!bank.chapters.some(c => c.id === bankSel.chapterId)) bankSel.chapterId = '';
  const open = new Set();
  if (bankSel.chapterId) { const c = bank.chapters.find(x => x.id === bankSel.chapterId); const sb = bank.subjects.find(x => x.id === c.subjectId); open.add(sb.id); open.add(sb.segmentId); }
  const S = bank.canStructure;
  $('#main').innerHTML = `
    <div class="row" style="margin-bottom:.2rem"><h1>Question bank</h1><span class="spacer"></span>${S ? '<button class="btn ghost sm" id="addSeg">+ Segment</button>' : ''}</div>
    <p class="lede">Every question lives in a chapter. Exams and books will pick questions from here. ${bank.canEditAll ? '' : 'You can see all questions and edit the ones you wrote.'}</p>
    <div class="bankgrid">
      <nav class="banktree card" aria-label="Chapters">${bank.segments.map(sg => {

          ${subs.map(sb => { const chs = bank.chapters.filter(c => c.subjectId === sb.id); const tot = chs.reduce((a, c) => a + chTotal(c), 0);
            return `<details class="sub" ${open.has(sb.id) ? 'open' : ''}><summary>${esc(sb.name)} <span class="cnt">${tot}</span>${S ? `<button class="link tiny" data-edsub="${esc(sb.id)}">edit</button><button class="link tiny" data-addch="${esc(sb.id)}">+ chapters</button>` : ''}</summary>
              ${chs.map(c => `<a href="#/bank/${encodeURIComponent(c.id)}" class="${c.id === bankSel.chapterId ? 'on' : ''}">${esc(c.name)} <span class="cnt">${chTotal(c)}</span></a>`).join('') || '<span class="muted tiny">No chapters</span>'}

    document.querySelectorAll('[data-addsub]').forEach(b => b.onclick = e => { e.preventDefault(); structDialog('subject', null, b.dataset.addsub); });
    document.querySelectorAll('[data-edsub]').forEach(b => b.onclick = e => { e.preventDefault(); const sb = bank.subjects.find(x => x.id === b.dataset.edsub); structDialog('subject', sb, sb.segmentId); });

  $('#bankpane').innerHTML = `<div class="card">
    <div class="row" style="margin-bottom:.5rem"><div><span class="muted" style="font-size:.85rem">${esc(chapterPath(c.id).split(' › ').slice(0, 2).join(' › '))}</span><h2>${esc(c.name)}</h2></div><span class="spacer"></span>

      <button class="btn ghost sm" id="mkSlides" ${r.questions.length ? '' : 'disabled'}>Make slides</button>

    <nav class="tabs" style="margin-bottom:.6rem">${tabs.map(([k, l, n]) => `<a href="#" data-bt="${k}" ${bankSel.type === k ? 'aria-current="page"' : ''}>${l} ${n}</a>`).join('')}</nav>
    <form class="row" id="bf" style="margin-bottom:.4rem"><input class="t" name="q" value="${esc(bankSel.q)}" placeholder="Search text, source or ID" style="max-width:18rem">
      <label class="check"><input type="checkbox" name="mine" ${bankSel.mine ? 'checked' : ''}> Only mine (${c.counts.mine})</label><button class="btn ghost sm">Search</button></form>
    <div id="bqlist">${r.questions.map((q, i) => `<div class="qcard">
      <span class="qnum"><input type="checkbox" class="qsel" data-sel="${esc(q.id)}" aria-label="Select for slides"> ${bn(nums[i])}.<span class="qtype t-${q.type}">${q.type === 'MATH' ? 'Math' : q.type}</span></span>
      <div class="qbody">${questionBody(q)}
        <div class="qmeta"><code>${esc(q.id)}</code> · ${esc(q.author)}${q.difficulty ? ' · ' + DIFF_NAMES[q.difficulty] : ''}${q.source ? ' · ' + esc(q.source) : ''}</div></div>
      <div class="qtools">${q.canEdit ? `<button class="btn ghost sm" data-bed="${esc(q.id)}">Edit</button><button class="btn danger sm" data-bdel="${esc(q.id)}">Delete</button>` : ''}</div>
    </div>`).join('') || '<p class="muted">No questions here yet.</p>'}</div></div>`;
  typeset($('#bqlist'));
  document.querySelectorAll('[data-bt]').forEach(a => a.onclick = e => { e.preventDefault(); bankSel.type = a.dataset.bt; loadBankPane(); });
  $('#bf').onsubmit = e => { e.preventDefault(); bankSel.q = e.target.q.value.trim(); bankSel.mine = e.target.mine.checked; loadBankPane(); };
  if ($('#edCh')) $('#edCh').onclick = () => structDialog('chapter', c, c.subjectId);
  const edit = q => questionDialog(null, { bank: true, q: q || { type: bankSel.type || 'MCQ' }, title: q ? 'Edit question ' + q.id : 'Add a question to ' + c.name, examId: c.id,
    onSave: async data => { await api('bankSave', { chapterId: c.id, qid: q ? q.id : '', q: data }); toast(q ? 'Saved' : 'Question added'); await loadBankTree(); viewBank(c.id); } });
  $('#addBQ').onclick = () => edit(null);
  $('#mkSlides').onclick = () => {
    const picked = [...document.querySelectorAll('.qsel:checked')].map(x => x.dataset.sel);
    const list = picked.length ? r.questions.filter(q => picked.includes(q.id)) : r.questions;
    makeSlides(list, c.name + (bankSel.type ? ' ' + bankSel.type : '') + (picked.length ? ' (selected)' : ''));
  };
  document.querySelectorAll('[data-bed]').forEach(b => b.onclick = () => edit(r.questions.find(x => x.id === b.dataset.bed)));
  document.querySelectorAll('[data-bdel]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this question from the bank?')) return;
    try { await api('bankDelete', { qid: b.dataset.bdel }); toast('Deleted'); await loadBankTree(); viewBank(c.id); } catch (x) { toast(errText(x)); }
  });
}

/* ---------- Word upload into a chapter ---------- */
async function viewBankImport(chapterId) {
  shell('bank', '<p class="muted">Loading…</p>');
  try { await loadBankTree(); } catch (e) { return pageError(e); }
  const c = bank.chapters.find(x => x.id === chapterId);
  if (!c) { location.hash = '#/bank'; return; }
  if (!imp || imp.examId !== 'CH:' + chapterId) imp = { examId: 'CH:' + chapterId, questions: null, images: [], fileName: '' };
  const ex = { id: c.id, name: c.name, questions: 0, attempts: 0, isChapter: true };
  $('#main').innerHTML = `
    <p style="margin:0 0 .3rem"><a class="link" href="#/bank/${encodeURIComponent(c.id)}">← ${esc(c.name)}</a></p>
    <h1>Upload a Word file</h1>
    <p class="lede">Questions go into <b>${esc(chapterPath(c.id))}</b>. Use section headings (বহুনির্বাচনী / সৃজনশীল / সংক্ষিপ্ত / গাণিতিক সমস্যা) for different types. <button class="link" data-template>Download the Word template</button></p>
    <div class="card row"><input type="file" id="docx" accept=".docx" hidden><button class="btn" id="choose">${imp.questions ? 'Choose another Word file' : 'Choose Word file (.docx)'}</button><span class="muted">${esc(imp.fileName)}</span></div>
    <div id="iarea"></div>`;
  $('#choose').onclick = () => $('#docx').click();
  $('#docx').onchange = async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    $('#iarea').innerHTML = '<p class="muted" style="margin-top:1rem">Reading the Word file…</p>';
    try {
      const r = await DocxImport.parse(await file.arrayBuffer());
      imp.images = r.images.map((im, i) => { const url = im.blob && im.supported ? URL.createObjectURL(im.blob) : ''; if (url) localImgs['@' + i] = url; return Object.assign(im, { url }); });
      imp.questions = r; imp.fileName = file.name; viewBankImport(chapterId);
    } catch (err) { $('#iarea').innerHTML = `<p class="alert" style="margin-top:1rem">${esc(errText(err.code ? err : { code: err.message }))}</p>`; }
  };
  if (imp.questions) renderImport(ex);
}

// Turns questions into the slide maker's rows (its Excel template's columns).
function toSlideRows(list, label) {
  const absImg = ref => { const src = imgSrc(ref); return src ? new URL(src, location.href).href : ''; };
  const firstInline = t => { const m = String(t || '').match(/\[img:\s*([^\]\s]+)\s*\]/i); return m ? m[1] : ''; };
  const clean = t => String(t || '').replace(/\n?\[img:[^\]]*\]\n?/gi, '\n').replace(/\n{2,}/g, '\n').trim();
  const n = {};
  return list.map(q => {
    const t = q.type || 'MCQ';
    n[t] = (n[t] || 0) + 1;
    const img = q.image || firstInline(q.question);
    let question = clean(q.question), solution = clean(q.solution);
    if (t === 'CQ') {
      question += '\n' + (q.parts || []).map((p, j) => `${CQ_LABELS[j]}. ${clean(p.text)} (${bn(p.marks)})`).join('\n');
      const ans = (q.parts || []).map((p, j) => p.solution ? `${CQ_LABELS[j]}. ${clean(p.solution)}` : '').filter(Boolean).join('\n');
      solution = [ans, solution].filter(Boolean).join('\n');
    } else if (t === 'SQ' || t === 'MATH') question += q.marks ? ` [${bn(q.marks)}]` : '';
    const row = { ExamID: label, QNo: String(n[t]), Question: question, ImageURL: img ? absImg(img) : '', Solution: solution, Type: t === 'MCQ' ? 'MCQ' : 'Problem' };
    if (t === 'MCQ') Object.assign(row, { OptionA: clean(q.options[0]), OptionB: clean(q.options[1]), OptionC: clean(q.options[2]), OptionD: clean(q.options[3]), Answer: q.answer || '' });
    return row;
  });
}
function makeSlides(list, label) {
  if (!list.length) { toast('No questions to make slides from.'); return; }
  try { localStorage.setItem('gp_slides_payload', JSON.stringify({ name: label, rows: toSlideRows(list, label), at: Date.now() })); }
  catch (e) { toast('Your browser blocked the hand-over. Allow site storage and try again.'); return; }
  window.open('slides/', '_blank');
}

boot();
})();
