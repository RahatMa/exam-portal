    $('#dlg').classList.add('wide');
    $('#dlg').addEventListener('close', () => { $('#dlg').classList.remove('wide'); if (added) { lms = null; viewCourses(); } }, { once: true });
    let timer, seq = 0;
    const search = async () => {
      const q = $('#asq').value.trim(), only = $('#asOnly') && $('#asOnly').checked, my = ++seq;
      if (!q && !only) { $('#asList').innerHTML = '<p class="muted">Type to search…</p>'; return; }
      $('#asList').innerHTML = '<p class="muted">Searching…</p>';
      let r;
      try { r = await api('studentsList', { q, status: 'ACTIVE', classLevel: only ? course.classLevel : '', limit: 50 }); } catch (x) { $('#asList').innerHTML = `<p class="alert">${esc(errText(x))}</p>`; return; }
      if (my !== seq) return;
      $('#asList').innerHTML = `<table><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Mobile</th><th>School</th><th></th></tr></thead><tbody>
        ${r.students.map(st => `<tr><td><code>${esc(st.id)}</code></td><td>${esc(st.name)}</td><td>${esc(st.classLevel)}</td><td>${esc(st.phone)}</td><td>${esc(st.institution)}</td>
          <td style="text-align:right">${st.batches.includes(b.id) ? '<span class="pill ok">In this batch</span>' : `<button type="button" class="btn sm" data-add="${esc(st.id)}">Add</button>`}</td></tr>`).join('')
          || `<tr><td colspan="6" class="muted">No active student found${only ? ' in ' + esc(course.classLevel) + '. Untick “Only ' + esc(course.classLevel) + '” to search all classes' : ''}. Students waiting for approval must be approved first.</td></tr>`}</tbody></table>
        ${r.matched > r.students.length ? `<p class="muted">Showing ${r.students.length} of ${r.matched}. Type more to narrow down.</p>` : ''}`;
      $('#asList').querySelectorAll('[data-add]').forEach(btn => btn.onclick = async () => {
        const st = r.students.find(x => x.id === btn.dataset.add);
        let over = false;
        if (b.seats && b.enrolled >= b.seats) { if (!confirm(`${b.name} is full (${b.enrolled}/${b.seats}). Add anyway?`)) return; over = true; }
        if (course.classLevel && st.classLevel !== course.classLevel && !confirm(`${st.name} is in ${st.classLevel || 'no class'}, but this course is for ${course.classLevel}. Add anyway?`)) return;
        btn.disabled = true;
        try {
          await api('enrollSave', { studentId: st.id, batchId: b.id, overSeats: over });
          b.enrolled++; added++; st.batches.push(b.id);
          btn.outerHTML = '<span class="pill ok">Added ✓</span>';
          $('#asInfo').textContent = `${b.enrolled}${b.seats ? ' of ' + b.seats + ' seats' : ''} taken · ${added} added now.`;
        } catch (x) { btn.disabled = false; toast(errText(x)); }
      });
    };
    $('#asq').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 350); });
    if ($('#asOnly')) { $('#asOnly').onchange = search; search(); }
  });
}

/* ---------- students list ---------- */
let stuFilter = { status: '', q: '', batchId: '', classLevel: '' };
async function viewLStudents(arg) {
  shell('lstudents', '<p class="muted">Loading…</p>');
  try { await ensureLms(); } catch (e) { return pageError(e); }
  if (arg && arg.startsWith('batch:')) stuFilter = { status: '', q: '', batchId: arg.slice(6) };
  else if (arg === 'pending') stuFilter = { status: 'PENDING', q: '', batchId: '' };
  $('#main').innerHTML = `
    <div class="row" style="margin-bottom:.2rem"><h1>Students</h1><span class="spacer"></span>${can('students.manage') ? '<button class="btn" id="addStu">+ Register a student</button>' : ''}</div>
    <p class="lede">${me.role === 'teacher' ? 'Students in your batches.' : 'Students who register on the student site wait here until the desk approves them. Students registered at the desk are active straight away.'}</p>
    <nav class="tabs" id="stabs"></nav>
    <form class="row" id="sf" style="margin-bottom:1rem">
      <input class="t" name="q" placeholder="Search name, ID, phone, school" style="max-width:18rem" value="${esc(stuFilter.q)}">
      <select class="t" name="cls" style="max-width:10rem"><option value="">All classes</option>${(lms.classes || []).map(c => `<option ${c === stuFilter.classLevel ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select class="t" name="batch" style="max-width:20rem"><option value="">All batches</option>${lms.batches.map(b => `<option value="${esc(b.id)}" ${b.id === stuFilter.batchId ? 'selected' : ''}>${esc(batchLabel(b.id))}</option>`).join('')}</select>
      <button class="btn ghost">Search</button>
      ${stuFilter.batchId ? '<button type="button" class="btn ghost sm" id="cardsAll">Print ID cards for this batch</button>' : ''}
    </form>
    <div class="card tw" id="slist"><p class="muted">Loading…</p></div>`;
  if ($('#addStu')) $('#addStu').onclick = async () => { await ensureLms(); studentDialog(null); };
  $('#sf').onsubmit = e => { e.preventDefault(); stuFilter.q = e.target.q.value.trim(); stuFilter.batchId = e.target.batch.value; stuFilter.classLevel = e.target.cls.value; viewLStudents(); };
  let r;
  try { r = await api('studentsList', stuFilter); } catch (e) { $('#slist').innerHTML = `<p class="alert">${esc(errText(e))}</p>`; return; }
  if (r.counts) $('#stabs').innerHTML = [['', 'All', r.counts.total], ['PENDING', 'Waiting approval', r.counts.pending], ['ACTIVE', 'Active', r.counts.active], ['BLOCKED', 'Blocked', r.counts.blocked]]
    .map(([k, l, n]) => `<a href="#" data-st="${k}" ${stuFilter.status === k ? 'aria-current="page"' : ''}>${l} ${n}</a>`).join('');
  document.querySelectorAll('[data-st]').forEach(a => a.onclick = e => { e.preventDefault(); stuFilter.status = a.dataset.st; viewLStudents(); });
  $('#slist').innerHTML = `<table><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Guardian</th><th>School / class</th><th>Batches</th><th>Status</th><th></th></tr></thead><tbody>
    ${r.students.map(s => `<tr><td><code>${esc(s.id)}</code></td><td><a href="#/student/${encodeURIComponent(s.id)}">${esc(s.name)}</a></td><td>${esc(s.phone)}</td><td>${esc(s.guardianPhone)}</td>
      <td>${esc(s.institution)}${s.classLevel ? '<br><span class="muted">' + esc(s.classLevel) + '</span>' : ''}</td><td style="font-size:.88rem">${s.batches.map(b => esc(batchLabel(b))).join('<br>') || '<span class="muted">—</span>'}</td>
      <td>${statusPill(s.status)}</td><td style="text-align:right;white-space:nowrap">${s.status === 'PENDING' && can('students.manage') ? `<button class="btn sm" data-approve="${esc(s.id)}">Approve</button> ` : ''}<a class="btn ghost sm" href="#/student/${encodeURIComponent(s.id)}">Open</a></td></tr>`).join('') || '<tr><td colspan="8" class="muted">No students found.</td></tr>'}
    </tbody></table>${r.matched > r.students.length ? `<p class="muted">Showing the newest ${r.students.length} of ${r.matched}. Search to narrow down.</p>` : ''}`;
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = async () => { try { await api('studentStatus', { studentId: b.dataset.approve, status: 'ACTIVE' }); toast('Approved'); viewLStudents(); } catch (e) { toast(errText(e)); } });
  if ($('#cardsAll')) $('#cardsAll').onclick = () => idCards(r.students.filter(s => s.status === 'ACTIVE'));
}

/* ---------- one student ---------- */
async function viewLStudent(id) {
  shell('lstudents', '<p class="muted">Loading…</p>');
  let r;
  try { await ensureLms(); r = await api('studentGet', { studentId: id }); } catch (e) { return pageError(e); }
  const s = r.student, m = can('students.manage');
  const photo = s.photo ? `<img src="${esc(imgSrc(s.photo))}" alt="" style="width:6rem;height:7rem;object-fit:cover;border-radius:6px;border:1px solid var(--line)">` : `<div style="width:6rem;height:7rem;border-radius:6px;background:var(--desk);display:grid;place-items:center;font-size:2rem;color:var(--muted)">${esc((s.name || '?')[0])}</div>`;
  const openBatches = lms.batches.filter(b => b.status !== 'CLOSED' && !r.enrollments.some(e => e.batchId === b.id && e.status === 'ACTIVE'));
  $('#main').innerHTML = `
    <p style="margin:0 0 .3rem"><a class="link" href="#/lstudents">← Students</a></p>
    <div class="card" style="display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:start">
      ${photo}
      <div class="stack" style="margin:0">
        <div class="row"><div><h1 style="margin:0">${esc(s.name)}</h1><span class="muted"><code>${esc(s.id)}</code> · registered ${esc(when(s.createdAt))}${s.createdBy === 'self' ? ' online' : ' at the desk'}</span></div><span class="spacer"></span>${statusPill(s.status)}</div>
        <div class="grid2" style="gap:.3rem 1.5rem;font-size:.95rem">
          <div><span class="muted">Mobile (sign-in):</span> ${esc(s.phone)}</div><div><span class="muted">Guardian:</span> ${esc(s.guardianName)} ${esc(s.guardianPhone)}</div>
          <div><span class="muted">School / college:</span> ${esc(s.institution)}</div><div><span class="muted">Class:</span> ${esc(s.classLevel)}</div>
          <div style="grid-column:1/-1"><span class="muted">Address:</span> ${esc(s.address)}</div>
          ${s.notes ? `<div style="grid-column:1/-1"><span class="muted">Notes:</span> ${esc(s.notes)}</div>` : ''}
        </div>
        ${m ? `<div class="row">
          ${s.status === 'PENDING' ? '<button class="btn" id="approve">Approve</button>' : ''}
          ${can('fees.collect') && s.status === 'ACTIVE' ? `<a class="btn sm" href="#/collect/${encodeURIComponent(s.id)}">Fees & payments</a>` : ''}
          <button class="btn ghost sm" id="edit">Edit</button><button class="btn ghost sm" id="reset">Reset password</button>
          <button class="btn ghost sm" id="card" ${s.status === 'ACTIVE' ? '' : 'disabled'}>Print ID card</button>
          <button class="btn ${s.status === 'BLOCKED' ? 'ghost' : 'danger'} sm" id="block">${s.status === 'BLOCKED' ? 'Unblock' : 'Block'}</button></div>` : ''}
      </div>
    </div>
    <div class="card stack" style="margin-top:1rem">
      <h2>Batches</h2>
      ${r.enrollments.length ? `<div class="tw"><table><thead><tr><th>Batch</th><th>From</th><th>To</th><th>Status</th><th></th></tr></thead><tbody>
        ${r.enrollments.map(e => `<tr><td>${esc(batchLabel(e.batchId))}</td><td>${esc(e.startDate)}</td><td>${esc(e.endDate) || '<span class="muted">ongoing</span>'}</td><td>${statusPill(e.status)}</td>
          <td style="text-align:right">${e.status === 'ACTIVE' && can('enroll') ? `<button class="btn ghost sm" data-end="${esc(e.id)}">End</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="margin:0">Not in any batch yet.</p>'}
      ${can('enroll') && s.status === 'ACTIVE' ? `<form class="row" id="enf" style="border-top:1px dashed var(--line);padding-top:.8rem">
        <select class="t" name="batch" required style="max-width:28rem"><option value="">Add to a batch…</option>${(() => {
          const opt = b => `<option value="${esc(b.id)}">${esc(batchLabel(b.id))} · ${esc(b.days)} ${esc(b.time)} · ${b.enrolled}${b.seats ? '/' + b.seats : ''} students</option>`;
          const clsOf = b => ((lms.courses.find(c => c.id === b.courseId) || {}).classLevel || '');
          const mine = openBatches.filter(b => clsOf(b) === s.classLevel), other = openBatches.filter(b => clsOf(b) !== s.classLevel);
          return (mine.length ? `<optgroup label="${esc(s.classLevel || 'Their class')}">${mine.map(opt).join('')}</optgroup>` : '') + (other.length ? `<optgroup label="Other classes">${other.map(opt).join('')}</optgroup>` : '');
        })()}</select>
        <label class="row" style="gap:.4rem"><span class="muted">from</span><input class="t" name="start" type="date" value="${new Date().toISOString().slice(0, 10)}" style="max-width:11rem"></label>
        <button class="btn">Enroll</button><span class="err" style="color:var(--bad)"></span></form>` : ''}
      ${s.status === 'PENDING' ? '<p class="note" style="margin:0">Approve the student before adding them to a batch.</p>' : ''}
    </div>`;
  const reload = () => viewLStudent(s.id);
  if (!m) return;
  if ($('#approve')) $('#approve').onclick = async () => { try { await api('studentStatus', { studentId: s.id, status: 'ACTIVE' }); toast('Approved'); reload(); } catch (e) { toast(errText(e)); } };
  $('#edit').onclick = () => studentDialog(s);
  $('#reset').onclick = async () => {
    if (!confirm(`Make a new password for ${s.name}? Their old password stops working, and they're signed out on every phone.`)) return;
    try { const x = await api('studentResetPassword', { studentId: s.id }); passwordSlip(s, x.tempPassword); } catch (e) { toast(errText(e)); }
  };
  $('#card').onclick = () => idCards([Object.assign({}, s, { batches: r.enrollments.filter(e => e.status === 'ACTIVE').map(e => e.batchId) })]);
  $('#block').onclick = async () => {
    const to = s.status === 'BLOCKED' ? 'ACTIVE' : 'BLOCKED';
    if (to === 'BLOCKED' && !confirm(`Block ${s.name}? They can no longer sign in.`)) return;
    try { await api('studentStatus', { studentId: s.id, status: to }); toast('Saved'); reload(); } catch (e) { toast(errText(e)); }
  };
  document.querySelectorAll('[data-end]').forEach(b => b.onclick = async () => {
    const end = prompt('Last day in this batch (YYYY-MM-DD):', new Date().toISOString().slice(0, 10));
    if (!end) return;
    try { await api('enrollEnd', { enrollmentId: b.dataset.end, endDate: end.trim() }); toast('Ended'); lms = null; reload(); } catch (e) { toast(errText(e)); }
  });
  if ($('#enf')) $('#enf').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, bt = lms.batches.find(b => b.id === f.batch.value);
    let over = false;
    if (bt && bt.seats && bt.enrolled >= bt.seats) { if (!confirm(`${bt.name} is full (${bt.enrolled}/${bt.seats}). Enroll anyway?`)) return; over = true; }
    try { await api('enrollSave', { studentId: s.id, batchId: f.batch.value, startDate: f.start.value, overSeats: over }); toast('Enrolled'); lms = null; reload(); }
    catch (x) { f.querySelector('.err').textContent = errText(x); }
  };
}

function studentDialog(s) {
  dialog(`<h2>${s ? 'Edit student' : 'Register a student'}</h2><div class="stack">
    <div class="grid2"><label class="f"><span>Name</span><input class="t" name="name" value="${esc(s ? s.name : '')}" required></label>
      <label class="f"><span>Mobile (used to sign in)</span><input class="t" name="phone" type="tel" value="${esc(s ? s.phone : '')}" required placeholder="017XXXXXXXX"></label></div>
    <div class="grid2"><label class="f"><span>Guardian's name</span><input class="t" name="gname" value="${esc(s ? s.guardianName : '')}"></label>
      <label class="f"><span>Guardian's mobile</span><input class="t" name="gphone" type="tel" value="${esc(s ? s.guardianPhone : '')}"></label></div>
    <div class="grid2"><label class="f"><span>School / college</span><input class="t" name="inst" value="${esc(s ? s.institution : '')}"></label>
      <label class="f"><span>Class</span><select class="t" name="cls" required><option value="">Choose…</option>${[...new Set([...(lms.classes || []), ...(s && s.classLevel ? [s.classLevel] : [])])].map(c => `<option ${s && s.classLevel === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        <small>${s ? 'The student ID stays the same if the class changes.' : 'The student ID comes from the class: SSC 27 → S27001.'}</small></label></div>
    <label class="f"><span>Address</span><input class="t" name="addr" value="${esc(s ? s.address : '')}"></label>
    <div><label class="f"><span>Photo (optional)</span><input class="t" name="photo" value="${esc(s ? s.photo : '')}" placeholder="file name"></label>
      <div class="row" style="margin-top:.35rem"><button type="button" class="btn ghost sm" id="upPhoto">Upload photo…</button><input type="file" accept="image/*" id="photoFile" hidden><small class="muted">Uses picture upload (Settings).</small></div></div>
    <label class="f"><span>Staff notes (students don't see these)</span><input class="t" name="notes" value="${esc(s ? s.notes : '')}"></label>
    ${s ? '' : '<p class="note" style="margin:0">The student is active at once and gets a 6-digit password to print for them.</p>'}
  </div>${dlgButtons(s ? 'Save' : 'Register')}`, async (v, f) => {
    const r = await api('studentSave', { id: s ? s.id : '', name: f.name.value, phone: f.phone.value, guardianName: f.gname.value, guardianPhone: f.gphone.value,
      institution: f.inst.value, classLevel: f.cls.value, address: f.addr.value, photo: f.photo.value, notes: f.notes.value });
    if (s) { toast('Saved'); viewLStudent(s.id); }
    else { location.hash = '#/student/' + encodeURIComponent(r.student.id); setTimeout(() => passwordSlip(r.student, r.tempPassword), 400); }
  }, f => {
    $('#upPhoto').onclick = () => $('#photoFile').click();
    $('#photoFile').onchange = async e => {
      const file = e.target.files[0]; e.target.value = ''; if (!file) return;
      const box = f.querySelector('.err'); box.hidden = true;
      try { toast('Uploading photo…'); f.photo.value = await uploadPicture(file, 'student', Date.now().toString(36)); toast('Photo uploaded'); }
      catch (x) { box.hidden = false; box.textContent = errText(x); }
    };
  });
}

// ID cards (credit-card size 85.6 × 54 mm), front and back side by side.
// The QR code holds the student's own link (…admin.html#/collect/S26-0001):

async function idCards(list) {
  if (!list.length) { toast('No active students to print.'); return; }

  const centre = (lms && lms.centre) || { address: '', phone: '' };
  const w = window.open('', '_blank'); if (!w) { toast('Allow pop-ups to print.'); return; }
  const year = new Date().getFullYear();
  const card = s => `
    <div class="card front">
      <div class="top"><img src="${esc(LOGO_URL)}" alt="${esc(CFG.SITE_NAME)}"><span>STUDENT ID</span></div>
      <div class="mid">
        ${s.photo ? `<img class="ph" src="${esc(new URL(imgSrc(s.photo), SITE_BASE).href)}" alt="">` : `<div class="ph">${esc((s.name || '?')[0])}</div>`}
        <div class="who"><div class="nm">${esc(s.name)}</div><div class="lb">ID No.</div><div class="id">${esc(s.id)}</div>
          <div class="bt">${(s.batches || []).map(b => esc(batchLabel(b))).join('<br>')}</div></div>
        <div class="qr">${qrSvgText(studentQrUrl(s.id), 1)}</div>
      </div>
      <div class="bot"><span>${esc(s.phone || '')}</span><span>Session ${year}</span></div>
    </div>
    <div class="card back">
      <div class="bk">
        <p><b>This card belongs to ${esc(CFG.SITE_NAME)}.</b> Please bring it to every class and show it when paying fees.</p>
        <p>If found, please return to:<br><b>${esc(CFG.SITE_NAME)}</b>${centre.address ? '<br>' + esc(centre.address) : ''}${centre.phone ? '<br>' + esc(centre.phone) : ''}</p>
        <div class="sg"><div class="ln"></div>Authorised signature</div>
      </div>
      <div class="bq">${qrSvgText(studentQrUrl(s.id), 1)}<div class="id2">${esc(s.id)}</div></div>
    </div>`;
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>ID cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
    @page { size: A4; margin: 10mm; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Hind Siliguri', system-ui, sans-serif; color: #0B1F4B; }

    .sheet { display: grid; grid-template-columns: repeat(2, 85.6mm); gap: 5mm 6mm; padding: 6mm; justify-content: center; }

    .top { display: flex; align-items: center; justify-content: space-between; padding: 0 3.5mm; border-bottom: .8mm solid #1F6FEB; }
    .top img { height: 7.5mm; } .top span { font-size: 7pt; font-weight: 700; letter-spacing: .18em; color: #1F6FEB; }
    .mid { display: grid; grid-template-columns: 19mm 1fr 17mm; gap: 2.5mm; padding: 2.5mm 3.5mm; align-items: center; }
    .ph { width: 19mm; height: 23mm; border-radius: 1.5mm; object-fit: cover; background: #e3edfd; display: grid; place-items: center; font-size: 16pt; font-weight: 700; color: #1F6FEB; border: .3mm solid #c9d3e6; }
    .nm { font-weight: 700; font-size: 10pt; line-height: 1.15; }
    .lb { font-size: 6pt; letter-spacing: .12em; color: #5a6888; margin-top: 1.2mm; text-transform: uppercase; }
    .id { font: 700 12pt ui-monospace, 'Courier New', monospace; letter-spacing: .04em; color: #1F6FEB; line-height: 1.1; }
    .bt { font-size: 6.6pt; color: #3a4a6b; line-height: 1.3; margin-top: 1mm; }

/* ---------- find a student (type an ID, or scan their card with a USB/phone scanner) ---------- */
function viewFees() {
  shell('fees', `<h1>Collect fees</h1>

/* ---------- one student's fee page ---------- */
async function viewCollect(id) {
  shell('fees', '<p class="muted">Loading…</p>');
  let a;
  try { a = await api('feeAccount', { studentId: id }); } catch (e) { return pageError(e); }
  const s = a.student, tk = n => money(n);
  const chip = m => {
    const cls = m.due === 0 ? 'paid' : m.paid > 0 ? 'part' : m.owing ? 'owe' : 'future';
    const label = m.due === 0 ? 'Paid' : m.paid > 0 ? 'Due ' + tk(m.due) : m.owing ? 'Due' : 'Advance';
    return `<label class="mchip ${cls}" title="${esc(monthName(m.month))}: fee ${tk(m.fee)}, paid ${tk(m.paid)}">
      <input type="checkbox" data-key="${esc(m.key)}" data-due="${m.due}" ${m.due === 0 ? 'disabled' : ''}><span><b>${esc(monthName(m.month))}</b><small>${label}</small></span></label>`;
  };
  $('#main').innerHTML = `
    <p style="margin:0 0 .3rem"><a class="link" href="#/fees">← Collect fees</a> · <a class="link" href="#/student/${encodeURIComponent(s.id)}">Student profile</a></p>
    <div class="card row" style="align-items:center">
      ${s.photo ? `<img src="${esc(imgSrc(s.photo))}" alt="" style="width:3.6rem;height:3.6rem;border-radius:50%;object-fit:cover">` : `<div style="width:3.6rem;height:3.6rem;border-radius:50%;background:var(--ink-soft);color:var(--ink-text);display:grid;place-items:center;font-weight:700;font-size:1.4rem">${esc(s.name[0] || '?')}</div>`}
      <div><h1 style="margin:0">${esc(s.name)}</h1><span class="muted"><code>${esc(s.id)}</code> · ${esc(s.phone)}${s.guardianPhone ? ' · Guardian ' + esc(s.guardianPhone) : ''}</span></div>
      <span class="spacer"></span>
      <div style="text-align:right"><span class="muted" style="font-size:.85rem">Due now</span><br><b style="font-size:1.6rem;color:${a.totalDue ? 'var(--bad)' : 'var(--ok)'}">${tk(a.totalDue)}</b></div>
    </div>
    ${s.status !== 'ACTIVE' ? `<p class="alert" style="margin-top:1rem">This student is ${s.status === 'PENDING' ? 'waiting for approval' : 'blocked'}; fees can't be collected.</p>` : ''}
    <form id="cf" class="stack" style="margin-top:1rem">
      ${a.accounts.length ? a.accounts.map(ac => `<div class="card">
        <div class="row" style="margin-bottom:.6rem"><div><h2>${esc(ac.courseName)} › ${esc(ac.batchName)}</h2>
          <span class="muted">Monthly ${tk(ac.monthlyFee)}${ac.monthlyDiscount ? ` − ${tk(ac.monthlyDiscount)} discount${ac.discountNote ? ' (' + esc(ac.discountNote) + ')' : ''} = <b>${tk(Math.max(0, ac.monthlyFee - ac.monthlyDiscount))}</b>` : ''} · since ${esc(ac.startDate)}${ac.status === 'ENDED' ? ' · left ' + esc(ac.endDate) : ''}</span></div>
          <span class="spacer"></span>${can('fees.discount') ? `<button type="button" class="btn ghost sm" data-disc="${esc(ac.enrollmentId)}" data-cur="${ac.monthlyDiscount}" data-note="${esc(ac.discountNote)}">Monthly discount</button>` : ''}</div>
        ${ac.admission ? `<div class="mchips" style="margin-bottom:.5rem"><label class="mchip ${ac.admission.due ? (ac.admission.paid ? 'part' : 'owe') : 'paid'}"><input type="checkbox" data-key="${esc(ac.admission.key)}" data-due="${ac.admission.due}" ${ac.admission.due ? '' : 'disabled'}><span><b>Admission</b><small>${ac.admission.due ? 'Due ' + tk(ac.admission.due) : 'Paid'}</small></span></label></div>` : ''}
        <div class="mchips">${ac.months.map(chip).join('')}</div>
      </div>`).join('') : '<p class="note">Not enrolled in any batch, so there are no monthly fees. You can still collect other fees below.</p>'}
      <div class="card stack">
        <h2>This payment</h2>
        <div id="lines"></div>
        <div class="row"><button type="button" class="btn ghost sm" id="addOther">+ Other fee (exam, book…)</button><span class="spacer"></span>
          <input class="t" name="coupon" placeholder="Coupon code" style="max-width:10rem;text-transform:uppercase"><button type="button" class="btn ghost sm" id="applyC">Apply</button></div>
        <label class="f"><span>Note on the receipt (optional)</span><input class="t" name="note" maxlength="200"></label>
        <div id="sum" class="row" style="justify-content:flex-end;font-size:1.1rem"></div>
        <p class="alert err" hidden></p>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="collect" ${s.status === 'ACTIVE' ? '' : 'disabled'}>Collect cash & print receipt</button></div>
      </div>
    </form>
    <div class="card" style="margin-top:1rem">
      <h2 style="margin-bottom:.5rem">Payment history</h2>
      <div class="tw"><table><thead><tr><th>Receipt</th><th>Date</th><th>Items</th><th>Amount</th><th>Received by</th><th></th></tr></thead><tbody>
        ${a.receipts.map(r => `<tr${r.status === 'CANCELLED' ? ' style="opacity:.6"' : ''}><td><code>${esc(r.no)}</code>${r.status === 'CANCELLED' ? '<br><span class="pill" style="color:var(--bad)">Cancelled</span>' : ''}</td><td>${esc(when(r.at))}</td>
          <td style="font-size:.88rem">${r.lines.map(l => esc(l.label.replace(/Monthly fee (\d{4}-\d{2}).*/, (m, ym) => monthName(ym) + (l.label.includes('(part)') ? ' (part)' : '')).replace(/^Admission fee.*/, 'Admission'))).join(', ')}</td>
          <td class="n"><b>${tk(r.total)}</b>${r.discount ? `<br><span class="muted" style="font-size:.8rem">−${tk(r.discount)} ${esc(r.coupon)}</span>` : ''}</td><td>${esc(r.receivedByName || r.receivedBy)}</td>
          <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-rc="${esc(r.no)}">Receipt</button>${me.role === 'super' && r.status === 'PAID' ? ` <button class="btn danger sm" data-cancel="${esc(r.no)}">Cancel</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No payments yet.</td></tr>'}
      </tbody></table></div>
    </div>`;
  const f = $('#cf');
  let others = [], preview = null;
  const selected = () => [...f.querySelectorAll('[data-key]:checked')].map(c => ({ key: c.dataset.key, due: +c.dataset.due, label: c.closest('.mchip').querySelector('b').textContent }));
  const draw = () => {
    const sel = selected();
    $('#lines').innerHTML = (sel.length || others.length) ? `<div class="tw"><table><tbody>
      ${sel.map(x => `<tr><td>${esc(x.label)}</td><td style="width:9rem"><input class="t" type="number" min="1" step="1" max="${x.due}" value="${esc(String(amounts[x.key] ?? x.due))}" data-amt="${esc(x.key)}" style="text-align:right"></td></tr>`).join('')}
      ${others.map((o, i) => `<tr><td><input class="t" placeholder="e.g. Exam fee" value="${esc(o.label)}" data-ol="${i}"></td><td style="width:9rem"><input class="t" type="number" min="1" value="${esc(String(o.amount || ''))}" data-oa="${i}" style="text-align:right"></td><td><button type="button" class="link" data-orm="${i}">remove</button></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted" style="margin:0">Tick the months above (and/or add other fees). You can lower an amount for a part payment.</p>';
    const sub = sel.reduce((t, x) => t + Number(amounts[x.key] ?? x.due), 0) + others.reduce((t, o) => t + (Number(o.amount) || 0), 0);
    const disc = preview && preview.discount ? preview.discount : 0;
    $('#sum').innerHTML = `${disc ? `<span class="muted">Subtotal ${tk(sub)} · Coupon −${tk(disc)} ·</span>` : ''}<b>Total ${tk(sub - disc)}</b>`;
    f.querySelectorAll('[data-amt]').forEach(i => i.oninput = () => { amounts[i.dataset.amt] = i.value; preview = null; drawSum(); });
    f.querySelectorAll('[data-ol]').forEach(i => i.oninput = () => { others[+i.dataset.ol].label = i.value; });
    f.querySelectorAll('[data-oa]').forEach(i => i.oninput = () => { others[+i.dataset.oa].amount = i.value; preview = null; drawSum(); });
    f.querySelectorAll('[data-orm]').forEach(b => b.onclick = () => { others.splice(+b.dataset.orm, 1); preview = null; draw(); });
  };
  const amounts = {};
  const drawSum = () => {
    const sel = selected();
    const sub = sel.reduce((t, x) => t + Number(amounts[x.key] ?? x.due), 0) + others.reduce((t, o) => t + (Number(o.amount) || 0), 0);
    $('#sum').innerHTML = `<b>Total ${tk(sub)}</b>`;
  };
  const payload = () => ({ studentId: s.id, coupon: f.coupon.value.trim(), note: f.note.value.trim(),
    lines: selected().map(x => ({ key: x.key, amount: Number(amounts[x.key] ?? x.due) })).concat(others.map(o => ({ label: o.label, amount: Number(o.amount) }))) });
  f.querySelectorAll('[data-key]').forEach(c => c.onchange = () => { preview = null; draw(); });
  $('#addOther').onclick = () => { others.push({ label: '', amount: '' }); draw(); };
  $('#applyC').onclick = async () => {
    const box = f.querySelector('.err'); box.hidden = true;
    try { preview = await api('feePreview', payload()); draw(); toast(preview.discount ? 'Coupon applied' : 'No discount'); } catch (x) { preview = null; box.hidden = false; box.textContent = errText(x); }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const box = f.querySelector('.err'); box.hidden = true;
    const p = payload();
    if (p.lines.some(l => !(l.amount > 0))) { box.hidden = false; box.textContent = 'Every amount must be more than 0.'; return; }
    try {
      const pv = await api('feePreview', p);
      if (!confirm(`Collect ${tk(pv.total)} in cash from ${s.name}?${pv.discount ? `\n(Coupon ${pv.coupon}: −${tk(pv.discount)})` : ''}`)) return;
      const r = await api('feeCollect', p);
      printReceipt(r.receipt); toast('Receipt ' + r.receipt.no + ' saved'); viewCollect(s.id);
    } catch (x) { box.hidden = false; box.textContent = errText(x); }
  };
  document.querySelectorAll('[data-rc]').forEach(b => b.onclick = async () => { try { printReceipt((await api('receiptGet', { no: b.dataset.rc })).receipt); } catch (x) { toast(errText(x)); } });
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    const reason = prompt(`Cancel receipt ${b.dataset.cancel}? It stays on record, marked cancelled, and its months become due again.\n\nReason:`);
    if (!reason) return;
    try { await api('receiptCancel', { no: b.dataset.cancel, reason }); toast('Receipt cancelled'); viewCollect(s.id); } catch (x) { toast(errText(x)); }
  });
  document.querySelectorAll('[data-disc]').forEach(b => b.onclick = async () => {
    const v = prompt('Monthly discount for this student in this batch (৳ per month, 0 for none):', b.dataset.cur || '0');
    if (v === null) return;
    const note = prompt('Reason (e.g. sibling, merit):', b.dataset.note || '');
    try { await api('enrollDiscount', { enrollmentId: b.dataset.disc, monthlyDiscount: Number(v), note: note || '' }); toast('Discount saved'); viewCollect(s.id); } catch (x) { toast(errText(x)); }
  });
  draw();
}

        ${r.cancelled ? `<div class="stat"><b style="color:var(--bad)">${money(r.cancelled)}</b><span>cancelled (not counted)</span></div>` : ''}</div>
      <div class="card tw" style="margin-top:1rem"><table><thead><tr><th>Receipt</th><th>Time</th><th>Student</th><th>Amount</th><th>Received by</th><th></th></tr></thead><tbody>
      ${r.receipts.map(x => `<tr${x.status === 'CANCELLED' ? ' style="opacity:.55;text-decoration:line-through"' : ''}><td><code>${esc(x.no)}</code></td><td>${esc(when(x.at))}</td><td><a href="#/collect/${encodeURIComponent(x.studentId)}">${esc(x.studentName)}</a> <span class="muted">${esc(x.studentId)}</span></td>
        <td class="n"><b>${money(x.total)}</b></td><td>${esc(x.receivedByName || x.receivedBy)}</td><td style="text-align:right"><button class="btn ghost sm" data-rc="${esc(x.no)}">Receipt</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No receipts in this period.</td></tr>'}</tbody></table></div>`;
    document.querySelectorAll('[data-rc]').forEach(b => b.onclick = async () => { try { printReceipt((await api('receiptGet', { no: b.dataset.rc })).receipt); } catch (x) { toast(errText(x)); } });
    $('#xl').disabled = !r.receipts.length;
    $('#xl').onclick = () => downloadXlsx('cash-' + r.from + '_' + r.to, [['Receipts', [['Receipt', 'Date & time', 'Student ID', 'Student', 'Amount', 'Discount', 'Coupon', 'Received by', 'Status', 'Cancel reason']]
      .concat(r.receipts.map(x => [x.no, when(x.at), x.studentId, x.studentName, x.total, x.discount, x.coupon, x.receivedByName || x.receivedBy, x.status, x.cancelReason]))],
      ['By staff', [['Staff', 'Receipts', 'Total']].concat(r.byStaff.map(x => [x.name, x.count, x.total]))]]);
  };
  $('#rf').onsubmit = e => { e.preventDefault(); load(); };
  load();
}

/* ---------- coupons ---------- */
async function viewCoupons() {
  shell('coupons', '<p class="muted">Loading…</p>');
  let list;
  try { await ensureLms(); list = (await api('couponList')).coupons; } catch (e) { return pageError(e); }
  const draw = () => {
    $('#main').innerHTML = `<div class="row" style="margin-bottom:.2rem"><h1>Coupons & offers</h1><span class="spacer"></span><button class="btn" id="add">+ Add coupon</button></div>
      <p class="lede">The desk types a code when collecting fees. Coupons reduce course fees (monthly and admission), not other fees.</p>
      <div class="card tw"><table><thead><tr><th>Code</th><th>Discount</th><th>Courses</th><th>Valid</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(c => `<tr><td><code>${esc(c.code)}</code>${c.note ? '<br><span class="muted" style="font-size:.85rem">' + esc(c.note) + '</span>' : ''}</td><td>${c.type === 'PERCENT' ? c.value + '%' : money(c.value)}</td>
        <td style="font-size:.88rem">${c.courses.length ? c.courses.map(id => esc(courseName(id))).join(', ') : 'All courses'}</td><td style="font-size:.88rem">${esc(c.validFrom || '…')} → ${esc(c.validTo || '…')}</td>
        <td class="n">${c.used}${c.maxUses ? ' / ' + c.maxUses : ''}</td><td>${c.active ? '<span class="pill ok">Active</span>' : '<span class="pill off">Off</span>'}</td>
        <td style="text-align:right"><button class="btn ghost sm" data-c="${esc(c.code)}">Edit</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No coupons yet.</td></tr>'}</tbody></table></div>`;
    $('#add').onclick = () => couponDialog(null);
    document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => couponDialog(list.find(c => c.code === b.dataset.c)));
  };
  const couponDialog = c => dialog(`<h2>${c ? 'Edit coupon' : 'Add a coupon'}</h2><div class="stack">
      <div class="grid2"><label class="f"><span>Code</span><input class="t" name="code" value="${esc(c ? c.code : '')}" ${c ? 'readonly' : 'required'} style="text-transform:uppercase" placeholder="EID25"></label>
        <label class="f"><span>Note (optional)</span><input class="t" name="note" value="${esc(c ? c.note : '')}"></label></div>
      <div class="grid2"><label class="f"><span>Type</span><select class="t" name="type"><option value="PERCENT">Percentage (%)</option><option value="FIXED" ${c && c.type === 'FIXED' ? 'selected' : ''}>Fixed amount (৳)</option></select></label>
        <label class="f"><span>Value</span><input class="t" name="value" type="number" min="1" value="${c ? c.value : ''}" required></label></div>
      <div class="grid2"><label class="f"><span>Valid from</span><input class="t" name="vf" type="date" value="${esc(c ? c.validFrom : '')}"></label><label class="f"><span>Valid to</span><input class="t" name="vt" type="date" value="${esc(c ? c.validTo : '')}"></label></div>
      <label class="f" style="max-width:12rem"><span>Max uses (0 = unlimited)</span><input class="t" name="max" type="number" min="0" value="${c ? c.maxUses : 0}"></label>
      <fieldset style="border:1px solid var(--line);border-radius:6px;padding:.6rem .8rem"><legend style="font-weight:600;font-size:.88rem">Only for these courses (none ticked = all)</legend>
        ${lms.courses.map(x => `<label class="check"><input type="checkbox" name="cr" value="${esc(x.id)}" ${c && c.courses.includes(x.id) ? 'checked' : ''}> ${esc(x.name)}</label>`).join('') || '<span class="muted">No courses yet.</span>'}</fieldset>
      <label class="check"><input type="checkbox" name="active" ${!c || c.active ? 'checked' : ''}> Active</label>
    </div>${dlgButtons(c ? 'Save' : 'Add coupon')}`, async (v, f) => {
    list = (await api('couponSave', { isNew: !c, code: f.code.value.trim(), type: f.type.value, value: f.value.value, validFrom: f.vf.value, validTo: f.vt.value, maxUses: f.max.value,
      courses: [...f.querySelectorAll('[name=cr]:checked')].map(x => x.value).join(','), active: f.active.checked, note: f.note.value })).coupons;
    toast('Saved'); draw();
  });
  draw();
}

boot();
})();
</script>
</body>
